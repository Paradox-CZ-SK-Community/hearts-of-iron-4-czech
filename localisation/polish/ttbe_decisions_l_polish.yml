 ROM_balkan_communism: "Rozšířit vliv ve východní Evropě"
 ROM_balkan_communism_desc: "Ačkoli se průmyslovou silou jednotlivě nemůžeme měřit s velmocemi, v poměru ke své velikosti mají naše země značný hospodářský potenciál. Některé vynikají těžbou surovin, jiné vývozem potravin a další se mohou pochlubit zbrojním průmyslem schopným obstát na světovém trhu."
