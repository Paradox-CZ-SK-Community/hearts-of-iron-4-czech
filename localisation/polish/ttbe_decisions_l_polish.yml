 ROM_at_most_3_soviet_influence: "Nejvýše 3 body §Ysovětského vlivu§!."
 ROM_unlock_increased_soviet_support_tt: "Rozhodnutí o sovětské pomoci bude možné přijímat i po překročení 3 bodů §Ysovětského vlivu§!. Získáme tím národního ducha §Y$ROM_soviet_influence_idea$§! a [SOV.GetNameDef] ponese nelibě, pokud s ním nebudeme udržovat dobré vztahy."
 ROM_diplomacy_category_tt: "V této kategorii rozhodnutí můžeme rozšířit naše diplomatické vztahy o omezenou hospodářskou, politickou a vojenskou spolupráci. Každá země, s níž navážeme spolupráci, nám poskytne jedinečné bonusy, které se zvyšují s dosaženou úrovní spolupráce. Další možnosti spolupráce se zpřístupní dokončením určitých národních zaměření."
