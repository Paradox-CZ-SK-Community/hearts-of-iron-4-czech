 form_dacia_category: "Obnovit Dácii"
 form_dacia_category_desc: "Dákové patřili k nejstarším známým kmenům obývajícím území mezi Dunajem a Dněstrem a jejich éra představuje významnou kapitolu našich národních dějin. Jelikož [ROM.GetNonIdeologyName] již má většinu někdejšího dáckého území, musíme se stát majákem prosperity, k němuž se ostatní dnes nezávislé národy tohoto regionu budou ochotně znovu hlásit."
