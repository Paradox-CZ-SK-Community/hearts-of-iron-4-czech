 ROM_recall_nicolae_titulescu: "Povolat Nicolae Titulesca z exilu" # todo: NEW TRANSLATION
 ROM_recall_nicolae_titulescu_desc: "Uvolnění královské diktatury nám dává příležitost povolat zpět jednoho z nejskvělejších, byť kontroverzních diplomatů Evropy. Jeho návrat by světu ukázal, že jsme znovu odhodláni spolupracovat se Západem." # todo: NEW TRANSLATION
 ROM_recall_barbu_stirbey: "Povolat Barbu Stirbeye z exilu" # todo: NEW TRANSLATION
 ROM_recall_barbu_stirbey_desc: "Po odchodu krále Carola II. můžeme povolat Bílého prince zpět, aby nám nabídl svou radu." # todo: NEW TRANSLATION
 ROM_recall_queen_helen: "Povolat královnu matku Helenu z exilu" # todo: NEW TRANSLATION
 ROM_recall_queen_helen_desc: "Po odchodu krále Carola II. můžeme povolat matku krále Michala zpět, aby se ujala své role matky národa a vedla mladého krále." # todo: NEW TRANSLATION
 ROM_elevate_antonescu_to_marshal: "Povýšit Antonesca na polního maršála" # todo: NEW TRANSLATION
 ROM_elevate_antonescu_to_marshal_desc: "Po našem vstupu do Osy už není Ion Antonescu jako politik na svém místě. Musíme ho povýšit na nejvyšší vojenskou hodnost polního maršála a poslat na frontu, aby organizoval naše armády, čímž ho oficiálně stáhneme z politického dění v Bukurešti." # todo: NEW TRANSLATION
 ROM_further_funding_for_the_academies: "Další financování akademií" # todo: NEW TRANSLATION
 ROM_anti_extremist_crusade_cat: "Protiextrémistická křížová výprava" # todo: NEW TRANSLATION
 ROM_anti_extremist_crusade_cat_desc: "Jako silný muž východní Evropy máme povinnost aktivně rozkládat extremistické režimy, které ohrožují rovnováhu sil. Nebudeme tolerovat žádné radikální rozvracení pořádku." # todo: NEW TRANSLATION
 ROM_crush_radicalism_within_TAG: "Potlačit radikalismus v [FROM.GetNameDefCap]" # todo: NEW TRANSLATION
 ROM_crush_radicalism_within_TAG_desc: "Politická situace v [FROM.GetName] se stala naprosto nepřijatelnou. Jejich oddanost radikálním totalitním ideologiím představuje přímou hrozbu stabilitě celého regionu. Musíme jim předložit poslední ultimátum: rozložte své extremistické instituce, nebo budeme nuceni překročit hranice a násilím dosadit poslušnou, umírněnou vládu." # todo: NEW TRANSLATION
 ROM_crush_the_fascist_menace_ger: "Zasáhnout proti Německé říši" # todo: NEW TRANSLATION
 ROM_crush_the_fascist_menace_ger_desc: "Nekontrolovaný německý militarismus a oddanost národnímu socialismu hrozí uvrhnout celý kontinent do plamenů. Musíme udeřit dřív, než bude Německo příliš mocné na to, abychom ho zastavili, svrhnout jeho režim a zneškodnit fašistickou hrozbu." # todo: NEW TRANSLATION
 ROM_crush_the_communist_menace_sov: "Zasáhnout proti Sovětskému svazu" # todo: NEW TRANSLATION
 ROM_crush_the_communist_menace_sov_desc: "Bolševický režim v Moskvě je pohromou pro východní Evropu a neustále se snaží šířit svou násilnou revoluci. Musíme se stát štítem civilizace a zahájit preventivní úder, který jednou provždy rozloží jejich komunistický aparát." # todo: NEW TRANSLATION
 ROM_crush_the_fascist_menace_ita: "Zasáhnout proti fašistické Itálii" # todo: NEW TRANSLATION
 ROM_crush_the_fascist_menace_ita_desc: "Mussoliniho imperiální ambice ve Středomoří a na Balkáně přímo ohrožují naše vlastní bezpečnostní zájmy. Musíme zorganizovat tažení, svrhnout Duceho a obnovit v Římě rozumnou, umírněnou vládu." # todo: NEW TRANSLATION
 ROM_diplo_royal_state_visit: "Zorganizovat státní návštěvu krále" # todo: NEW TRANSLATION
 ROM_diplo_royal_state_visit_desc: "Vyslání krále nebo vysoce postaveného člena královské rodiny na návštěvu hlavního města našeho spojence posílí pouta mezi našimi vládami a ukáže světu, že držíme při sobě." # todo: NEW TRANSLATION
 ROM_diplo_joint_military_maneuvers: "Uspořádat společné vojenské manévry" # todo: NEW TRANSLATION
 ROM_diplo_joint_military_maneuvers_desc: "Propojením našich generálních štábů a pořádáním rozsáhlých válečných her poblíž hranic získají naše ozbrojené síly i armády spojenců neocenitelné taktické zkušenosti." # todo: NEW TRANSLATION
 ROM_diplo_economic_integration: "Prohloubit hospodářskou integraci" # todo: NEW TRANSLATION
 ROM_diplo_economic_integration_desc: "Investicemi našeho civilního průmyslu do přeshraniční logistiky a společných vojenských továren trvale zvýšíme hospodářský výkon naší aliance." # todo: NEW TRANSLATION
 ROM_action_in_progress_flag: "Právě prohlubuje hospodářskou integraci s jinou zemí." # todo: NEW TRANSLATION
 ROM_invitation_to_the_pact: "Pozvání do paktu" # todo: NEW TRANSLATION
 ROM_sell_current_harvest: "Navrhnout prodej sklizně" # todo: NEW TRANSLATION
 ROM_sell_current_harvest_desc: "Každý rok vyvážíme do všech ostatních evropských zemí tuny obilovin a živočišných produktů. Můžeme se rozhodnout, že letos jednorázově vyvezeme část současné sklizně navíc do [FROM.GetName]." # todo: NEW TRANSLATION
 ROM_bring_back_bicycle_infantry: "Vrátit cyklistickou pěchotu do služby" # todo: NEW TRANSLATION
 ROM_demand_guarantees: "Požadovat záruky" # todo: NEW TRANSLATION
 ROM_grant_tax_exemptions: "Udělit celní výjimky" # todo: NEW TRANSLATION
 ROM_grant_tax_exemptions_desc: "Přísné vymáhání našich současných cel zatěžuje mezinárodní obchod. Udělením cílené daňové výjimky pro [FROM.GetNameDef] můžeme usnadnit těžbu surovin pro jejich průmysl a posílit naše vzájemné vztahy.\n\n§YVýjimka se vztahuje k našim současným daňovým reformám a automaticky pozbude platnosti, jakmile budou tato opatření zrušena nebo dokončena.§!" # todo: NEW TRANSLATION
 ROM_diplo_visit_pzl_factory: "Navštívit letecké závody PZL" # todo: NEW TRANSLATION
 ROM_diplo_visit_pzl_factory_desc: "Naše probíhající licenční výroba polských letadel se ukázala jako velmi přínosná. Financováním společné inženýrské delegace, která navštíví hlavní výrobní závody Państwowe Zakłady Lotnicze v Polsku, mohou naši letečtí odborníci získat neocenitelné praktické zkušenosti a technické poznatky, které urychlí náš vlastní letecký výzkum." # todo: NEW TRANSLATION
 ROM_diplo_invite_french_military_mission: "Pozvat francouzskou vojenskou misi" # todo: NEW TRANSLATION
 ROM_diplo_invite_french_military_mission_desc: "Francie zůstává přední pozemní mocností Evropy a její strategické doktríny se těší velkému uznání našeho generálního štábu." # todo: NEW TRANSLATION
 ROM_diplo_french_capital_in_romanian_oil: "Francouzský kapitál v rumunské ropě" # todo: NEW TRANSLATION
 ROM_diplo_french_capital_in_romanian_oil_desc: "Francouzští investoři měli historicky v rumunském ropném průmyslu významné podíly. Vyjednání nové sady výnosných koncesí s francouzskými konglomeráty by mohlo zajistit kapitál a těžké stroje potřebné k rychlému rozšíření těžby v údolí Prahova." # todo: NEW TRANSLATION
 ROM_diplo_import_skoda_artillery: "Dovážet dělostřelectvo a munici Škoda" # todo: NEW TRANSLATION
 ROM_diplo_import_skoda_artillery_desc: "Plzeňská Škodovka vyrábí jedny z nejlepších dělostřeleckých zbraní na světě. Můžeme rychle vybavit naše divize kvalitními československými těžkými zbraněmi a podpůrným vybavením, aniž bychom zatížili vlastní zbrojní průmysl." # todo: NEW TRANSLATION
 ROM_diplo_contract_foreign_labor: "Najmout průmyslové dělníky z [FROM.GetAdjective]" # todo: NEW TRANSLATION
 ROM_diplo_contract_foreign_labor_desc: "Rychlý rozvoj průmyslu hrozí překonat možnosti našeho domácího trhu práce. Uzavřením dvoustranných pracovních dohod s [FROM.GetNameDef] můžeme získat tisíce sezónních dělníků pro civilní sektor a uvolnit tak rumunské pracovní síly pro klíčové stavební projekty." # todo: NEW TRANSLATION
 ROM_diplo_negotiate_industrial_exports: "Vyjednat vývoz těžkého průmyslového zboží" # todo: NEW TRANSLATION
 ROM_diplo_joint_border_infrastructure: "Společný pohraniční projekt [FROM.GetAdjective]-[ROOT.GetAdjective]" # todo: NEW TRANSLATION
 ROM_diplo_joint_border_infrastructure_desc: "Terén podél našich společných hranic s [FROM.GetNameDef] byl vždy obtížně průchodný. Spojením našich inženýrských kapacit a společným plánováním infrastrukturních koridorů můžeme v tomto regionu během příštího půlroku výrazně urychlit výstavbu železnic, zásobovacích uzlů a silnic." # todo: NEW TRANSLATION
 ROM_diplo_invite_brno_engineers: "Najmout inženýry ze Zbrojovky Brno" # todo: NEW TRANSLATION
 ROM_diplo_invite_brno_engineers_desc: "Ačkoli se náš domácí průmysl, například Cugir, rozrůstá, stále nám chybí technické znalosti potřebné k maximálnímu zvýšení produkce továren. Zaměstnání zkušených inženýrů a vedoucích výroby z renomovaných závodů Zbrojovky Brno zlepší efektivitu našich vojenských montážních linek." # todo: NEW TRANSLATION
 ROM_diplo_seize_military: "Zabavit vojenský majetek země [FROM.GetAdjective]" # todo: NEW TRANSLATION
 ROM_diplo_seize_civilian: "Zabavit civilní majetek země [FROM.GetAdjective]" # todo: NEW TRANSLATION
 ROM_a_peoples_militia: "Lidová milice" # todo: NEW TRANSLATION
 ROM_a_peoples_militia_desc: "Jednou z prvních myšlenek komunistické strany [ROOT.GetAdjective] bylo vytvořit skutečnou občanskou milici. Výcvikem a vyzbrojením našich občanů jim umožníme pomáhat při obraně země.\n\nV současnosti aktivní jednotky milice: [?ROM.militia_template_count]" # todo: NEW TRANSLATION
