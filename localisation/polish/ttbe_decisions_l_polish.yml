 ROM_recall_nicolae_titulescu: "Povolat Nicolaea Titulesca z exilu"
 ROM_recall_nicolae_titulescu_desc: "Uvolnění královské diktatury nám dává příležitost povolat zpět jednoho z nejnadanějších, byť kontroverzních evropských diplomatů. Jeho návrat by byl jasným signálem našeho obnoveného příklonu k Západu."
 ROM_recall_barbu_stirbey: "Povolat Barbu Știrbeye z exilu"
 ROM_recall_barbu_stirbey_desc: "Po odchodu krále Karla II. můžeme povolat z exilu Bílého prince, aby nám opět poskytoval své rady."
 ROM_recall_queen_helen: "Povolat královnu matku Elenu z exilu"
 ROM_recall_queen_helen_desc: "Po odchodu krále Karla II. můžeme povolat z exilu matku krále Michala, aby se znovu ujala svých povinností matky národa a poskytovala mladému panovníkovi vedení."
 ROM_elevate_antonescu_to_marshal: "Povýšit Antonesca na polního maršála"
 ROM_elevate_antonescu_to_marshal_desc: "Po našem vstupu do Osy již není vhodné, aby Ion Antonescu nadále působil jako politik. Musíme jej povýšit na nejvyšší vojenskou hodnost polního maršála a vyslat na frontu, kde převezme organizaci našich armád. Tím bude oficiálně zbaven účasti na politickém dění v Bukurešti."
 ROM_further_funding_for_the_academies: "Další financování akademií"
 ROM_anti_extremist_crusade_cat: "Křížová výprava proti extremismu"
 ROM_anti_extremist_crusade_cat_desc: "Jako dominantní mocnost východní Evropy máme povinnost aktivně rozvracet extremistické režimy ohrožující rovnováhu sil. Žádné radikální podvratné aktivity nebudeme tolerovat."
 ROM_crush_radicalism_within_TAG: "Potlačit radikalismus – [FROM.GetNameDefCap]"
 ROM_crush_radicalism_within_TAG_desc: "[FROM.GetAdjectiveCap] politická situace se stala naprosto nepřijatelnou. Příklon tamního režimu k radikálním totalitním ideologiím představuje přímou hrozbu pro stabilitu celého regionu. Musíme předložit poslední ultimátum: buď budou extremistické instituce rozpuštěny, nebo překročíme hranice a silou dosadíme umírněnou vládu ochotnou s námi spolupracovat."
 ROM_crush_the_fascist_menace_ger: "Zasáhnout proti Německé říši"
 ROM_crush_the_fascist_menace_ger_desc: "Bezuzdný německý militarismus a oddanost národnímu socialismu hrozí uvrhnout celý kontinent do plamenů. Musíme udeřit dříve, než Německo získá takovou moc, že jej již nebude možné zastavit. Svržením tamního režimu odstraníme fašistickou hrozbu."
 ROM_crush_the_communist_menace_sov: "Zasáhnout proti Sovětskému svazu"
 ROM_crush_the_communist_menace_sov_desc: "Bolševický režim v Moskvě je morem východní Evropy a neustále usiluje o vývoz své násilné revoluce. Musíme se stát štítem civilizace a zahájit preventivní úder, který jednou provždy rozvrátí sovětský komunistický aparát."
 ROM_crush_the_fascist_menace_ita: "Zasáhnout proti fašistické Itálii"
 ROM_crush_the_fascist_menace_ita_desc: "Mussoliniho imperiální ambice ve Středomoří a na Balkáně jsou v přímém rozporu s našimi bezpečnostními zájmy. Musíme připravit vojenské tažení, které svrhne Duceho a obnoví v Římě rozumnou, umírněnou vládu."
 ROM_diplo_royal_state_visit: "Uspořádat královskou státní návštěvu"
 ROM_diplo_royal_state_visit_desc: "Vyslání krále či jiného vysoce postaveného člena královské rodiny na návštěvu hlavního města našeho spojence posílí vazby mezi našimi vládami a ukáže světu naši jednotu."
 ROM_diplo_joint_military_maneuvers: "Uspořádat společné vojenské manévry"
 ROM_diplo_joint_military_maneuvers_desc: "Prohloubením spolupráce našich generálních štábů a pořádáním rozsáhlých vojenských cvičení v pohraničí získají naše i spojenecké ozbrojené síly neocenitelné taktické zkušenosti."
 ROM_diplo_economic_integration: "Prohloubit hospodářskou integraci"
 ROM_diplo_economic_integration_desc: "Investice našeho civilního průmyslu do přeshraniční logistiky a společných vojenských továren trvale zvýší hospodářskou výkonnost celé naší aliance."
 ROM_action_in_progress_flag: "Právě probíhá prohlubování hospodářské integrace s jinou zemí."
 ROM_invitation_to_the_pact: "Pozvání do paktu"
 ROM_sell_current_harvest: "Nabídnout prodej letošní sklizně"
 ROM_sell_current_harvest_desc: "Každoročně vyvážíme do ostatních evropských zemí tuny obilovin a živočišných produktů. Můžeme se rozhodnout jednorázově navýšit vývoz z letošní sklizně pro [FROM.GetName]."
 ROM_bring_back_bicycle_infantry: "Znovu zavést cyklistickou pěchotu"
 ROM_demand_guarantees: "Požadovat záruky"
 ROM_grant_tax_exemptions: "Poskytnout celní úlevy"
 ROM_grant_tax_exemptions_desc: "Naše současné přísné uplatňování celních předpisů zatěžuje mezinárodní obchod. Poskytnutím cílených celních úlev pro [FROM.GetNameDef] můžeme usnadnit levnější těžbu surovin pro její průmysl a posílit naše vzájemné vztahy.\n\n§YTato výjimka je vázána na naše současné daňové reformy a automaticky vyprší, jakmile budou příslušná opatření zrušena nebo ukončena.§!"
 ROM_diplo_visit_pzl_factory: "Navštívit letecké závody PZL"
 ROM_diplo_visit_pzl_factory_desc: "Naše probíhající licenční výroba polských leteckých konstrukcí se ukázala jako velmi přínosná. Financováním společné technické delegace, která navštíví hlavní výrobní závody Państwowe Zakłady Lotnicze v Polsku, mohou naši letečtí odborníci získat neocenitelné praktické zkušenosti a technické poznatky, jež urychlí náš vlastní letecký výzkum."
 ROM_diplo_invite_french_military_mission: "Pozvat francouzskou vojenskou misi"
 ROM_diplo_invite_french_military_mission_desc: "Francie zůstává přední pozemní mocností Evropy a její strategické doktríny požívají mezi členy našeho generálního štábu značné úcty."
 ROM_diplo_french_capital_in_romanian_oil: "Francouzský kapitál v rumunském ropném průmyslu"
 ROM_diplo_french_capital_in_romanian_oil_desc: "Francouzští investoři mají v rumunském ropném průmyslu již tradičně významné podíly. Vyjednáním nových výnosných koncesí s francouzskými koncerny bychom mohli získat kapitál a těžké strojní vybavení potřebné k rychlému rozšíření těžby ropy v údolí řeky Prahovy."
 ROM_diplo_import_skoda_artillery: "Dovážet dělostřelectvo a munici ze Škodových závodů"
 ROM_diplo_import_skoda_artillery_desc: "Škodovy závody v Plzni vyrábějí jedny z nejlepších dělostřeleckých zbraní na světě. Díky dovozu kvalitních československých těžkých zbraní a podpůrného vybavení můžeme rychle vyzbrojit naše divize, aniž bychom nadměrně zatěžovali vlastní zbrojní průmysl."
 ROM_diplo_contract_foreign_labor: "Najmout průmyslové pracovníky ze země [FROM.GetNameDef]"
 ROM_diplo_contract_foreign_labor_desc: "Naše rychlá průmyslová expanze hrozí vyčerpat dostupné domácí pracovní síly. Uzavření dvoustranných pracovních dohod se zemí [FROM.GetNameDef] nám umožní přivést tisíce sezónních pracovníků do civilního průmyslu, a uvolnit tak rumunské pracovní síly pro klíčové stavební projekty."
 ROM_diplo_negotiate_industrial_exports: "Vyjednat vývoz těžkého průmyslu"
 ROM_diplo_joint_border_infrastructure: "Společný pohraniční projekt zemí [FROM.GetNameDef] a [ROOT.GetNameDef]"
 ROM_diplo_joint_border_infrastructure_desc: "Terén podél našich společných hranic se zemí [FROM.GetNameDef] byl vždy obtížně průchodný. Spojením našich technických kapacit a společným plánováním infrastrukturních koridorů můžeme během následujícího půlroku výrazně urychlit výstavbu železnic, zásobovacích uzlů a silnic v této oblasti."
 ROM_diplo_invite_brno_engineers: "Najmout inženýry ze Zbrojovky Brno"
 ROM_diplo_invite_brno_engineers_desc: "Přestože se naše domácí průmyslové podniky, jako například závody v Cugiru, rozrůstají, stále nám chybějí odborné znalosti potřebné k dosažení maximální výrobní kapacity. Najmutí zkušených inženýrů a vedoucích výroby z proslulé Zbrojovky Brno zvýší efektivitu našich vojenských výrobních linek."
 ROM_diplo_seize_military: "Zabavit [FROM.GetAdjective] vojenský majetek"
 ROM_diplo_seize_civilian: "Zabavit [FROM.GetAdjective] civilní majetek"
 ROM_a_peoples_militia: "Lidová domobrana"
 ROM_a_peoples_militia_desc: "Jednou z prvních myšlenek komunistické strany naší země bylo vytvoření skutečné občanské domobrany. Výcvikem a vyzbrojením obyvatelstva mu umožníme aktivně se podílet na obraně země.\n\nV současnosti aktivní jednotky domobrany: [?ROM.militia_template_count]"
