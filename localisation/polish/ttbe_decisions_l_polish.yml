 ROM_relation_about_to_decrease_loc: "\n\nBrzy ztratíme jednu úroveň spolupráce se zemí §Y[THIS.GetNameDef]§!"
 ROM_reduced_cost_loc: "\n\nJelikož jsme dosáhli maximální úrovně vztahů, její udržování nyní vyžaduje nižší náklady."
 ROM_relation_explanation: "Pomocí výše uvedených tlačítek můžete vybírat možnosti spolupráce s jednotlivými zeměmi.\n\nRozvíjení spolupráce v současnosti stojí §Y[?ROM.ROM_one_country_relations_boosting_cost]§! £GFX_pol_power  denně za každou zemi. Současně můžeme rozvíjet vztahy nejvýše s 5 zeměmi. V ostatních zemích bude úroveň spolupráce postupně klesat."
