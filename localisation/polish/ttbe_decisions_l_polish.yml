 form_dacia_category: "Znovu vytvořit Dácii" # todo: NEW TRANSLATION
 form_dacia_category_desc: "Jako nejstarší proslulé kmeny obývající oblast mezi Dunajem a Dněstrem představují Dákové důležitý historický odkaz našeho národa. Většinu někdejšího území Dáků zdědila [ROM.GetNonIdeologyName], a proto musíme ukázat, že jsme majákem prosperity, s nímž by se ostatní nyní nezávislé národy v regionu rády znovu sjednotily." # todo: NEW TRANSLATION
