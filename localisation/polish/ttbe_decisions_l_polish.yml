 ROM_reduced_cost_loc: "\n\nDosáhli jsme maximální úrovně vztahů, takže udržování této úrovně je nyní levnější." # todo: NEW TRANSLATION
 ROM_relation_explanation: "Pomocí výše uvedených tlačítek vyberte možnosti spolupráce s jednotlivými zeměmi.\n\nBudování spolupráce nyní stojí §Y[?ROM.ROM_one_country_relations_boosting_cost]§! £GFX_pol_power  politické síly denně za každou zemi. To můžeme provádět nejvýše v 5 zemích současně. V ostatních zemích bude spolupráce pomalu klesat." # todo: NEW TRANSLATION
