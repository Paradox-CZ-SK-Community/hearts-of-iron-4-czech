 ROM_balkan_communism: "Rozšířit vliv ve východní Evropě" # todo: NEW TRANSLATION
 ROM_balkan_communism_desc: "Ačkoli se naše individuální průmyslová síla nemůže měřit s velmocemi, vzhledem k velikosti našich zemí jsou některé z nich obry v produkci surovin, jiné ve vývozu potravin a další se mohou pochlubit zbrojním průmyslem konkurenceschopným na světovém trhu." # todo: NEW TRANSLATION
