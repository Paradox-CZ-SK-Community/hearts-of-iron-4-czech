 ROM_recently_refused_harvest_tt: "Neplatí: §Y[FROM.GetNameDefCap]§! nedávno §Rodmítla§! naši nabídku prodeje úrody."
 ROM_accepted_harvest_tt: "Neplatí: §Y[FROM.GetNameDefCap]§! §Gpřijala§! naši nabídku prodeje úrody."
 ROM_antonescu_gang_arrested_tt: "§RNásledující poradci budou zatčeni:§!"
 ROM_relax_the_royal_dictatorship_tt: "§YStrategická poznámka:§! Nad Evropou se stahují válečná mračna a čas je luxus, který si již nemůžeme dovolit. Musíme rychle jednat a zajistit si spolehlivé spojence. Pouze urychleným rozšířením naší diplomatické sítě můžeme doufat, že odoláme vlně extremistického revizionismu, která zachvacuje celý kontinent."
 ROM_iron_guard_agitation_category_desc: "Teror legionářského hnutí ohrožuje samotnou stabilitu našeho národa. Aby stát jednou provždy ukončil politické násilí, musí se rozhodně vypořádat s jeho fanatickým vůdcem Corneliem Zeleou Codreanem. Odstranění vedení hnutí a otevření cesty pragmatičtějšímu vedení nakonec umožní strategické sblížení s Německou říší."
 ROM_unlock_decision_ROM_further_funding_for_the_academies: "Po dokončení rozhodnutí za 90 dní získáme následující účinky:\n\n"
 ROM_increase_state_category_infra_tt: "Každý §Ystát§!, který je naším §Ydomovským územím§! a má §Yinfrastrukturu§! na úrovni §Y4§! nebo vyšší, získá vyšší §Ykategorii státu§!, čímž se odemknou další stavební pozice.\n\nStáty, které mají v současnosti §Yinfrastrukturu na úrovni 3§!, budou nejprve vylepšeny na §Yúroveň 4§!, a tím automaticky splní podmínky pro zvýšení kategorie."
