 ROM_general_election_warning_tt: "§RVarování:§! Uspořádání těchto problematických voleb vyvolá vážnou politickou krizi, která nevyhnutelně povede k úplnému zhroucení současné vlády."
 ROM_public_works_events_tt: "Během následujícího roku bude zahájena řada významných veřejných staveb a slavnostních otevření národních památek, které poskytnou různé bonusy ke §Ystabilitě§! a §Ypolitické síle§!."
