l_polish:
 landmark_arcul_de_triumf: "Vítězný oblouk"
 landmark_arcul_de_triumf_desc: "Monumentální stavba stojící na Kiseleffově třídě v severní části Bukurešti. V roce 1936 byla přestavěna z masivního kamene a slavnostně otevřena na památku vítězství národa v první světové válce a sjednocení Velkého Rumunska. V srdcích a myslích obyvatel představuje mocný symbol vojenské statečnosti a národní jednoty."
 ROM_military_virtue_medal: "Vojenská medaile za statečnost"
 ROM_military_virtue_medal_desc: "Vojenská medaile za statečnost se uděluje důstojníkům a vojákům za projevy odvahy a oddanosti na bojišti. Představuje základ rumunské vojenské cti."
 ROM_order_of_the_crown: "Řád rumunské koruny"
 ROM_order_of_the_crown_desc: "Tento řád, založený králem Carolem I., se ve variantě s meči uděluje velitelům a štábním důstojníkům za mimořádně záslužnou službu, vynikající organizační schopnosti a výjimečné velení."
 ROM_order_of_the_star: "Řád rumunské hvězdy"
 ROM_order_of_the_star_desc: "Nejstarší všeobecný záslužný řád rumunského státu. Ve variantě s meči se uděluje za vojenské zásluhy velitelům jednotek, kteří prokázali mimořádné taktické schopnosti a oddanost národu."
 ROM_order_of_michael_the_brave: "Řád Michala Chrabrého"
 ROM_order_of_michael_the_brave_desc: "Absolutně nejvyšší vojenské vyznamenání Rumunska, založené králem Ferdinandem I. Uděluje se výhradně důstojníkům za nejvýjimečnější hrdinské činy a úspěšné vedení významných vojenských tažení."
 ROM_order_of_faithful_service: "Řád věrné služby"
 ROM_order_of_faithful_service_desc: "Tento prestižní řád, založený v roce 1932, se ve variantě s meči uděluje důstojníkům, kteří během aktivních bojových operací prokázali mimořádnou oddanost, taktické schopnosti a věrnou službu národu."
