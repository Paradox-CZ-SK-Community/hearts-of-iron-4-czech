 ROM_DON_cores_tip_tt: "§YKozácký stát§! získá následující státy jako domovská území: §Y[218.GetName]§!, §Y[245.GetName]§!, §Y[234.GetName]§!, §Y[233.GetName]§!, §Y[235.GetName]§!"
 ROM_unite_the_caucasus_decision_tt: "Odemkne rozhodnutí: §Y$ROM_unite_the_caucasus_decision$§!\n\nPo aktivaci:\n"
 ROM_corneliu_faction: "Legie archanděla Michaela"
 ROM_germany_faction: "Osa Berlín-Bukurešť"
 ROM_aggressive_diplomacy: "Agresivní vyjednávání"
 ROM_aggressive_diplomacy_desc: "Tomu říkáme diplomatické řešení. Svět se zjevně přiklání k extremistickým hnutím, která obelhávají obyvatelstvo a obracejí jeho hněv a utrpení proti ostatním. Musíme udělat vše, co je nezbytné, abychom zabránili Evropě propadnout se do nekonečného koloběhu nenávisti, i kdybychom ostatním museli jejich záchranu vnutit."
 ROM_the_palace_coup: "Palácový převrat"
 ROM_the_palace_coup_desc: "Nevypočitatelné chování krále Carola II. a jeho zkorumpovaná kamarilla ohrozily národ naposledy. Koalice důstojníků věrných koruně, konzervativních státníků a mladého korunního prince Michaela se chystá nenápadně zajistit královský palác, přinutit Carola k abdikaci a nastolit silný monarchistický režim odmítající extremismus."
 ROM_the_bucharest_security_convention: "Bukurešťská bezpečnostní úmluva"
 ROM_the_bucharest_security_convention_desc: "Nyní, když se monarchie proměnila v neústupnou baštu proti extremismu, musíme svolat naše regionální spojence do Bukurešti. Společně vytvoříme jednotnou vojenskou frontu, jejímž výhradním cílem bude odrazovat a ničit radikální ideologie ve východní Evropě."
 ROM_bulwark_of_monarchism: "Bašta monarchismu"
 ROM_bulwark_of_monarchism_desc: "Koruna představuje poslední štít proti šílenství krajní levice i krajní pravice. V našich vojácích vypěstujeme neochvějnou oddanost, která je povede k boji proti radikálním podvratným živlům až do hořkého konce."
 ROM_arsenal_of_the_crown: "Arzenál koruny"
 ROM_arsenal_of_the_crown_desc: "Aby naše frakce dokázala čelit radikálním mocnostem, potřebuje rozsáhlou průmyslovou základnu. Urychleně rozšíříme vojenské továrny a sjednotíme výrobní standardy v celé naší alianci."
 ROM_strike_at_the_radicals: "Udeřit na radikály"
 ROM_strike_at_the_radicals_desc: "Samotná obrana již nestačí. Kdykoli některá z významných evropských mocností podlehne totalitnímu fanatismu, Rumunsko a jeho spojenci budou připraveni udeřit jako první a obnovit pořádek."
 ROM_a_flawed_democracy: "Nedokonalá demokracie"
 ROM_a_flawed_democracy_desc: "Naše demokracie má k dokonalosti daleko. Korupce je hluboce zakořeněná, parlament rozdělený a důvěra obyvatelstva ve vládu každým dnem slábne. Musíme tyto nedostatky napravit sami, jinak je proti nám využijí naši nepřátelé."
 ROM_finalize_tax_reforms: "Dokončit daňové reformy"
 ROM_finalize_tax_reforms_desc: "Nastal nejvyšší čas dokončit daňové reformy, které Gheorghe Tătărescu představil po svém jmenování předsedou vlády. Tyto reformy by měly položit základy obnovení prosperity rumunského hospodářství po těžkých následcích velké hospodářské krize."
 ROM_tariff_enforcement: "Důsledné uplatňování cel"
 ROM_tariff_enforcement_desc: "Prvním krokem k zajištění hospodářského růstu Rumunska musí být upřednostnění domácích výrobků. Při dovozu i vývozu bychom se měli především zaměřit na využití vlastních předností a teprve poté se obracet na zahraniční dodavatele."
 ROM_the_new_kingdom: "Vyřešit otázku Nového království"
 ROM_the_new_kingdom_desc: "Od konce první světové války se Rumunsko skládá ze dvou odlišných částí: Starého a Nového království. Právě Nové království nyní požaduje větší pozornost."
 ROM_alleviate_the_rural_communities: "Zmírnit problémy venkovských komunit"
 ROM_alleviate_the_rural_communities_desc: "Rumunské venkovské obyvatelstvo prochází těžkým obdobím, zejména od skončení první světové války. Měli bychom zmírnit alespoň některé jeho problémy, abychom získali rolníky na svou stranu."
 ROM_rile_up_the_farmers: "Podnítit rolníky"
 ROM_rile_up_the_farmers_desc: "Rolníci stojí v první linii boje proti komunistické hrozbě. Chceme-li zatlačit komunisty od našich hranic, potřebujeme právě je. Díky jejich úsilí může Rumunsko znovu prosperovat."
 ROM_reaffirm_the_little_entente: "Potvrdit Malou dohodu"
 ROM_reaffirm_the_little_entente_desc: "Francie a Británie se ukazují jako nespolehliví strategičtí partneři. Měli bychom proto posílit spolupráci se spojenci z předchozích válek. Potvrdíme a rozšíříme smlouvy, na nichž stojí Malá dohoda, a přeměníme ji v plnohodnotné vojenské spojenectví."
 ROM_pass_a_new_constitution: "Přepracovat ústavu"
 ROM_pass_a_new_constitution_tt: "Ústava bude upravena podle toho, se kterými politickými skupinami jsme spolupracovali."
 ROM_pass_a_new_constitution_desc: "Je zcela zřejmé, že naše současná ústava vytvořila podmínky pro korupci Carola II. a jeho téměř úspěšné uchvácení veškeré moci. Musíme vypracovat novou ústavu, která hlavě státu odebere skutečnou politickou moc, ale zároveň ponechá vládě dostatečné pravomoci k zásahům proti extremistům."
 ROM_invite_bulgaria_into_the_pact: "Pozvat [BUL.GetName] do paktu"
 ROM_invite_bulgaria_into_the_pact_desc: "Geopolitická situace v Evropě se rychle mění. Měli bychom proto ukázat, že cílem Balkánského paktu je vzájemná obrana, a usmířit se se zemí [BUL.GetNonIdeologyName], proti níž byl pakt původně namířen."
 ROM_strengthen_oil_exploitation_cooperation: "Pozvat spojenecké ropné společnosti"
 ROM_strengthen_oil_exploitation_cooperation_desc: "Zahraniční investice pomáhaly po desetiletí budovat ropný průmysl země [ROOT.GetNameDef]. Nyní, když jsme opustili cestu k autoritářství, mohou být tyto země ochotny financovat další vlnu jeho rozvoje."
 ROM_increase_cooperation_with_france: "Prohloubit vztahy se zemí [FRA.GetName]"
 ROM_increase_cooperation_with_france_desc: "Spolupráce mezi Francií a Rumunskem během první světové války i po jejím skončení ovlivňuje naše vzájemné vztahy dodnes. Francouzi nás považují za cenného partnera při udržování stability na Balkáně. Měli bychom tohoto partnerství využít a požádat o francouzské investice a vyslání vojenské mise."
 ROM_dominance_over_the_balkans: "Ovládnout Balkán"
 ROM_dominance_over_the_balkans_desc: "Vlády v celém regionu jsou nestabilnější než kdy dříve. Chceme-li do budoucna zajistit trvalý mír, musíme být připraveni použít sílu."
 ROM_allied_oil_exploration: "Investice od tradičních spojenců"
 ROM_allied_oil_exploration_desc: "Naše politická situace se stabilizuje, a proto můžeme oslovit spřátelené země a povzbudit je k pokračování investic."
 ROM_allied_oil_exploration_tt: "Každý ovládaný stát s nerostnými surovinami"
 ROM_align_with_the_allies: "Důvěřovat Západu"
 ROM_align_with_the_allies_desc: "Ačkoli jsou naše dohody s regionálními strategickými partnery neocenitelné a někteří z nich mají mnohem větší vliv, než by odpovídalo jejich velikosti, nelze popřít, že pouze západní demokracie disponují hospodářskou silou potřebnou k naší obraně před vzestupem fašismu v Evropě."
 ROM_back_czechoslovakia: "Podpořit [CZE.GetNameDef]"
 ROM_back_czechoslovakia_desc: "Podobně jako my se i země [CZE.GetNameDef] ocitla obklopena státy, které si činí nároky na její území. Ačkoli jsme uzavřeli spojenecké smlouvy, jejich porušení by bylo snadné, což si uvědomují i naši spojenci. V zájmu obou zemí bychom měli prokázat své odhodlání zachovat mír v regionu a podepsat novou smlouvu, která nás vzájemně zaváže k obraně."
 ROM_back_czechoslovakia_tt_2: "Naše záruka se stane §Rneodvolatelnou§!."
 ROM_back_czechoslovakia_tt: "Naše záruka se stane §Rneodvolatelnou§! a Spojenci budou ochotnější §Ypodpořit zemi [CZE.GetNameDef] proti expanzi země [GER.GetNameDef]§!, zejména pokud vybudujeme silné letectvo."
 ROM_limited_intervention: "Zasáhnout proti iredentistům"
 ROM_limited_intervention_tt: "Omezení zákona §Y$extensive_conscription$§! budou zmírněna."
 ROM_limited_intervention_desc: "Stále více zemí v regionu uplatňuje iredentistické územní nároky, často bez skutečného opodstatnění. Musíme reagovat rozhodně, než některá oportunistická velmoc poštve zdejší státy proti sobě."
 ROM_maintain_regional_stability: "Udržet regionální stabilitu"
 ROM_maintain_regional_stability_desc: "Vzhledem k nestabilitě na Balkáně bychom měli zvážit možnosti intervence, které nepovedou k nákladným válkám a neodcizí nám ostatní země regionu."
 ROM_maintain_regional_stability_tt: "Každý §Y$autonomy_supervised_state$§!, který vytvoříme, získá následující:"
 ROM_industrial_cooperation_with_czechoslovakia: "Průmyslová spolupráce s [CZE.GetNonIdeologyName]"
 ROM_industrial_cooperation_with_czechoslovakia_desc: "[CZE.GetNameDefCap] disponuje jedním z nejvyspělejších zbrojních průmyslů na světě. Přestože československé podniky již vlastní podíly v některých našich společnostech, například v závodech Cugir, měli bychom s nimi projednat další investice."
 ROM_repair_relations_with_hungary: "Napravit [HUN.GetAdjective] vztahy"
 ROM_repair_relations_with_hungary_desc: "Od první světové války a následné maďarsko-rumunské války jsou naše vztahy se zemí [HUN.GetNonIdeologyName] napjaté. Pokud bude ochotna zmírnit svou iredentistickou rétoriku, měli bychom spolupracovat, abychom zabránili pronikání rostoucího světového napětí na Balkán."
 ROM_pressure_czechoslovakia: "Požadovat ústupky od země [70.owner.GetNonIdeologyName]"
 ROM_pressure_czechoslovakia_desc: "Naši spojenci si činí nároky na území země [CZE.GetNameDef], stejně jako naši soupeři. Nyní proto musíme předložit československé vládě vlastní požadavky."
 ROM_pressure_czechoslovakia_tt: "Tyto účinky se budou lišit podle našich spojenectví."
 ROM_negotiate_with_turkey: "Vyjednávat s [TUR.GetName]"
 ROM_negotiate_with_turkey_desc: "Naše geopolitická poloha u Černého moře znamená, že vztahy se zemí [TUR.GetNameDef] mají zásadní význam, zejména pokud potřebujeme my nebo naši spojenci přepravovat vojska či zásoby po moři. Možná se nám podaří uzavřít vzájemně výhodné smlouvy nebo alespoň vyjednat pro naše spojence volný průjezd do Černého moře."
 ROM_break_the_balkan_pact: "Vypovědět Balkánský pakt"
 ROM_break_the_balkan_pact_desc: "Ukazuje se, že naši tradiční spojenci pravděpodobně nedodrží uzavřené spojenecké smlouvy, pokud by hrozila byť jen nepatrná možnost přerůstání sporu ve válku. Měli bychom proto tyto smlouvy formálně vypovědět a vrátit se k územním ambicím, kterých jsme se kvůli jejich uzavření vzdali."
 ROM_pressure_bulgaria: "Ať se [BUL.GetNonIdeologyName] vzdá svých nároků"
 ROM_pressure_bulgaria_desc: "Na naše území si činí nároky hned několik zemí. Vysláním jednoznačného signálu můžeme začít tím, že po zemi [BUL.GetNameDef] budeme požadovat stažení všech územních nároků, jejichž původ sahá do období po druhé balkánské válce."
 ROM_neutralize_the_bulgarian_threat: "Zabezpečit jižní křídlo"
 ROM_neutralize_the_bulgarian_threat_desc: "Ačkoli bulharská armáda patří pravděpodobně k nejslabším v regionu, je zřejmé, že naši soupeři by ji mohli příslibem územních zisků přimět ke vstupu do spojenectví namířeného proti nám. To nesmíme dopustit, a proto musíme udeřit dříve, než k tomu dostanou příležitost."
 ROM_cooperate_against_communism: "Jednotná fronta proti komunismu"
 ROM_cooperate_against_communism_desc: "V boji proti komunismu musíme ke spojenectvím přistupovat pragmaticky. Spolupráce zejména se zemí [ITA.GetNameDef] nám umožní zadržet a porazit komunismus na Balkáně, a možná i za jeho hranicemi."
 ROM_cooperate_against_communism_tt: "My i země §Y[ITA.GetNameDef]§! máme v dosahu společného §Ypotenciálního komunistického nepřítele§!."
 ROM_reclaim_the_kingdom_dacia: "Naše dácké dědictví"
 ROM_reclaim_the_kingdom_dacia_desc: "V dobách Dáků obýval náš lid území mezi přirozenými hranicemi tvořenými Dunajem na západě a Jižním Bugem na východě. Zatímco usilujeme o obranu a rozšíření země [ROM.GetNonIdeologyName], měli bychom toto dědictví náležitě zdůrazňovat."
 ROM_in_defense_of_greater_romania: "Na obranu Velkého Rumunska"
 ROM_in_defense_of_greater_romania_desc: "Po první světové válce jsme uskutečnili svůj sen. Sen o Velkém Rumunsku. Nyní však rostoucí napětí v Evropě hrozí tento sen rozmetat na kusy. Musíme se proto připravit prolít krev těch, kteří by se odvážili ohrozit Rumunsko, a bránit tak naše Velké Rumunsko."
 ROM_public_work_programmes: "Programy veřejných prací"
 ROM_public_work_programmes_desc: "Za velikost našeho národa vděčíme rumunskému lidu. Proto bylo oznámeno zahájení řady programů veřejných prací, které mají obyvatelstvu pomoci a vyjádřit uznání za vše, co pro Rumunsko vykonalo."
 ROM_reign_in_press_freedom: "Omezit svobodu tisku"
 ROM_reign_in_press_freedom_desc: "Svoboda tisku je jedním ze základních pilířů každé demokratické země. Bohužel však existují lidé, kteří tuto svobodu zneužívají k zasévání rozkolu a pochybností mezi naším obyvatelstvem. Abychom zabránili dalšímu šíření komunismu a chaosu, budeme muset tisk podrobit přísnější kontrole."
 ROM_institute_a_royal_dictatorship: "Nastolit královskou diktaturu"
 ROM_institute_a_royal_dictatorship_desc: "Král i jeho nejbližší okolí dospěli k závěru, že pokud má Rumunsko překonat nadcházející bouři a pokračovat v národním rozvoji, musí skončit nekonečné spory a hašteření mezi politickými stranami. Král proto vytvoří vlastní režim a nastolí královskou diktaturu, která potrvá do chvíle, než nastanou vhodné podmínky pro návrat demokracie."
 ROM_the_general_election: "Parlamentní volby"
 ROM_the_general_election_desc: "Konečně nastal čas parlamentních voleb. Náš lid nyní dostane příležitost nasměrovat zemi k prosperující a bezpečné budoucnosti. Pokud však zvítězí nesprávná strana, může nás naopak uvrhnout do temnoty, z níž se budeme jen obtížně dostávat."
 ROM_constitutional_reform: "Ústavní reforma"
 ROM_constitutional_reform_desc: "Všem, a zejména králi Carolovi II., je naprosto jasné, že Octavian Goga je zcela neschopný. Musí proto odejít. Současně s touto změnou Carol II. zavádí další reformy, které by měly usnadnit přechod zpět k demokracii."
 ROM_anti_extremist_laws: "Zákony proti extremismu"
 ROM_anti_extremist_laws_desc: "Právo svobodně vyjadřovat své názory nám bylo dáno Bohem. Někteří však tohoto práva zneužili a nyní hrozí uvrhnout Rumunsko do chaosu. Abychom takovým lidem zabránili získávat veřejný prostor pro šíření jejich myšlenek, musíme přijmout určitá opatření, i když se mohou zdát poněkud... nedemokratická."
 ROM_strengthen_the_sentinels: "Posílit Strážce"
 ROM_strengthen_the_sentinels_desc: "Naše nedávná opatření významně přispěla k omezení rostoucího vlivu extremistů, jako je Železná garda. Samotné zákony však k ochraně Rumunska před těmi, kteří by jej chtěli uvrhnout do chaosu, nestačí. Strážci již prokázali svou věrnost Rumunsku i jeho králi. S další podporou by se mohli stát skutečnou baštou proti těm, kteří usilují o zničení našeho národa v nadcházející bouři."
 ROM_combat_the_iron_guard: "Potírat Železnou gardu"
 ROM_combat_the_iron_guard_desc: "Železná garda se ukázala být velmi nepříjemným trnem v oku nové královské vlády. Nastal čas skoncovat s jejím vměšováním jednou provždy."
 ROM_mobilize_the_royal_guard: "Mobilizovat královskou gardu"
 ROM_mobilize_the_royal_guard_desc: "Aby zajistil svou ochranu před případnými atentátníky a současně odradil zahraniční mocnosti od pokusů vnutit nám svou vůli, oznámil král mobilizaci a posílení královské gardy."
 ROM_strengthen_german_relations: "Posílit vztahy s Německem"
 ROM_strengthen_german_relations_desc: "Začíná nám být zřejmé, že budoucnost Evropy se bude odvíjet od německých zájmů. Měli bychom proto usilovat o prohloubení spolupráce mezi našimi zeměmi, abychom se neocitli na nesprávné straně dějin."
 ROM_german_military_mission: "Německá vojenská mise"
 ROM_german_military_mission_desc: "Německá armáda již dlouho patří mezi nejlepší a nejefektivnější ozbrojené síly v Evropě. Pozváním německých vojenských poradců můžeme získat cenné zkušenosti a položit základy další spolupráce."
 ROM_joint_axis_oil_exploitation: "Společná těžba ropy s Osou"
 ROM_joint_axis_oil_exploitation_desc: "Munténská ropná pole patří mezi nejbohatší v Evropě. Přestože jsme z nich již sami získali značný prospěch, s pomocí mocností Osy nepochybně dokážeme využít jejich potenciál naplno."
 ROM_secure_power_in_the_state: "Upevnit státní moc"
 ROM_secure_power_in_the_state_desc: "Aby Rumunsko přežilo tyto těžké časy, musí být veškerá vládní moc soustředěna v rukou jediné osobnosti. Potřebujeme vůdce, který dokáže náš národ provést nadcházející bouří a dovést jej k prosperující budoucnosti."
 ROM_purge_the_carlists: "Provést čistku mezi karlisty"
 ROM_purge_the_carlists_desc: "Vládu stále prostupují věrní stoupenci krále Carola II., kteří brzdí a zdržují rozhodnutí vyžadující rychlé jednání. Musíme je co nejdříve zbavit jejich funkcí."
 ROM_reform_the_scouts_of_romania: "Reformovat rumunské skauty"
 ROM_reform_the_scouts_of_romania_desc: "Rumunští skauti byli původně pouze mládežnickou organizací, než je král Carol II. přeměnil v další polovojenské uskupení. Využijeme základy, které položil, abychom organizaci znovu reformovali a začlenili ji do našich řad."
 ROM_romanian_axis_membership: "Vstup Rumunska do Osy"
 ROM_romanian_axis_membership_desc: "Nyní je nám jasné, že jedinou cestou, jak zajistit přežití Rumunska v nadcházejícím desetiletí, je spojenectví s Německem. Budeme proto usilovat o vstup do jeho aliance, abychom po jeho boku společně překonali blížící se bouři."
 ROM_muntenian_air_defenses: "Protivzdušná obrana Munténie"
 ROM_muntenian_air_defenses_desc: "Munténská ropná pole představují životně důležitý zdroj pro naše ozbrojené síly, jsou však velmi zranitelná vůči leteckému bombardování. Abychom zabránili jejich zničení, musíme vybudovat systémy protivzdušné obrany, které odrazí nepřátelské bombardéry."
 ROM_increased_oil_extraction_efforts: "Zvýšit úsilí o těžbu ropy"
 ROM_increased_oil_extraction_efforts_desc: "Rozšiřování našich ropných polí přineslo značné úspěchy. Abychom však dokázali našim spojencům dodávat potřebné množství ropy, musíme těžbu ještě více zintenzivnit."
 ROM_procure_axis_equipment: "Obstarat výzbroj mocností Osy"
 ROM_procure_axis_equipment_desc: "Není žádným tajemstvím, že některé oblasti naší domácí vojenské výroby zaostávají. Naštěstí disponují Němci a Italové potřebnými odbornými znalostmi, kterých můžeme využít. Buď od nich budeme nakupovat již vyrobené vybavení, nebo získáme licence k jeho vlastní výrobě."
 ROM_to_reclaim_our_land: "Získat zpět naši zemi"
 ROM_to_reclaim_our_land_desc: "Besarábie nám byla nespravedlivě odebrána. Díky našim přípravám a podpoře spojenců jsme však nyní připraveni toto území znovu dobýt a zajistit, aby se Rusové již nikdy nepokusili zmocnit naší země."
 ROM_transylvanian_reclamation: "Znovuzískání Sedmihradska"
 ROM_transylvanian_reclamation_desc: "Naše úspěchy na východě nám možná umožní zahojit jednu z nejhlubších ran, které náš národ utrpěl. Pokud Němcům nabídneme území Podněstří, snad budou ochotni přinutit Maďary, aby nám vrátili zemi, která nám právem náleží."
 ROM_the_turn_of_the_tide: "Obrat válečného štěstí"
 ROM_the_turn_of_the_tide_desc: "Ruský nápor nás začíná zatlačovat zpět a otázkou již není, zda budeme jako poražená země přinuceni usednout k jednacímu stolu, nýbrž kdy. Místo čekání na nevyhnutelnou porážku proto využijeme naše diplomaty k vyjednání míru s Rusy. Pokud budou ochotni, můžeme se k nim dokonce připojit při znovuzískávání území, která nám byla odcizena."
 ROM_a_red_flag_over_bucharest: "Rudá vlajka nad Bukureští"
 ROM_a_red_flag_over_bucharest_desc: "Válka skončila a zdá se, že nyní nastal čas zaplatit za naše rozhodnutí. Ruský medvěd na nás vyvíjí nátlak, který západní Spojenci nehodlají zmírnit. Nezbývá nám proto jiná možnost než vztyčit nad Bukureští rudou vlajku."
 ROM_once_again_across_the_tisza: "Znovu přes Tisu"
 ROM_once_again_across_the_tisza_desc: "Po podpisu mírové smlouvy s Rusy nastal čas znovu bojovat. Tentokrát za osvobození našich severních území od Maďarů a jejich německých spojenců. Opět překročíme Tisu a potáhneme na Budapešť!"
 ROM_the_romanian_red_army: "[ROM.GetAdjectiveCap] rudá armáda"
 ROM_the_romanian_red_army_desc: "S novou vládou přichází i nová velitelská struktura. Podle sovětského vzoru vytvoříme rumunskou Rudou armádu, která bude chránit územní celistvost rumunského národa a bezpečnost jeho obyvatel."
 ROM_reconstruction_and_revival: "Obnova a znovuzrození"
 ROM_reconstruction_and_revival_desc: "Válka konečně skončila a nastal čas obnovit naši zemi a zotavit se z ničivé zkázy, která nás postihla. Musíme opustit hospodářství zaměřené na válečnou výrobu a znovu usilovat o prosperitu rumunského lidu."
 ROM_romanian_bulgarian_ssr_proposal: "Sovětská republika Rumunů a Bulharů"
 ROM_romanian_bulgarian_ssr_proposal_desc: "Když Bulharsko poprvé získalo autonomii na Osmanské říši, objevily se návrhy, aby se jeho panovníkem stal náš bývalý král Carol I., čímž by mezi oběma zeměmi vznikla personální unie. Přestože již monarchii nemáme, možná by stálo za to tuto myšlenku znovu otevřít, aby naše národy mohly společně prosperovat jako jeden celek."
 ROM_another_great_game: "Další velká hra"
 ROM_another_great_game_desc: "Po uzavření moskevské smlouvy jsme prokázali, že jsme cenným spojencem v boji proti Němcům. Nyní nás však čeká stejně důležitý úkol. Víme, že Sověti nás hodlají udržet ve své sféře vlivu. Pokud však dokážeme využít našich válečných zásluh, měli bychom se osvobodit od jakéhokoli budoucího područí."
 ROM_a_game_of_politics: "Politická hra"
 ROM_a_game_of_politics_desc: "Abychom zajistili svou nezávislost, musíme navázat bližší vztahy také se západními Spojenci. Pokud je získáme na svou stranu, možná se nám podaří přesvědčit Sověty, aby nás vnímali jako spojence, nikoli jako přítěž."
 ROM_a_show_of_force: "Demonstrace síly"
 ROM_a_show_of_force_desc: "Nyní je nám jasné, že Sověti nemají v úmyslu dovolit nám opustit jejich sféru vlivu. Bude proto nezbytné předvést svou sílu. S podporou západních Spojenců snad pochopí, jakou chybu udělali, když nám odmítli umožnit odchod."
 ROM_enforced_neutrality: "Vynucená neutralita"
 ROM_enforced_neutrality_desc: "Díky schopnostem našich diplomatů jsme dosáhli nezávislosti. Doufejme, že nám neutralita umožní soustředit se na domácí záležitosti a zajistit vlastní prosperitu."
 ROM_push_to_the_dnieper: "Postup k Dněpru"
 ROM_push_to_the_dnieper_desc: "Neměli bychom potřebovat postoupit dále než k Dněpru, abychom Sovětům ukázali, že nám měli dovolit odejít. Nemusíme napodobovat německé ambice na postup až k Uralu."
 ROM_bring_back_antonescu_and_his_allies: "Povolat zpět Antonesca a jeho spojence"
 ROM_bring_back_antonescu_and_his_allies_desc: "Ačkoli Antonescu a jeho spojenci byli věrní předchozí vládě ve městě [GER.capital.GetCapitalVictoryPointName], bude nezbytné je alespoň prozatím povolat zpět. Jejich zkušenosti nám pomohou zajistit hladký postup k Dněpru."
 ROM_joining_the_allies: "Vstup mezi Spojence"
 ROM_joining_the_allies_desc: "Sověti naštěstí uznali naše argumenty a dovolili nám obnovit plnou nezávislost. Nyní můžeme usilovat o vstup mezi západní Spojence, pokud se pro tuto cestu rozhodneme."
 ROM_to_the_bitter_end: "Až do hořkého konce"
 ROM_to_the_bitter_end_desc: "Bohužel se zdá, že Sověti nemají v úmyslu umožnit nám vyjednat mír a naše politiky nechali bez odpovědi u jednacího stolu. To znamená, že nám nezbývá nic jiného než pokračovat v boji až do hořkého konce."
 ROM_envelop_the_black_sea: "Obklíčit Černé moře"
 ROM_envelop_the_black_sea_desc: "Válka na východě se vyvíjí mnohem příznivěji, než jsme se původně odvažovali doufat. Je jen otázkou času, než dokážeme Sověty donutit podrobit se naší alianci. Postupem podél pobřeží Černého moře bychom jim měli být schopni přerušit zásobování i dodávky Lend-Lease, které mohou přicházet přes Bosporský průliv."
 ROM_funds_for_the_war: "Prostředky na válku"
 ROM_funds_for_the_war_desc: "Abychom mohli pokračovat ve válce, musíme zajistit, že finanční prostředky budou směřovat tam, kde jsou nejvíce potřeba. Dočasné půjčky od obyvatelstva a pronájem soukromého majetku by nám měly pomoci zabránit zastavení našich operací na východě."
 ROM_create_a_provissional_cossak_state: "Vytvořit prozatímní kozácký stát"
 ROM_create_a_provissional_cossak_state_desc: "Kozáci nejsou žádnými přáteli Sovětů. Pokud využijeme jejich nedůvěry vůči sovětskému režimu a našeho společného náboženství, můžeme jim výměnou za pomoc ve válce přislíbit vlastní stát."
 ROM_restore_the_orthodox_faith_in_the_caucasus: "Obnovit pravoslavnou víru na Kavkaze"
 ROM_restore_the_orthodox_faith_in_the_caucasus_desc: "Na Kavkaze kdysi převládala pravoslavná víra. Roky útlaku ze strany revolučního režimu v Moskvě ji však zatlačily do ilegality a způsobily tamním věřícím nesmírné utrpení. Jakmile se přiblížíme ke Kavkazu, budeme jim moci navrátit svobodu, kterou jim Sověti upírají."
 ROM_the_transylvanian_redoubt: "Sedmihradská bašta"
 ROM_the_transylvanian_redoubt_desc: "Abychom dokázali odrazit sovětský postup, musíme ustoupit do našich horských oblastí. Tam budeme schopni nepřítele zadržet dostatečně dlouho, abychom obnovili své síly."
 ROM_death_or_dishonor: "Smrt, nebo hanba"
 ROM_death_or_dishonor_desc: "Každý Rumun musí vědět, že pokud v této válce padneme, čeká nás buď úplné zničení, nebo ponižující podrobení. Pokud se vzdáme, zbývá nám pouze smrt, nebo hanba."
 ROM_arms_for_every_able_hand: "Zbraně do každé schopné ruky"
 ROM_arms_for_every_able_hand_desc: "Bohužel jsme dospěli do situace, kdy se každý, kdo dokáže držet pušku, musí zapojit do obrany naší země. Možná to nebude populární rozhodnutí, ale v zájmu naší budoucnosti je nezbytné."
 ROM_the_iron_road: "Železná cesta"
 ROM_the_iron_road_desc: "Železnice představují základ bezpečnosti a zásobování našich frontových linií. Jak můžeme očekávat, že naši vojáci budou účinně bojovat, pokud jim nedokážeme zajistit potřebné zásoby?"
 ROM_secure_our_gains: "Upevnit naše územní zisky"
 ROM_secure_our_gains_desc: "Naše síly postupují stále hlouběji na východ a my musíme zajistit, aby nám dobytá území zůstala i po skončení války. Budeme jednat s našimi spojenci, abychom zajistili respektování našich územních nároků a získali odpovídající odměnu za dosažené úspěchy."
 ROM_unite_the_caucasus: "Sjednotit Kavkaz"
 ROM_unite_the_caucasus_desc: "Nyní, když máme Kavkaz pod kontrolou, můžeme jeho obyvatelům nabídnout příležitost povstat proti Sovětům. Sjednocený Kavkaz pod naším vedením získá znovu vlastní stát a již nikdy se nebude muset podřizovat sovětské moci."
 ROM_past_the_dnieper_once_more: "Znovu za Dněpr"
 ROM_past_the_dnieper_once_more_desc: "Znovu nadešel čas. Naše území jsou opět pod naší kontrolou a nepřítel ustupuje. Znovu proto překročíme Dněpr a postoupíme hluboko do [SOV.GetAdjective] vnitrozemí."
 ROM_the_capital_of_the_balkans: "Hlavní město Balkánu"
 ROM_the_capital_of_the_balkans_desc: "Válka konečně skončila a my nyní můžeme hrdě prohlásit Rumunsko za skutečné hlavní město Balkánu."
 ROM_undermine_the_monarchy: "Podkopat monarchii"
 ROM_undermine_the_monarchy_desc: "Je nám jasné, že monarchie vede Rumunsko temnou cestou, která nevyhnutelně skončí zkázou celé země. Musíme proto začít podkopávat její moc a připravit převzetí vlády, které zabrání tomu, aby Rumunsko pohltil chaos."
 ROM_increase_iron_guard_recruitment: "Zvýšit nábor do Železné gardy"
 ROM_increase_iron_guard_recruitment_desc: "Abychom dosáhli svého cíle a svrhli královskou rodinu, musíme zintenzivnit nábor našich spoluobčanů do Železné gardy. Každý její věrný člen znamená o jednoho člověka méně, kterého může monarchie indoktrinovat."
 ROM_propagate_anti_monarchial_ideas: "Šířit myšlenky proti monarchii"
 ROM_propagate_anti_monarchial_ideas_desc: "Osvobodit se z područí monarchie bude vyžadovat mnoho času a úsilí. Prvním krokem musí být osvěta mezi našimi spoluobčany, aby pochopili skutečnou zhoubnost monarchistického zřízení."
 ROM_expand_iron_guard_activity: "Rozšířit činnost Železné gardy"
 ROM_expand_iron_guard_activity_desc: "S rostoucím počtem našich příznivců můžeme podnikat další kroky k vyjádření odporu vůči monarchii. Rozšířením protestů a veřejných shromáždění otevřeme rumunskému lidu oči a odhalíme mu pravdu o královské rodině."
 ROM_demand_a_referendum: "Požadovat referendum"
 ROM_demand_a_referendum_desc: "Čekali jsme dost dlouho. Nastal čas, aby Železná garda vystoupila do popředí a požadovala po vládě uspořádání referenda o budoucnosti našeho národa."
 ROM_restoration_of_order: "Obnovení pořádku"
 ROM_restoration_of_order_desc: "Monarchie byla odstraněna a moc nad zemí nyní drží Železná garda. Přisluhovači starého režimu však nadále brzdí náš pokrok. Monarchisté a komunisté nyní odhalují svou pravou tvář a ohrožují stabilitu našeho národa."
 ROM_sideline_codreanu: "Odstavit Codreana"
 ROM_sideline_codreanu_desc: "Corneliu Codreanu sehrál v úspěchu Železné gardy zásadní úlohu. Byl jejím zakladatelem a bez jeho přispění bychom jen stěží dokázali převzít moc od předchozí vlády. Je však příliš nevyzpytatelný a postrádá schopnosti potřebné k vedení země. Musíme se s ním vypořádat."
 ROM_codreanu_ascendant: "Codreanu se ujímá moci"
 ROM_codreanu_ascendant_desc: "Nyní, když Železná garda pevně drží otěže státu, nastal čas, aby Codreanu zaujal své právoplatné místo v čele národa. Pod jeho vedením obnovíme pořádek na Balkáně a zatlačíme komunisty na východě."
 ROM_the_cornerstone_of_the_balkans: "Základní kámen Balkánu"
 ROM_the_cornerstone_of_the_balkans_desc: "Prvním krokem k zajištění stability na Balkáně musí být upevnění našeho postavení jako ústředního pilíře balkánské diplomacie."
 ROM_the_balkan_front: "Balkánská fronta"
 ROM_the_balkan_front_desc: "Naším prvním cílem je zabezpečit balkánskou frontu. Západní Banát a území za Tisou, která právem náležejí Rumunsku, se stále nacházejí mimo naše hranice. Nastal čas znovu potvrdit naše nároky a dát jasně najevo naše záměry."
 ROM_dismantle_yugoslavia: "Rozbít Jugoslávii"
 ROM_dismantle_yugoslavia_desc: "Jugoslávský stát je umělým výtvorem západních mocností, který se dosud držel při životě pouze díky zahraničnímu kapitálu. Jeho přísun však vyschl. Pokud oslovíme další země, které mají v této oblasti vlastní zájmy, můžeme tento západní experiment definitivně ukončit."
 ROM_seizure_of_royalist_assets: "Zabavit majetek monarchistů"
 ROM_seizure_of_royalist_assets_desc: "Po celém Rumunsku se nachází královský majetek, který již neslouží svému původnímu účelu. Jeho zabavením a následným prodejem získáme prostředky na naléhavější potřeby civilního obyvatelstva a zároveň podpoříme růst našeho hospodářství."
 ROM_nationalization_of_the_oil_fields: "Znárodnit ropná pole"
 ROM_nationalization_of_the_oil_fields_desc: "Z munténských ropných polí se těží cenné suroviny, které následně putují do zahraničí, zatímco zisky končí v kapsách kapitalistů. Jejich znárodnění nám umožní využít toto bohatství především k rozvoji vlastního průmyslu."
 ROM_expand_clerical_authority: "Rozšířit pravomoci duchovenstva"
 ROM_expand_clerical_authority_desc: "Za vlády monarchie byla církev podřízena státní moci a její postavení oslabeno. Nyní, pod Codreanovým vedením, nastal čas navrátit jí někdejší slávu a umožnit jí podílet se na vedení naší země k prosperující budoucnosti."
 ROM_a_nation_of_faith: "Národ víry"
 ROM_a_nation_of_faith_desc: "S církví po našem boku dokážeme světu, že jsme národem postaveným na základech víry. Zajistíme svobody všem, kteří naše náboženské přesvědčení sdílejí."
 ROM_saviour_of_the_orthodox: "Spasitel pravoslavných"
 ROM_saviour_of_the_orthodox_desc: "Na východě i na západě byla starobylá pravoslavná víra potlačována a zavrhována těmi, kteří ji chtějí zneužít nebo zcela zničit. Staneme se, ba musíme se stát, zachránci pravoslavných věřících v celé východní Evropě."
 ROM_liberate_the_faithful_of_ukraine: "Osvobodit věřící na Ukrajině"
 ROM_liberate_the_faithful_of_ukraine_desc: "Ukrajinský lid je hluboce oddán pravoslavné víře, avšak trpí pod ruským útlakem a touží po pomoci. Sami se Rusům postavit nedokážeme, a proto se musíme připravit na den, kdy budeme moci pravoslavné věřící na Ukrajině osvobodit."
 ROM_a_legionary_balkan_state: "Legionářský balkánský stát"
 ROM_a_legionary_balkan_state_desc: "Abychom pomohli stabilizovat Balkán, vytvoříme legionářský balkánský stát, sjednocený pod vedením Železné gardy proti všem, kteří by chtěli uvrhnout celý region do chaosu."
 ROM_a_nation_without_borders: "Národ bez hranic"
 ROM_a_nation_without_borders_desc: "Podle Codreana je moderní pojetí národa od základu chybné. Skutečný národ podle něj spojuje společný původ, dědictví a víra.\n\nMá-li Rumunsko prosperovat, musí se stát národem bez hranic, který bude držet pohromadě společná víra."
 ROM_enclose_the_black_sea: "Uzavřít Černé moře"
 ROM_enclose_the_black_sea_desc: "Bosporský průliv představuje jedinou námořní přístupovou cestu z oblasti Středozemního moře k našim břehům. Dokud však úžiny zůstávají mimo naši kontrolu, máme jen malý vliv na to, které lodě jimi proplouvají a vplouvají do Černého moře. Musíme proto zajistit, aby se průlivy dostaly buď do našich rukou, nebo pod kontrolu našich spojenců."
 ROM_preempt_bulgarian_irredentism: "Předejít [BUL.GetAdjective] iredentismu"
 ROM_preempt_bulgarian_irredentism_desc: "Není žádným tajemstvím, že Bulhaři připravují pokus o znovuzískání území, která nám museli postoupit během balkánských válek. Musíme proto podniknout preventivní úder a vyřadit je dříve, než se o něco takového vůbec pokusí."
 ROM_up_to_the_tisza: "Až k Tise"
 ROM_up_to_the_tisza_desc: "Bezprostředně po skončení první světové války nám byla přislíbena území sahající až k řece Tise. Státy bývalé Dohody nás však zradily a donutily naši vládu stáhnout se ze státu [154.GetName]. Nyní nastal čas tuto nespravedlnost napravit a obsadit území, která nám byla slíbena."
 ROM_agitate_the_masses: "Burcovat masy"
 ROM_agitate_the_masses_desc: "Zatímco boj mezi králem a tradičními politickými stranami odhaluje nedostatky současného systému, musíme vystoupit do popředí a ukázat, že socialistické strany jsou jedinými silami, které skutečně usilují o reformy."
 ROM_consolidate_bickering_leadership: "Sjednotit rozhádané vedení"
 ROM_consolidate_bickering_leadership_desc: "Nikdy nezískáme širokou podporu, pokud budou vůdci komunistického hnutí příliš zaměstnáni vzájemným soupeřením a hádkami. Musíme svolat setkání jednotlivých frakcí, na němž budou jasně vymezeny jejich úlohy a oblasti působnosti."
 ROM_build_agrarian_support: "Přislíbit přerozdělení půdy"
 ROM_build_agrarian_support_desc: "Jedním z problémů, s nimiž se potýkají všechny politické strany, je široce rozšířený požadavek na pozemkovou reformu. Pokud v našich slibech zajdeme nejdále, nepochybně získáme podporu části venkovského obyvatelstva."
 ROM_appease_the_church: "Usmířit si církev"
 ROM_appease_the_church_desc: "Církev má v naší společnosti mimořádný vliv, a proto přirozeně přistupuje k jakýmkoli návrhům radikálních politických změn s nedůvěrou. Abychom zabránili tomu, že svého vlivu využije proti našemu hnutí, nabídneme jí určité ústupky, které jí umožní zachovat si většinu dosavadního postavení."
 ROM_build_revolutionary_spirit: "[ROM_build_revolutionary_spirit]"
 ROM_build_revolutionary_spirit_default: "Posílit revolučního ducha"
 ROM_build_revolutionary_spirit_democratic: "Bránit demokratické hodnoty"
 ROM_build_revolutionary_spirit_desc: "S rozšiřováním našeho hnutí a získáváním podpory významných osobností venkovských komunit povzbuzujeme naše nejodhodlanější příznivce, aby získávali dobrovolníky ochotné hájit naši věc i v zahraničí."
 ROM_request_dissolution_of_the_moldovan_assr: "Požadovat rozpuštění Moldavské ASSR"
 ROM_request_dissolution_of_the_moldovan_assr_desc: "Když [SOV.GetNameDef] vytvořila Moldavskou ASSR, bylo naprosto zřejmé, že jediným cílem tohoto kroku bylo ospravedlnit územní nároky na naše provincie historického Moldavska. Jelikož se Moldavsko dobrovolně sjednotilo s naší zemí a podílelo se na vzniku Velkého Rumunska, je jedině správné, aby se Sověti těchto nároků vzdali a vrátili nám naše právoplatná území."
 ROM_claim_on_bessarabia_will_bypass_tt: "Zaměření §Y$SOV_claim_on_bessarabia$§! bude po zpřístupnění automaticky přeskočeno."
 ROM_unlock_foreign_relations: "Odemkne rozhodnutí v kategorii §Y$ROM_diplomacy_category$§! se zemí §Y$COUNTRY$§!"
 ROM_demand_legalization: "Požadovat legalizaci komunistické strany"
 ROM_demand_legalization_desc: "S rostoucí silou komunistické strany musíme dát jasně najevo, že se svých cílů nevzdáme výměnou za drobné hospodářské ústupky vlády. Namísto toho budeme požadovat, aby naše strana konečně směla působit legálně."
 ROM_the_peoples_revolution: "Lidová revoluce"
 ROM_the_peoples_revolution_desc: "Naše cíle pro zemi [ROOT.GetNonIdeologyName] nesmíme rozmělňovat snahami o vytvoření koalice. Místo toho budeme prohlubovat rozpory mezi prodemokratickými a autoritářskými politiky, zatímco vyčkáme na vhodný okamžik k rozpoutání naší revoluce."
 ROM_elevate_peoples_defense_councils: "Posílit postavení lidových obranných rad"
 ROM_elevate_peoples_defense_councils_desc: "Občané, kteří se mobilizovali na obranu země [ROOT.GetNonIdeologyName], si zaslouží uznání za své odhodlání a rostoucí zkušenosti. Proto zavedeme pravidelná setkání našich velitelů s lidovými obrannými radami, která jim umožní vzájemně si předávat poznatky."
 ROM_elevate_peoples_defense_councils_tt: "Poradci §Yvojenské poradní rady§! získají vyšší schopnosti."
 ROM_start_civil_war_fake_tt: "Příznivci §Y$neutrality$§! a §Y$communism$§! rozpoutají občanskou válku.\nVliv krále bude na zbývající straně §Y$democratic$§! odstraněn.\nPřipojíme se ke straně, pro kterou jsme vybudovali podporu."
 ROM_agrarian_reform_ba: "$ROM_agrarian_reform$"
 ROM_agrarian_reform_ba_desc: "Nastal čas zahájit nový program pozemkové reformy, v jehož rámci bude část majetku bohatých velkostatkářů přerozdělena chudým rolníkům. Ačkoli se tato opatření těší značné oblibě mezi obyvatelstvem, vláda musí věnovat dostatek času tomu, aby byla provedena správně."
 ROM_improve_rural_literacy: "Zvýšit gramotnost na venkově"
 ROM_improve_rural_literacy_desc: "Gramotnost v zemi [ROOT.GetNonIdeologyName] sice roste, v některých venkovských komunitách však stále téměř neexistuje. Musíme zajistit, aby všichni naši občané dostali příležitost získat alespoň základní vzdělání, což nepochybně přispěje také ke zvýšení produktivity."
 ROM_democratic_faction_tt: "§3$democratic$§! frakce získá:"
 ROM_communist_faction_tt: "§R$communism$§! frakce získá:"
 ROM_purge_the_prison_faction: "Provést čistku ve vězeňské frakci"
 ROM_purge_the_prison_faction_desc: "Není žádným tajemstvím, že představitelé komunistické strany, kteří řídí její činnost z vězení, podléhají mimořádně silnému sovětskému vlivu. Abychom přizpůsobili naši komunistickou stranu skutečným potřebám země [ROOT.GetNonIdeologyName], musíme odstranit představitele tohoto zahraničního vlivu."
 ROM_liberate_the_prison_faction: "Osvobodit vězeňskou frakci"
 ROM_liberate_the_prison_faction_desc: "Věznění vůdci komunistického hnutí měli pochopitelně omezené možnosti prokázat své schopnosti, disponují však rozsáhlými kontakty. Jejich propuštění jim umožní naplno využít své dovednosti ve prospěch socialistické věci, zároveň však posílí stalinistické křídlo strany."
 ROM_reorganize_the_communist_party: "Reorganizovat komunistickou stranu"
 ROM_reorganize_the_communist_party_desc: "Vedení komunistické strany, které nás přivedlo k moci, nemusí být nejvhodnější pro uskutečnění plánovaných hospodářských a zahraničněpolitických změn. Měli bychom svolat nejvýznamnější představitele strany a projednat, zda nenastal čas na nového vůdce."
 ROM_regain_lost_advisors_and_generals_tt: "Získáme zpět některé velitele a poradce ztracené během občanské války."
 ROM_form_a_coalition_with_the_agrarian_parties: "Vytvořit koalici s agrárními stranami"
 ROM_form_a_coalition_with_the_agrarian_parties_desc: "Ačkoli agrární strany zastoupené v parlamentu rozhodně nejsou revoluční, mohou nám pomoci dostat se k moci, neboť podporují rozsáhlejší pozemkovou reformu než liberálové. Poté se ukáže, zda dokážeme některé z jejich politiků přimět ke vstupu do komunistické strany a dále upevnit naši kontrolu nad zemí."
 ROM_the_peoples_militia: "Vytvořit lidovou domobranu"
 ROM_the_peoples_militia_desc: "Jednou z prvních myšlenek komunistické strany bylo vyzbrojit obyvatelstvo a umožnit mu přímo se podílet na obraně země. Tyto jednotky by při nepřátelském útoku představovaly první obrannou linii, zatímco by se mobilizovala naše profesionální armáda."
 ROM_a_peoples_militia_tt: "Tato rozhodnutí umožní nasazovat divize, které nevyžadují žádný personál, ale až do své demobilizace budou způsobovat hospodářský postih."
 ROM_create_communal_farms: "Zakládat kolektivní statky"
 ROM_create_communal_farms_desc: "Abychom osvobodili proletariát, musíme zakládat kolektivní statky, v nichž budou rolníci společně hospodařit. Pokud některé zemědělce postihne neúrodná sezóna, přerozdělení produkce od ostatních zajistí, že nebudou muset hladovět."
 ROM_modernize_the_countryside: "Modernizovat venkov"
 ROM_modernize_the_countryside_desc: "$ROM_agrarian_reform_desc$"
 ROM_cooperate_with_the_ussr: "Spolupracovat se [SOV.GetNameDef]"
 ROM_cooperate_with_the_ussr_desc: "[SOV.GetNameDef] si svými územními nároky na našem východě vysloužila značnou neoblibu mezi naším obyvatelstvem. Změna naší ideologie nám však může umožnit přesvědčit Sověty, aby se těchto nároků vzdali a napravili svou pověst."
 ROM_anti_fascist_cooperation: "Protifašistická spolupráce"
 ROM_anti_fascist_cooperation_desc: "Musíme si uvědomit, že šíření komunismu v regionu nemůže být naší hlavní prioritou v době, kdy ve střední Evropě sílí fašistická hrozba. Prozatím bychom proto měli rozvíjet spojenecké smlouvy uzavřené předchozími vládami a případně také ukončit regionální soupeření, do něhož jsme byli po desetiletí zapojeni."
 ROM_southern_defense_pact: "Balkánský obranný pakt"
 ROM_found_galati_steelworks: "Založit ocelárny v Galati"
 ROM_found_galati_steelworks_desc: "Ve snaze posílit průmyslovou část našeho hospodářství vznikly plány na výstavbu nových rozsáhlých oceláren. Pro jejich umístění bylo vybráno město Galati díky výhodnému přístupu k Dunaji, který usnadní přepravu surovin a výrobků."
 ROM_construct_the_bicaz_dam: "Vybudovat přehradu Bicaz"
 ROM_construct_the_bicaz_dam_desc: "Nově navržený projekt přehrady ve státě [79.GetName] slibuje předvést naši průmyslovou sílu. Výroba elektřiny podpoří rozvoj průmyslu v okolí Bicazu a umožní elektrifikaci blízkých měst. Plánovaná vodní nádrž navíc vytvoří podmínky pro rybolov a pomůže omezit povodně."
 ROM_has_completed_breadbasket_of_europe: "Pokud bylo dokončeno zaměření §Y$ROM_breadbasket_of_europe$§!:"
 ROM_has_completed_balkan_industrialist: "Pokud bylo dokončeno zaměření §Y$ROM_balkan_industrialist$§!:"
 ROM_has_completed_liberate_the_prison_faction: "Pokud bylo dokončeno zaměření §Y$ROM_liberate_the_prison_faction$§!:"
 ROM_currency_reform: "Reformovat rumunský leu"
 ROM_currency_reform_desc: "Zavedení nové podoby rumunského leu nám umožní odstranit nadměrné úspory bohatých prostřednictvím omezení částky, kterou si každý občan smí vyměnit. Tím zabráníme nespravedlivému zvýhodnění bohatých při přerozdělování ostatních forem majetku."
 ROM_our_own_five_year_plans: "Vypracovat pětileté plány"
 ROM_our_own_five_year_plans_desc: "Po úspěších sovětských pětiletých plánů jsme vypracovali vlastní hospodářské programy, které využijí naši kontrolu nad ekonomikou k provedení radikálních reforem."
 ROM_fight_illegitimate_communism: "Bojovat proti falešnému komunismu"
 ROM_fight_illegitimate_communism_desc: "Některá komunistická hnutí zašla v pragmatismu příliš daleko a rozmělnila původní cíle své ideologie. Pouze porážkou těchto pokřivených podob komunismu dříve, než se rozšíří, dokážeme udržet revoluci při životě."
 ROM_promote_balkan_unification_movement: "Podpořit hnutí za sjednocení Balkánu"
 ROM_promote_balkan_unification_movement_desc: "V poslední době vznikla řada návrhů na sjednocení Balkánu. Bez ohledu na ideologické rozdíly je všem zřejmé, že právě sjednocení může představovat naši nejlepší šanci na obranu před útoky mocností stojících mimo region."
 ROM_accelerate_the_revolution: "Urychlit revoluci"
 ROM_accelerate_the_revolution_desc: "S rostoucí mocí našeho spojenectví můžeme nově získaný vliv využít k podpoře komunismu v zahraničí nebo k vyvíjení nátlaku na naše protivníky, aby poskytli svým komunistickým stranám větší vliv."
 ROM_build_communist_support_abroad: "Budovat podporu komunismu v zahraničí"
 ROM_build_communist_support_abroad_desc: "Rumunská komunistická strana získala během revoluční činnosti rozsáhlé zkušenosti s budováním veřejné podpory. Nyní musíme tyto znalosti předat sesterským stranám v ostatních zemích regionu, abychom napomohli šíření komunismu."
 ROM_economic_cooperation: "Odstranit obchodní překážky mezi spojenci"
 ROM_economic_cooperation_desc: "Ve snaze chránit domácí výrobce a omezit závislost na zahraničních zdrojích zavedly země našeho regionu protekcionistická opatření, například cla, která však poškozují obchod. Nyní, když jsme vytvořili spojenectví a mírná hospodářská závislost na spřátelených zemích nás již tolik neznepokojuje, bychom měli část těchto opatření zrušit a upřednostnit hospodářský růst."
 ROM_is_part_of_international_cooperation_mechanic_tt: "Je součástí našeho mechanismu §Y$ROM_diplomacy_category$§!"
 ROM_economic_cooperation_tt: "Členové naší frakce, kteří jsou zapojeni do kategorie §Y$ROM_diplomacy_category$§!, získají národního ducha poskytujícího bonusy podle aktuální úrovně naší spolupráce.\n\nNa úrovni 5 obdrží následující:"
 ROM_promote_collective_defense_programs: "Podpořit programy kolektivní obrany"
 ROM_promote_collective_defense_programs_desc: "Aby naše spojenectví dokázalo svými společnými, avšak menšími armádami čelit početnějším nepřátelským silám, musíme koordinovat obranné linie a pořádat společná vojenská cvičení. Tím zároveň všichni ušetříme část potřebných zdrojů."
 ROM_invest_in_city_expansion: "Rozvíjet města Nového království"
 ROM_invest_in_city_expansion_desc: "Díky dalšímu rozvoji venkova můžeme povzbudit část jeho obyvatelstva k přestěhování do měst. Tam vybudujeme nová průmyslová odvětví, která využijí přebytečné suroviny a pracovní síly našich nyní produktivnějších zemědělských podniků k výrobě náročnějšího zboží a zvýšení životní úrovně obyvatelstva."
 ROM_oppose_soviet_tyranny: "Postavit se [SOV.GetAdjective] tyranii"
 ROM_oppose_soviet_tyranny_desc: "Je stále zřejmější, že zemi [SOV.GetNameDef] více zajímá obnova odkazu někdejšího impéria, na jehož základech vznikla, než skutečné potřeby proletariátu. Nastal proto čas, abychom sami převzali odpovědnost za osvobození národů žijících pod sovětskou nadvládou."
 ROM_fate_of_the_monarchy: "Osud monarchie"
 ROM_fate_of_the_monarchy_desc: "Navzdory korupčním skandálům, do nichž byl zapleten bývalý král Carol II., se monarchie jako instituce stále těší značné podpoře obyvatelstva. Nyní musíme rozhodnout, jak naložíme s ostatními členy královské rodiny."
 ROM_form_an_unofficial_coalition: "Vytvořit neoficiální koalici"
 ROM_form_an_unofficial_coalition_desc: "Je zřejmé, že král Carol II. nemá v úmyslu umožnit stranám, které zvítězily ve volbách, sestavit vládu. Místo toho si osobně vybírá představitele, kteří podkopávají naši demokracii. Nezbývá nám proto jiná možnost než vytvořit neoficiální koalici politických stran a vlivných osobností, které usilují o ukončení Carolovy nadvlády nad naším politickým systémem."
 ROM_protest_royal_meddling: "Protestovat proti královskému vměšování"
 ROM_protest_royal_meddling_desc: "Králův vliv na politiku se stal překážkou řádného fungování vlády. Musíme tuto skutečnost jasně ukázat veřejnosti a zároveň podniknout kroky k omezení jeho vměšování."
 ROM_reform_the_liberal_party: "Spolupracovat s Brătianuovou frakcí"
 ROM_reform_the_liberal_party_desc: "Ačkoli se zdá, že Liberální strana jako celek přistupuje ke stále autoritářštějším sklonům Carola II. lhostejně, ne-li přímo napomáhá jejich posilování, její vůdce Constantin „Dinu“ Brătianu se proti královu směřování staví. Pokud dostane příležitost, mohl by sjednotit další politické síly na obranu demokracie v naší zemi."
 ROM_reform_the_liberal_party_tt: "Pokud bude toto zaměření dokončeno před zaměřením §Y$ROM_unify_the_agrarian_parties$§!, převezmou liberálové po dokončení zaměření §Y$ROM_depose_the_king$§! vedení země s následujícími účinky:"
 ROM_unify_the_agrarian_parties: "Sjednotit agrární strany"
 ROM_unify_the_agrarian_parties_desc: "Přestože Rolnická strana sehrála významnou úlohu při návratu krále Carola II. na trůn, je nyní zřejmé, že se panovník vymkl kontrole. Král se již léta pře s vůdcem Rolnické strany Iuliem Maniem. Měli bychom proto přesvědčit Mania a podobně smýšlející politiky, aby se spojili v odporu proti stále rostoucímu Carolovu vlivu."
 ROM_unify_the_agrarian_parties_tt: "Pokud bude toto zaměření dokončeno před zaměřením §Y$ROM_reform_the_liberal_party$§!, převezmou agrárníci po dokončení zaměření §Y$ROM_depose_the_king$§! vedení země s následujícími účinky:"
 ROM_depose_the_king: "Odstavit krále"
 ROM_depose_the_king_tt: "Odstraní rozhodnutí §Y$ROM_organize_the_anti_carlist_coalition$§!."
 ROM_depose_the_king_desc: "Nastal čas ukázat Carolovi II., že překročil všechny meze. Musíme využít veškeré dostupné prostředky k protestům proti jeho nelegitimní vládě, jejíž členy si prakticky osobně vybral."
 ROM_expand_womens_suffrage: "Rozšířit volební právo žen"
 ROM_expand_womens_suffrage_desc: "Ústavní reformy přijaté v letech 1917 a 1923, které měly mimo jiné zabránit vzestupu socialismu v Rumunsku, rozšířily volební právo na všechny muže. Nyní, když se náš politický systém zotavuje ze série skandálů, bychom měli prokázat přednosti demokracie a přiznat volební právo také ženám."
 ROM_integrate_paramilitaries: "Začlenit polovojenské organizace"
 ROM_integrate_paramilitaries_desc: "Nedávné politické otřesy urychlily vznik nových polovojenských organizací jednotlivých stran, zatímco ty již existující rozšířily své řady. Abychom zabránili pouličním bojům, musíme požadovat, aby tyto milice přijaly reorganizaci a výcvik potřebný k začlenění do armády. To by je mělo dostatečně zaměstnat."
 ROM_dissolve_the_paramilitaries: "Rozpustit polovojenská hnutí"
 ROM_dissolve_the_paramilitaries_desc: "Násilnosti páchané politickými milicemi způsobily obyčejným občanům značné utrpení. Nyní, když usilujeme o upevnění demokracie, musíme jasně ukázat, že politické změny přinášejí volební hlasy, nikoli násilí. Tyto organizace proto musí být rozpuštěny."
 ROM_prevent_a_resurgent_hungary: "Zabránit opětovnému vzestupu Maďarska"
 ROM_prevent_a_resurgent_hungary_desc: "Zdá se, že se země [HUN.GetNameDef] z předchozích konfliktů nepoučila a znovu buduje svou vojenskou sílu. Měli bychom udeřit nyní, než dokončí své zbrojní programy, nebo si dokonce najde spojence ochotného podpořit její expanzivní ambice."
 ROM_demand_bulgarian_submission: "Požadovat podrobení Bulharska"
 ROM_demand_bulgarian_submission_desc: ""
 ROM_embargo_germany: "Zastavit dodávky ropy pro [GER.GetNameDef]"
 ROM_embargo_germany_desc: "Každému je zřejmé, že [GER.GetNameDef] potřebuje dovážet ropu, kterou může v potřebném množství získávat prakticky pouze od nás a z Kavkazu. Jelikož představuje stále vážnější hrozbu, nesmíme s naším zásahem déle otálet. Musíme zastavit přísun našeho paliva do její válečné mašinerie."
 ROM_root_out_corruption: "Důsledky Škodovy aféry"
 ROM_root_out_corruption_desc: "Opakované případy nákupu vojenského vybavení za ceny výrazně převyšující jeho tržní hodnotu, mezi nimiž vyniká Škodova aféra, odhalily hluboce zakořeněnou korupci v zemi [ROOT.GetNonIdeologyName]. Odstraněním krále Carola II. jsme z vlády vyřadili nejvlivnějšího člověka, který z těchto praktik těžil. Nyní musíme této příležitosti využít k odhalení a odstranění zbývajících korupčních sítí."
 ROM_defeating_country_light_casualty_bonus_1: "Pokud porazíme zemi, jejíž vojska utrpěla poměrně malé ztráty, naše §Ystáty pod dohledem§! získají dodatečný denní pokles autonomie."
 ROM_defeating_country_light_casualty_bonus_2: "Pokud přimějeme ke kapitulaci zemi, jejíž vojska utrpěla poměrně malé ztráty, získáme bonus k §Yposlušnosti§!."
 ROM_mediterranean_expansion: "Zabezpečit Řecko"
 ROM_mediterranean_expansion_desc: "Nyní, když náš vliv sahá až do země [BUL.GetNameDef], máme příležitost posílit vztahy se zemí [GRE.GetNameDef]. Ačkoli jsme odstranili hrozbu, kvůli níž jsme společně vytvořili Balkánský pakt, naše kroky dokazují, že bychom mohli být schopným spojencem i proti dalším nebezpečím."
 ROM_preempt_italian_aggression: "Předejít [ITA.GetAdjective] agresi"
 ROM_preempt_italian_aggression_desc: " [ITA.GetNameDefCap] se nijak netají svými expanzivními ambicemi. Jelikož jsme sami rozšířili svůj vliv směrem ke Středozemnímu moři, je jen otázkou času, než se naše zájmy dostanou do přímého střetu. Měli bychom proto udeřit dříve, než to udělají Italové."
 ROM_align_the_military: "Získat protikarlistické důstojníky"
 ROM_align_the_military_desc: "Někteří příslušníci armády jsou zjevně pobouřeni tím, že Carol II. zachází se zemí a ozbrojenými silami jako se svým osobním majetkem. Pokud tyto důstojníky přesvědčíme, aby armádu udrželi stranou našeho mocenského střetu s králem, uklidníme tím mnoho dalších představitelů země."
 ROM_fight_balkan_extremism: "Potlačit balkánský extremismus"
 ROM_fight_balkan_extremism_desc: "Šíření fašismu a komunismu na Balkáně hrozí zmařit naše dosavadní úsilí o zajištění stability regionu. Musíme tyto extremistické režimy porazit dříve, než se pokusí podkopat naši ideologii šířením své vlastní."
 ROM_fight_balkan_extremism_tt: "Získáme válečný cíl proti všem §Ykomunistickým§! a §Yfašistickým§! balkánským zemím."
 ROM_relax_the_royal_dictatorship: "Zmírnit královskou diktaturu"
 ROM_relax_the_royal_dictatorship_desc: "Nyní, když jsme se vypořádali s nejbezprostřednějšími hrozbami pro náš národ, můžeme zmírnit královskou diktaturu a připravit návrat k ústavnější podobě monarchie."
 ROM_puppeteer_the_church: "Podřídit si církev"
 ROM_puppeteer_the_church_desc: "Církev představuje v Rumunsku zásadní instituci s obrovským vlivem na obyvatelstvo. Pokud zajistíme, aby její vedení podporovalo vládu, pomůže nám to zabránit dalším vnitřním hrozbám pro naši zemi."
 ROM_expand_the_sentinels: "Rozšířit řady Strážců"
 ROM_expand_the_sentinels_desc: "Strážci se osvědčili jako mimořádně užitečný nástroj v boji proti těm, kteří by chtěli uvrhnout náš národ do chaosu a nepořádku. Pokud jim poskytneme další finanční prostředky a rozšíříme jejich pravomoci, mohou zůstat jedním z hlavních pilířů rumunské stability."
 ROM_limit_carols_reckless_spending: "Omezit Carolovo bezohledné utrácení"
 ROM_limit_carols_reckless_spending_desc: "Jednou z hlavních výtek, které část našeho národa směřuje vůči Carolovi II., je jeho značně bezohledné nakládání s penězi. Zavedením omezení jeho výdajů můžeme získat na svou stranu i ty, kteří dosud o králi pochybují."
 ROM_align_with_germany: "Sblížit se s Německem"
 ROM_align_with_germany_desc: "Poté, co Německo odstranilo svůj předchozí režim, můžeme nyní našemu obyvatelstvu mnohem snáze představit myšlenku zahraničněpolitického sblížení s touto zemí."
 ROM_german_equipment_procurement: "Nákup německého vybavení"
 ROM_german_equipment_procurement_desc: "[GER.GetNameDefCap] patří mezi světové vůdce vojenského výzkumu. Její pokrok v obrněné technice předstihuje naše vlastní možnosti o celá desetiletí. Nákupem výrobních licencí nebo již hotového vybavení můžeme tento rozdíl zmenšit a zabránit dalšímu zaostávání našich ozbrojených sil."
 ROM_kickstart_the_ten_year_modernization_plan: "Zahájit desetiletý plán modernizace"
 ROM_kickstart_the_ten_year_modernization_plan_desc: "V roce 1935 vypracovala naše Nejvyšší rada národní obrany plán modernizace rumunské armády, který zahrnoval rozsáhlé objednávky vojenského vybavení. Tyto plány byly nyní upraveny tak, aby odpovídaly očekáváním významných průmyslníků. Jejich ambiciózním cílem je zajistit, aby značnou část potřebného vybavení vyráběly nově vznikající domácí zbrojní podniky."
 ROM_build_the_carol_line: "[ROM_build_the_carol_line]"
 ROM_build_the_carol_line_default: "Vybudovat Carolovu linii"
 ROM_build_the_carol_line_alt: "Vybudovat oradejskou linii"
 ROM_build_the_carol_line_desc: "Ačkoli maďarská armáda sama o sobě nemůže představovat vážnou hrozbu, musíme se připravit na možnost, že její územní nároky podpoří vojensky silnější mocnost."
 ROM_build_the_carol_line_tt: "Při vstupu do války se zemí §Y[HUN.GetNameDef]§!:"
 ROM_construct_the_traian_line: "Vybudovat Trajánovu linii"
 ROM_construct_the_traian_line_desc: "Sovětské nároky na stát [78.GetName] znepokojily dokonce i nejvěrnější ideologické spojence Sovětů v Rumunsku, kteří se obávají možnosti jejich agresivního postupu. Nyní, když se tyto hrozby zdají stále vážnější, nastal nejvyšší čas investovat do obranných opatření."
 ROM_construct_the_traian_line_tt: "Při vstupu do války se zemí §Y[SOV.GetNameDef]§!:"
 ROM_improve_military_infrastructure: "Zlepšit vojenskou infrastrukturu"
 ROM_improve_military_infrastructure_desc: "Ačkoli naše armáda početně převyšuje ozbrojené síly většiny sousedních zemí, musí bránit příliš rozsáhlé území. Abychom se v případě nečekaného konfliktu vyhnuli počátečním porážkám, musíme zlepšit infrastrukturu umožňující rychlé přesuny vojsk."
 ROM_found_the_ministry_of_air_and_navy: "Zřídit ministerstvo letectva a námořnictva"
 ROM_found_the_ministry_of_air_and_navy_desc: "Naše letectvo i námořnictvo naléhavě potřebují modernizaci. Za tímto účelem bychom měli těmto složkám ozbrojených sil zřídit samostatné ministerstvo s vlastním rozpočtem, na jehož činnost budou dohlížet odborníci z obou oblastí."
 ROM_new_iar_production_facilities: "Nové výrobní závody IAR"
 ROM_new_iar_production_facilities_desc: "Od chvíle, kdy státní finanční podpora pomohla založit společnost IAR, uplynulo více než deset let. Přestože podnik již zahájil výrobu několika úspěšných leteckých konstrukcí, počet letadel vyrobených v posledních letech zaostal za našimi očekáváními. Pomůžeme proto vybudovat nové výrobní závody, které zvýší produkci osvědčených modelů."
 ROM_expand_icar_into_military_production: "Rozšířit činnost ICAR o vojenskou výrobu"
 ROM_expand_icar_into_military_production_desc: "Přestože společnost ICAR zatím nemá zkušenosti s konstrukcí ozbrojených letadel, její cvičné a dopravní stroje prokazují značný potenciál. Pokud jí zadáme zakázky na výrobu vojenských letounů, mohla by vytvořit vítanou konkurenci společnosti IAR."
 ROM_continue_producing_polish_designs: "Pokračovat ve výrobě polských konstrukcí"
 ROM_continue_producing_polish_designs_desc: "Polské letecké konstrukce, které od první světové války tvořily hlavní část našeho letectva, pomalu zastarávají. Díky nízkým výrobním nákladům je však stále můžeme efektivně využívat k početnímu přečíslení menších letectev našich regionálních soupeřů."
 ROM_expand_the_air_industry: "Rozšířit letecký průmysl"
 ROM_expand_the_air_industry_desc: "Ačkoli naše podniky zahájily výrobu letadel teprve poměrně nedávno, zkušenosti získané při licenční výrobě zahraničních konstrukcí jim již umožňují vyvíjet vlastní stroje. Pokud zajistíme pokračování tohoto rozvoje, mohli bychom brzy konkurovat i konstrukcím mnohem větších vojenských mocností."
 ROM_marine_development_fund: "Národní námořní fond"
 ROM_marine_development_fund_desc: "Vláda velkoryse vyčlenila finanční prostředky na stavbu lodí a loděnic. Měli bychom je co nejdříve využít, jinak mohou skončit v kapsách zkorumpovaných úředníků."
 ROM_kickstart_naval_expansion: "Zahájit rozšiřování námořnictva"
 ROM_expand_torpedo_boat_fleet: "Rozšířit naši říční flotilu"
 ROM_expand_torpedo_boat_fleet_desc: "Ještě před vypracováním plánů na rozšíření námořnictva byla naše flotila malých říčních plavidel považována za jednu z klíčových složek rumunského loďstva. Ačkoli jsou tato plavidla neúčinná proti velkým válečným lodím, mají značný potenciál při odrážení útoků podél několika našich hranic tvořených řekami."
 ROM_invest_in_the_resita_group: "Investovat do skupiny Resita"
 ROM_invest_in_the_resita_group_desc: "Společnost Resita, provozující dělostřelecké závody a ocelárny, projevila zájem o další rozšíření zbrojní výroby. Pokud jí nabídneme investice a výrobní zakázky, můžeme zajistit uskutečnění těchto plánů."
 ROM_study_foreign_tank_designs: "Studovat zahraniční konstrukce tanků"
 ROM_study_foreign_tank_designs_desc: "Náš průmysl má rozsáhlé zkušenosti s výrobou civilních vozidel, při vývoji a výrobě vlastních obrněných vozidel však budou mít tyto znalosti jen omezené využití. Měli bychom proto testovat zahraniční konstrukce a podrobit je zpětnému inženýrství, abychom mohli z každé převzít její nejlepší vlastnosti."
 ROM_domestic_tank_designs: "Vyvinout vlastní konstrukce tanků"
 ROM_domestic_tank_designs_desc: "Nyní, když jsme prostudovali zahraniční tankové konstrukce, můžeme vyvinout vlastní modely přizpůsobené potřebám naší armády a domácím výrobním možnostem. Z jednotlivých konstrukcí převezmeme to nejlepší, a to jak při navrhování budoucích strojů, tak přímo v továrnách, kde můžeme svařováním a šroubováním spojovat dostupné náhradní díly."
 ROM_modernize_the_land_forces: "Modernizovat pozemní síly"
 ROM_modernize_the_land_forces_desc: "V našich pozemních silách slouží řada nadějných důstojníků. Nejschopnější z nich bychom měli povýšit, aby mohli dohlížet na rozšiřování a reorganizaci pozemního vojska."
 ROM_doctrinal_studies: "Studium vojenských doktrín"
 ROM_doctrinal_studies_desc: ""
 ROM_focus_the_SSI_on_external_affairs: "Zaměřit SSI na zahraniční činnost"
 ROM_focus_the_SSI_on_external_affairs_desc: "Naše tajná služba dosud dosahovala největších úspěchů při infiltraci domácích politických hnutí a na její výplatní listině se nacházejí dokonce i významní politici. Rostoucí zahraniční tlak však jasně ukazuje, že služba musí naléhavě rozšířit svou působnost a přesměrovat své úsilí na zahraniční hrozby."
 ROM_look_to_the_past: "Ohlédnout se do minulosti"
 ROM_look_to_the_past_desc: "Naše vítězství ve druhé balkánské válce a konečný úspěch v první světové válce formovaly mnoho současných vysoce postavených armádních velitelů. Musíme se poučit z jejich rozsáhlých zkušeností a usilovat o zopakování těchto vítězství v budoucnu."
 ROM_learn_from_the_past: "Poučit se z minulosti"
 ROM_learn_from_the_past_desc: "Při studiu nedávných konfliktů docházíme k jedinému závěru: naše vojenské doktríny musí být přepracovány, aby odpovídaly požadavkům moderní války. Musíme armádu vycvičit a vybavit pro rychlé přesuny a průlomy nepřátelských linií. Jinak se může veškerá naše palebná síla ukázat jako zbytečná, pokud nás nepřítel obejde po křídlech."
 ROM_artillery_studies: "Dělostřelecký výzkum"
 ROM_artillery_studies_desc: "Abychom ze svých nejtěžších zbraní získali maximum, musíme přehodnotit dosavadní doktríny a držet krok s nejnovějším technologickým pokrokem, zejména v oblasti přesnosti palby."
 ROM_completed_look_to_the_past_tt: "Účinek, pokud bylo dokončeno zaměření §Y$ROM_look_to_the_past$§!:"
 ROM_completed_learn_from_the_past_tt: "Účinek, pokud bylo dokončeno zaměření §Y$ROM_learn_from_the_past$§!:"
 ROM_anti_aircraft_development: "Vývoj protiletadlových zbraní"
 ROM_anti_aircraft_development_desc: "S rostoucím významem letectva nám vývoj kvalitních protiletadlových děl poskytne nákladově efektivní způsob obrany našeho vzdušného prostoru. Naše letectvo se tak bude moci soustředit především na útoky proti nepříteli."
 ROM_the_art_of_warfare: "Válečné umění"
 ROM_the_art_of_warfare_desc: "Aby naše vrchní velení zůstalo připraveno na výzvy nové války, měli bychom uspořádat sérii porad, na nichž budou velitelé opět studovat naše předchozí konflikty a tentokrát také analyzovat, jak by se jejich průběh změnil při využití moderních technologií."
 ROM_the_queen_of_the_battlefield: "Královna bojiště"
 ROM_the_queen_of_the_battlefield_desc: "Pěchota bude vždy tvořit převážnou část naší armády. Musíme proto rozšířit její výcvik a co nejvíce jej přiblížit skutečným bojovým podmínkám. Jinak naši vojáci získají potřebné zkušenosti teprve v opravdové bitvě, a to za cenu značných ztrát."
 ROM_breakthrough_infantry: "Průlomová pěchota"
 ROM_breakthrough_infantry_desc: "Pokud naši pěchotu připravíme na průlomové operace, dokážeme obchvatnými manévry překonat méně pohyblivé nepřátele. Proti mobilnějším protivníkům zase můžeme využít slabin jejich útočných klínů a pokusit se je odříznout."
 ROM_experiment_with_motorization: "Experimentovat s motorizací"
 ROM_experiment_with_motorization_desc: "Nyní, když jsme zlepšili bojovou připravenost naší pěchoty, můžeme experimentovat s dalším rozšířením jejích schopností. Využití nákladních automobilů k přepravě vojáků do blízkosti fronty, pokud to terén a zásobování dovolí, může našim jednotkám poskytnout větší flexibilitu."
 ROM_mechanize_the_army: "Investovat do pásového transportéru Malaxa"
 ROM_mechanize_the_army_desc: "Jakmile naše jednotky dorazí na frontu, stávají se běžné dopravní prostředky příliš zranitelnými. Mechanizace pěchoty tento problém částečně vyřeší. Pásová vozidla nám navíc v obtížném terénu poskytnou mnohem lepší průchodnost a spolehlivost než obyčejné nákladní automobily."
 ROM_the_combined_arms_experiment: "Budoucnost kombinovaných zbraní"
 ROM_the_combined_arms_experiment_desc: "S rozšiřováním našeho letectva a nově také mechanizovaných složek armády můžeme začít nacvičovat jejich společné operace. Letectvo se musí naučit potlačovat nepřátelské jednotky v okolí postupujících mechanizovaných kolon. Bez takové podpory by naše jednotky musely pečlivě připravovat dělostřelecká postavení, což by výrazně zpomalovalo jejich postup."
 ROM_mobile_warfare_trials: "Zkoušky mobilního válčení"
 ROM_has_fielded_at_least_200_tanks_of_any_type_tt: "V armádě je více než §Y200§! tanků libovolného typu"
 ROM_mobile_warfare_trials_desc: "Rozšiřováním našich mechanizovaných sil o tanky získávají mobilní jednotky palebnou sílu potřebnou k vynucení průlomů. Jakmile se podaří prolomit nepřátelské linie, mechanizovaná pěchota bude těsně následovat tanky a chránit jejich křídla před protiútoky."
 ROM_a_random_armor_unit_leader_will_become_high_command: "Náhodný velitel tankové jednotky bude povýšen na generála a stane se §Yspecialistou na obrněnou techniku§!"
 ROM_prevent_logistical_breakdowns: "Předejít logistickým selháním"
 ROM_prevent_logistical_breakdowns_desc: "Mobilní válčení představuje vážnou výzvu pro naše zásobování. Pokud naše jednotky rychle postoupí hluboko do nepřátelského území, nebude možné je zásobovat tradičními způsoby. Železnice mohou vyžadovat opravy nebo přestavbu na správný rozchod a silnice mohou být poškozené nebo zcela chybět. Musíme najít způsoby, jak tyto práce urychlit, a v případě potřeby přizpůsobit vojenská vozidla k přepravě zásob."
 ROM_pinnacle_of_balkan_armed_forces: "Vrchol balkánských ozbrojených sil"
 ROM_pinnacle_of_balkan_armed_forces_desc: "Naše armáda nyní disponuje větší palebnou silou a především zdokonalenými doktrínami, které určují, jak ji co nejúčinněji využívat. Musíme i nadále usilovat o maximální využití dostupných zdrojů."
 ROM_expand_the_vanatore_de_munte: "Vânatorii de Munte"
 ROM_expand_the_vanatore_de_munte_desc: "Naši horští myslivci, Vânători de Munte, tvoří jedny z nejelitnějších divizí celé armády. Abychom je připravili na nejnáročnější bojové nasazení, budeme jejich výcvik provádět s využitím nejmodernějších dostupných zbraní a taktik."
 ROM_improve_army_medical_care: "Zlepšit vojenskou zdravotní péči"
 ROM_improve_army_medical_care_desc: "Lékařské postupy a vybavení používané zdravotníky podporujícími naše ozbrojené síly jsou zastaralé a zcela nedostatečné. Pokud armádě nařídíme zabývat se tímto problémem, můžeme zabránit mnoha zbytečným ztrátám."
 ROM_repurpose_car_repair_workshops: "Přizpůsobit autoservisy novým účelům"
 ROM_repurpose_car_repair_workshops_desc: "Ačkoli naše autoservisy postrádají infrastrukturu nezbytnou k výrobě tanků od základu, stále disponují nástroji potřebnými k opravám jiných typů vozidel a vytváření improvizovaných konstrukcí s využitím ukořistěného vybavení."
 ROM_invest_in_galati_shipyards: "Investovat do loděnic Galati"
 ROM_invest_in_galati_shipyards_desc: "Ačkoli země [ROOT.GetNameDef] disponuje několika loděnicemi, ty nejmodernější byly vybudovány s pomocí zahraničních společností. Chceme-li vybudovat loďstvo předpokládané našimi plány na vojenskou expanzi bez výrazné závislosti na zahraničních partnerech, musíme poprvé samostatně postavit vlastní suché doky. Přednost přitom dostanou loděnice Galati."
 ROM_purchase_italian_destroyers: "Nakoupit lodě v zahraničí"
 ROM_purchase_italian_destroyers_desc: "Přestože zlepšujeme své kapacity pro stavbu nových lodí, může trvat mnoho let, ne-li desetiletí, než se vyrovnáme námořní síle ostatních regionálních mocností. Řešením by mohl být nákup plavidel v zahraničí, zejména pokud se nám podaří získat starší lodě za zvýhodněnou cenu."
 ROM_diversify_malaxa: "Rozšířit výrobní zaměření MALAXA"
 ROM_diversify_malaxa_desc: "MALAXA, jeden z největších průmyslových konglomerátů na Balkáně, nyní usiluje o vstup do zbrojního průmyslu. Společnost již disponuje značnou částí potřebného vybavení i odborných znalostí. Tento krok představuje významný pokrok pro rumunský zbrojní průmysl, bude však nutné pečlivě sledovat rostoucí politický vliv jejího zakladatele, $ROM_nicolae_malaxa$."
 ROM_seize_ford_romania: "Zabavit Ford Romania"
 ROM_seize_ford_romania_desc: "Montážní závod Ford Romania v Bukurešti musí převzít stát, aby mohl pokračovat v provozu i po přerušení dodávek amerických surovin a součástek. Výrobní společnosti, které již mají dobré vztahy s vládou a uzavřené státní zakázky, následně pověříme výrobou potřebných dílů, aby montáž vozidel nemusela být zastavena."
 ROM_expand_american_cooperation: "Rozšířit spolupráci s Američany"
 ROM_expand_american_cooperation_desc: "Posílením vztahů se zemí [USA.GetNameDef] bychom mohli její představitele přesvědčit, aby investovali do rumunských průmyslových podniků spolupracujících se společností Ford Romania."
 ROM_develop_synthetic_rubber: "Nezávislá výroba syntetického kaučuku"
 ROM_develop_synthetic_rubber_desc: "Naše rozsáhlé zásoby ropy a zemního plynu i odborné zkušenosti s jejich zpracováním by nám měly poskytnout značnou výhodu při hledání alternativních zdrojů kaučuku. Poptávka po této surovině totiž neustále roste, neboť se naše automobilová výroba stále více zaměřuje také na vojenské potřeby."
 ROM_ford_will_remain_available_tt: "Během války se zemí §Y[USA.GetNameDef]§! si zachováme nebo znovu získáme přístup k výrobě společnosti §Y$ROM_ford$§!."
 ROM_IAR_engineering_education_program: "Teoretická fyzika v závodech IAR"
 ROM_IAR_engineering_education_program_desc: "Elie Carafoli se během svého působení ve společnosti IAR zasazuje o to, aby se země [ROOT.GetNonIdeologyName] stala světovým lídrem v leteckých inovacích. Před několika lety se mimo jiné podílel na výstavbě prvního aerodynamického tunelu v regionu, který vznikl v Bukurešti. Spolupráce našich akademií se společností IAR by studentům poskytla cenné odborné poznatky a zároveň dále urychlila vývoj našich letadel."
 ROM_MALAXA_engineering_education_program: "Technické vzdělávání v závodech MALAXA"
 ROM_MALAXA_engineering_education_program_desc: "Společnost MALAXA rozšířila svou výrobu na širokou škálu průmyslových i vojenských produktů. Naše akademie by proto mohly s podnikem spolupracovat a poskytovat studentům praktické technické zkušenosti. Společnost MALAXA by na oplátku mohla získat nové poznatky a nápady od budoucích inženýrů."
 ROM_kickstart_naval_expansion_plan: "Zahájit plán rozšiřování námořnictva"
 ROM_kickstart_naval_expansion_plan_desc: "Námořní část plánu vojenské modernizace předpokládá domácí výrobu několika nových křižníků, torpédoborců a ponorek. Uskutečnění těchto ambiciózních záměrů si však vyžádá další investice."
 ROM_experiment_with_submarines: "Experimentovat s ponorkami"
 ROM_experiment_with_submarines_desc: "Abychom dokázali naplno využít zavedení ponorek do našeho námořnictva, musíme přizpůsobit své doktríny. Válečné simulace a námořní cvičení nás připraví na účinné bojové nasazení těchto plavidel."
 ROM_demand_closure_of_the_strait: "Požadovat uzavření průlivu"
 ROM_the_iar_80_and_iar_81: "IAR 80 a IAR 81"
 ROM_the_iar_80_and_iar_81_desc: "Ačkoli již máme připravené konstrukce stíhacího letounu a střemhlavého bombardéru, jejichž technická úroveň je srovnatelná se stroji velmocí, zavedení do výroby komplikují výrobní problémy a nedostatek součástek. Vláda musí zasáhnout a zajistit, aby se stíhací letoun IAR 80 a střemhlavý bombardér IAR 81 začaly vyrábět co nejdříve."
 ROM_experiment_with_coandas_engines: "Experimentovat s motory Henri Coandă"
 ROM_experiment_with_coandas_engines_desc: "Konstrukce proudových letadel se pro naše letectvo stávají stále reálnější možností. Nastal proto čas povolat Henriho Coandă zpět do země [ROOT.GetNonIdeologyName], aby mohl pokračovat ve výzkumu motorů využívajících stlačený vzduch. Ačkoli se jeho původní konstrukce motorům, které si představujeme, podobají jen vzdáleně, jeho zkušenosti mu mohou poskytnout významný náskok v závodě o vývoj proudových technologií."
 ROM_begin_work_on_two_engine_designs: "Zahájit vývoj dvoumotorových letadel"
 ROM_begin_work_on_two_engine_designs_desc: "Nyní, když naši letečtí výrobci zdokonalili konstrukce stíhaček a lehkých bombardérů, bychom měli pokračovat ve vývoji větších letadel schopných nést těžší výzbroj a podnikat bojové lety na delší vzdálenosti."
 ROM_funding_for_the_academies: "Rozšířit akademii Nicolae Bălcescu"
 ROM_funding_for_the_academies_desc: "Ačkoli naše armáda disponuje zkušeným důstojnickým sborem, musíme rozšířit výcvik nových důstojníků, abychom se přizpůsobili požadavkům moderní války a zachovali schopnost samostatného rozhodování a iniciativu také na nižších stupních velení."
 ROM_breadbasket_of_europe: "Obilnice Evropy"
 ROM_breadbasket_of_europe_desc: "Úrodná rumunská půda po staletí živila celé říše, naše zemědělské postupy však stále uvízly v minulosti. Zavedením státních modernizačních programů a upřednostněním rozvoje našich rozlehlých nížin maximalizujeme výnosy plodin a zajistíme si právoplatné postavení obilnice celého kontinentu."
 ROM_balkan_industrialist: "Balkánský průmyslník"
 ROM_balkan_industrialist_desc: "V éře mechanizovaného válčení si již nemůžeme dovolit zůstat čistě agrární společností. Přesměrováním státních prostředků přímo do těžkého a zpracovatelského průmyslu vybudujeme moderní průmyslovou velmoc schopnou ovládnout Balkán."
 ROM_appease_the_farmers: "Uklidnit rolníky"
 ROM_appease_the_farmers_desc: "Rolnictvo tvoří samotnou páteř rumunského národa. Abychom zajistili stabilitu na venkově, musíme se vypořádat s jeho stížnostmi a požadavky. Zavedením příznivé pozemkové politiky a dotací na sezónní zemědělskou produkci udržíme venkovské obyvatelstvo spokojené a produktivní."
 ROM_expand_rural_towns: "Rozšířit venkovská města"
 ROM_expand_rural_towns_desc: "Urbanizace nesmí znamenat, že necháme naše vesnice zaostávat. Rozšíření důležité infrastruktury, elektrifikace a výstavba zpevněných silnic spojujících venkovská centra poskytnou našim zemědělcům tolik potřebný přístup na širší trhy."
 ROM_dobrudjan_agricultural_sector: "Sýpky v Dobrogee"
 ROM_dobrudjan_agricultural_sector_desc: "Sluncem zalitá pole Dobrogey skrývají obrovský, dosud nevyužitý zemědělský potenciál. Výstavba moderních velkokapacitních sýpek a zabezpečených obilních sil nám umožní skladovat přebytky úrody a ochránit národní potravinové rezervy před hladomory způsobenými přírodními katastrofami i nepřátelskými blokádami."
 ROM_crisanan_granaries: "Rozvíjet Crisanu"
 ROM_crisanan_granaries_desc: "Západní oblasti Crisany naléhavě potřebují zemědělské investice, aby mohly plně využít svůj potenciál. Vybudování kvalitnějších zavlažovacích sítí a zavedení moderních zemědělských postupů výrazně zvýší celkovou produkci a přinese nové bohatství do našeho pohraničí."
 ROM_focus_on_traditional_crops: "Zaměřit se na tradiční plodiny"
 ROM_focus_on_traditional_crops_desc: "Ačkoli mohou plodiny určené na mezinárodní trhy přinášet krátkodobé zisky, naše strategická pozornost musí zůstat zaměřena na tradiční základní plodiny, které rumunský lid živily během staletí útrap. Zajištění rozsáhlé produkce pšenice a kukuřice nám zaručí domácí potravinovou bezpečnost."
 ROM_romanians_first: "Rumuni na prvním místě"
 ROM_romanians_first_desc: "Musíme zajistit, aby naše zemědělské bohatství sloužilo především vlastním občanům, nikoli plnilo žaludky cizinců. Kvóty pro domácí spotřebu musí mít bezvýhradnou přednost před vývozními dohodami, aby žádný Rumun nemusel hladovět."
 ROM_prioritize_construction: "Upřednostnit výstavbu"
 ROM_prioritize_construction_desc: "Kvalitní infrastruktura představuje životně důležitý základ národního zásobování. Důsledným upřednostněním civilní výstavby můžeme propojit naše odlehlé venkovské oblasti s hlavními železničními tratěmi a městskými centry."
 ROM_agricultural_powerhouse_of_balkans: "Zemědělská velmoc Balkánu"
 ROM_agricultural_powerhouse_of_balkans_desc: "Díky obrovskému objemu produkce, technologické efektivitě a neúnavné práci ovládne rumunské zemědělství všechny regionální trhy. Musíme vybudovat takovou zemědělskou hegemonii, aby se naši sousedé stali zcela závislými na naší každoroční úrodě a bez ní nedokázali přežít."
 ROM_neo_agricultural_revolution: "Nová zemědělská revoluce"
 ROM_neo_agricultural_revolution_desc: "Musíme se rázně rozloučit se zastaralými zemědělskými postupy našich předků. Rozsáhlá mechanizace, používání chemických hnojiv a vědecky podložené střídání plodin zahájí novou éru venkovské prosperity a přinesou prudký nárůst zemědělské produkce."
 ROM_divert_to_the_army: "Přesměrovat zásoby armádě"
 ROM_divert_to_the_army_desc: "Stahující se válečná mračna nad Evropou znamenají, že naši stateční vojáci musí být dobře zásobeni potravinami a připraveni kdykoli vyrazit do boje. Okamžitě proto přesměrujeme značnou část zemědělské produkce z civilních trhů na systematické vytváření vojenských potravinových rezerv."
 ROM_increase_exports: "Zvýšit vývoz"
 ROM_increase_exports_desc: "Naše rostoucí domácí přebytky můžeme výhodně uplatnit na konkurenčním světovém trhu. Zvýšení vývozních kvót pro zemědělské produkty a suroviny nám přinese tolik potřebné devizové příjmy, jimiž budeme financovat další rozvoj státu."
 ROM_invest_in_forestry_sector: "Investovat do lesnictví"
 ROM_invest_in_forestry_sector_desc: "Rozlehlé karpatské hory pokrývají nedotčené lesy s mimořádně cenným dřevem. Rozšíření těžby dřeva a zakládání nových pil nám poskytne důležité suroviny pro domácí civilní výstavbu i příležitosti k uzavírání výnosných zahraničních vývozních smluv."
 ROM_invest_in_excavation_equipment: "Investovat do těžebního vybavení"
 ROM_invest_in_excavation_equipment_desc: "Využití mimořádně bohatých ložisek nerostných surovin ukrytých pod naší půdou vyžaduje moderní těžkou techniku. Pořízení pokročilého těžebního vybavení ze zahraničí výrazně zvýší naše možnosti domácí těžby surovin a zajistí potřebné zdroje pro rozrůstající se továrny."
 ROM_international_presence: "Mezinárodní působnost"
 ROM_international_presence_desc: "Světové velmoci disponují obrovským kapitálem a průmyslovými technologiemi, které naléhavě potřebujeme. Uzavření výhodných obchodních dohod s těmito zeměmi přinese našemu rozvíjejícímu se hospodářství tolik potřebné finanční prostředky a umožní modernizovat naše těžební postupy."
 ROM_licensed_tractors: "Licenční výroba traktorů"
 ROM_licensed_tractors_desc: "Abychom mohli rychle mechanizovat naše rozsáhlé zemědělství bez čekání na výsledky domácího výzkumu a vývoje, musíme zakoupit výrobní licence na spolehlivé zahraniční traktory. Tento pragmatický přístup zároveň nastartuje náš vlastní průmysl zemědělských strojů."
 ROM_encourage_local_development: "Podpořit místní rozvoj"
 ROM_encourage_local_development_desc: "Vysoce centralizovaný průmysl je ze své podstaty zranitelný vůči strategickému bombardování a hospodářským překážkám. Poskytnutím štědrých daňových úlev a dotací místním výrobcům můžeme decentralizovat naše výrobní řetězce a vytvořit potřebná pracovní místa ve všech rumunských provinciích."
 ROM_grant_industrial_subsidies: "Poskytnout průmyslové dotace"
 ROM_grant_industrial_subsidies_desc: "Přímé státní dotace okamžitě zmírní tíživou finanční zátěž našich rychle se rozvíjejících továren. Tato zásadní vládní podpora jim umožní rychle rozšiřovat provoz, modernizovat montážní linky a zaměstnat tisíce nových pracovníků."
 ROM_focus_on_engineering: "Zaměřit se na technické obory"
 ROM_focus_on_engineering_desc: "Skutečně moderní průmysl potřebuje mimořádně schopné a vzdělané odborníky, kteří zajistí jeho fungování. Rozsáhlé investice do státních technických univerzit a odborných akademií nám poskytnou specializované znalosti nezbytné pro budoucí vývoj pokročilých strojů domácí konstrukce."
 ROM_modernization_of_construction_tools: "Modernizace stavebního vybavení"
 ROM_modernization_of_construction_tools_desc: "Zastaralé nástroje a ruční práce výrazně zpomalují rozvoj naší země. Standardizace a modernizace stavebního vybavení s využitím nejnovějších pneumatických a mechanických technologií podstatně zkrátí dobu potřebnou k výstavbě nových továren a infrastruktury."
 ROM_open_the_iasi_industrial_zone: "Otevřít průmyslovou zónu v Iasi"
 ROM_open_the_iasi_industrial_zone_desc: "Historické město Iasi nabízí mimořádný potenciál pro rozsáhlý hospodářský rozvoj. Vybudování specializované průmyslové zóny vybavené nejmodernějšími technologiemi oživí místní ekonomiku, pomůže tisícům obyvatel vymanit se z chudoby a výrazně zvýší celkovou průmyslovou produkci naší země."
 ROM_international_cooperation: "Mezinárodní spolupráce"
 ROM_international_cooperation_desc: "Nemůžeme očekávat, že dosáhneme úplné industrializace v naprosté izolaci. Oficiálním pozváním zahraničních průmyslových odborníků a inženýrů a sdílením technických poznatků se spřátelenými zeměmi výrazně urychlíme vlastní průmyslovou modernizaci a ušetříme si roky pokusů a omylů."
 ROM_romanian_machinery: "Rumunské strojírenství"
 ROM_romanian_machinery_desc: "Příliš dlouho jsme se spoléhali na dovážené nástroje a zahraniční náhradní díly. Cílenou podporou silného domácího strojírenského odvětví zajistíme naprostou soběstačnost při údržbě, opravách a rozšiřování naší národní průmyslové základny."
 ROM_expand_cugir_factories: "Rozšířit továrny Cugir"
 ROM_expand_cugir_factories_desc: "Rozsáhlé zbrojní závody Cugir jsou naprosto zásadní pro naši pokračující strategii národní obrany. Přesměrování státních prostředků do rozšíření těchto konkrétních podniků výrazně zvýší každodenní produkci moderních pěchotních zbraní a nezbytné munice."
 ROM_resita_industrial_area: "Průmyslová oblast Resita"
 ROM_resita_industrial_area_desc: "Resita má bohatou a dlouholetou tradici výroby oceli a lokomotiv. Rozsáhlé státní investice do tohoto tradičního průmyslového centra nám umožní maximalizovat kapacity těžkého průmyslu a zabezpečit železniční zásobovací trasy."
 ROM_the_vein_of_the_nation: "Tepna národa"
 ROM_the_vein_of_the_nation_desc: "Naše národní železniční síť představuje ocelovou tepnu, která rozvádí život a obchod do všech koutů Rumunska. Rozšíření železničních kapacit a modernizace vozového parku jsou naprosto zásadní, abychom dokázali efektivně zásobovat naše nové továrny potřebnými surovinami."
 ROM_national_effort: "Celonárodní úsilí"
 ROM_national_effort_desc: "Časy sebeuspokojení a pomalého přirozeného růstu definitivně skončily. K mobilizaci všech složek rumunské společnosti a překonání dosavadních hospodářských očekávání je nezbytné jednotné a rozsáhlé celonárodní úsilí o industrializaci."
 ROM_expand_the_trade_ports: "Rozšířit obchodní přístavy"
 ROM_expand_the_trade_ports_desc: "Constanta a naše důležité dunajské přístavy začínají být přetíženy rychle rostoucím obchodním provozem. Rozšíření přístavních mol, modernizace jeřábů a zvětšení skladovacích kapacit výrazně zefektivní náš mezinárodní obchod i vojenské zásobování."
 ROM_expand_hunedoara_steel_plant: "Rozšířit ocelárny Hunedoara"
 ROM_expand_hunedoara_steel_plant_desc: "Hučení pecí v Hunedoaře musí ještě zesílit. Výrazným rozšířením kapacit místních oceláren získáme nezbytné vysoce kvalitní materiály pro výrobu tankového pancíře i rozsáhlé infrastrukturní projekty po celé zemi."
 ROM_carpathian_coal_mines: "Karpatské uhelné doly"
 ROM_carpathian_coal_mines_desc: "Abychom dokázali zajistit dostatek energie pro naše rozsáhlé nové ocelárny a slévárny, potřebujeme obrovské množství uhlí. Hlubší těžba v bohatých karpatských ložiscích zajistí, že naše rozrůstající se průmyslové podniky nebudou trpět ochromujícím nedostatkem energetických zdrojů."
 ROM_encourage_foreign_investments: "Podpořit zahraniční investice"
 ROM_encourage_foreign_investments_desc: "Obrovské bohatství zahraničních kapitalistů můžeme snadno využít ve svůj vlastní prospěch. Nabídkou mimořádně výhodných daňových podmínek a zaručených práv k těžbě surovin je přimějeme financovat výstavbu moderních továren, které tak naléhavě potřebujeme."
