 landmark_arcul_de_triumf_desc: "Monumentální stavba na Kiseleffově třídě v severní Bukurešti. Byla znovu postavena z masivního kamene a slavnostně otevřena roku 1936 na počest vítězství národa ve Velké válce a sjednocení Velkého Rumunska. V srdcích a myslích lidí je mocným symbolem vojenské statečnosti a národní jednoty." # todo: NEW TRANSLATION
 ROM_military_virtue_medal: "Medaile vojenské ctnosti" # todo: NEW TRANSLATION
 ROM_military_virtue_medal_desc: "Medaile vojenské ctnosti se uděluje důstojníkům a vojákům za statečnost a oddanost na bojišti. Představuje základ rumunské vojenské cti." # todo: NEW TRANSLATION
 ROM_order_of_the_crown: "Řád rumunské koruny" # todo: NEW TRANSLATION
 ROM_order_of_the_crown_desc: "Tento řád se zkříženými meči založil král Carol I. Uděluje se velitelům a štábním důstojníkům za mimořádně záslužnou službu, organizační schopnosti a vynikající vůdčí schopnosti." # todo: NEW TRANSLATION
 ROM_order_of_the_star: "Řád rumunské hvězdy" # todo: NEW TRANSLATION
 ROM_order_of_the_star_desc: "Nejstarší všeobecný řád rumunského státu. Uděluje se se zkříženými meči za vojenské zásluhy velitelům jednotek, kteří prokázali výjimečný taktický důvtip a oddanost národu." # todo: NEW TRANSLATION
 ROM_order_of_michael_the_brave: "Řád Michaela Chrabrého" # todo: NEW TRANSLATION
 ROM_order_of_michael_the_brave_desc: "Nejvyšší rumunské vojenské vyznamenání, které založil král Ferdinand I. Uděluje se výhradně důstojníkům za ty nejmimořádnější hrdinské činy a úspěšné vedení rozsáhlých vojenských tažení." # todo: NEW TRANSLATION
 ROM_order_of_faithful_service: "Řád věrné služby" # todo: NEW TRANSLATION
 ROM_order_of_faithful_service_desc: "Tento prestižní řád se zkříženými meči byl založen roku 1932 a uděluje se důstojníkům, kteří během aktivních bojových operací prokázali mimořádné odhodlání, taktické schopnosti a věrnou službu národu." # todo: NEW TRANSLATION
