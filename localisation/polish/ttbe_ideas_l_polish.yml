 ROM_the_polish_romanian_alliance_desc: "Polsko-rumunské spojenectví uzavřené v roce 1921 umožňuje oběma zemím povolat druhou stranu na pomoc v obranných válkách na jejich východních hranicích, tedy shodou okolností na [SOV.GetAdjective] hranici."
