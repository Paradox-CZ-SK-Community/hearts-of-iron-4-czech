 ROM_armed_forces: "Rumunské ozbrojené síly"
 ROM_armed_forces_desc: "Armáda, kterou jsme vybudovali po druhé balkánské válce a první světové válce, prošla v roce 1935 důkladným přezkumem Nejvyšší rady národní obrany. Nyní je na vládě, aby rozhodla, které nedostatky napraví a které příležitosti využije jako první."
