 ROM_vrancea_earthquake_relief_desc: "Ničivé zemětřesení v oblasti Vrancea vážně poškodilo naši infrastrukturu. Státní prostředky a kapacity civilních továren proto využíváme k záchranným pracím a obnově klíčových staveb."
