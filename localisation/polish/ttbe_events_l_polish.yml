l_polish:
 BA_romania_flavour.39.t: "Rumunsko žádá o záruky nezávislosti!"
 BA_romania_flavour.39.d: "Do našeho hlavního města dorazili diplomaté z Bukurešti s naléhavou žádostí rumunské vlády. S odvoláním na stále nestabilnější geopolitickou situaci v Evropě a rostoucí hrozbu zahraniční agrese požaduje Rumunsko formální záruky své národní nezávislosti a územní celistvosti.\n\nPoskytnutí naší ochrany by Rumunsko nepochybně přiblížilo k naší sféře vlivu a zajistilo nám důležitého strategického partnera na Balkáně. Zároveň však přináší značné riziko, že budeme zataženi do nechtěného konfliktu, pokud nepřátelské mocnosti naruší jeho suverenitu. Jak na tuto žádost odpovíme?"
 BA_romania_flavour.39.a: "Zaručíme se za jejich hranice."
 BA_romania_flavour.39.b: "Takové závazky přijmout nemůžeme."
 BA_romania_flavour.40.t: "Rumunské investice do pohraničí"
 BA_romania_flavour.40.d: "Rumunská vláda nás oficiálně oslovila s výhodným návrhem na rozvoj infrastruktury podél našich společných hranic. S vědomím obtížného terénu a vzájemného strategického významu této oblasti nabízí spojení našich technických kapacit a rozdělení finanční zátěže rozsáhlého modernizačního projektu.\n\nBěhem následujících šesti měsíců budou společné stavební týmy neúnavně rozšiřovat železniční síť, budovat nové zásobovací uzly a zpevňovat silnice. Tato bezprecedentní spolupráce výrazně urychlí místní rozvoj a sblíží naše dvě země."
 BA_romania_flavour.40.a: "Oboustranně prospěšný podnik."
 BA_generic_response.1.t: "[FROM.GetNameDefCap] přijímá náš návrh!"
 BA_generic_response.1.d: "Obdrželi jsme oficiální zprávu od vlády země [FROM.GetNameDef]. Ta formálně přijala náš nedávný diplomatický návrh.\n\n[FROM.GetLeader] vyjádřil optimismus ohledně naší další spolupráce a prohlásil, že dohoda slouží společným strategickým zájmům obou našich zemí. Příprava potřebných dokumentů již probíhá."
 BA_generic_response.1.a: "Výborné zprávy."
 BA_generic_response.2.t: "[FROM.GetNameDefCap] odmítá náš návrh!"
 BA_generic_response.2.d: "Naše diplomatická mise v zemi [FROM.GetNameDef] skončila neúspěchem. Vláda vedená osobou [FROM.GetLeader] náš návrh oficiálně odmítla.\n\nVe své odpovědi se odvolává na rozporné národní zájmy a odlišné strategické priority. Je zřejmé, že v současnosti nesdílí naši představu o vzájemných vztazích, a proto musíme hledat jiné cesty k dosažení našich cílů."
 BA_generic_response.2.a: "Neuspokojivý vývoj událostí."
 BA_romania_news.3.t: "Rumunsko zasáhlo ničivé zemětřesení!"
 BA_romania_news.3.d: "Rumunské království zasáhlo mohutné zemětřesení s ohniskem hluboko v pohoří Vrancea. Prudké otřesy pocítila celá východní Evropa, největší zkáza však postihla Bukurešť a okolní oblasti.\n\nV hlavním městě došlo k rozsáhlému poškození budov. Nejvážnější událostí je úplné zřícení moderního obytného domu Carlton, symbolu meziválečné architektury, v jehož troskách zůstaly uvězněny stovky obyvatel. Zatímco armádní jednotky a záchranné složky zoufale pátrají po přeživších, očekává se, že počet obětí vzroste do tisíců. Tato přírodní katastrofa zasadila rumunské infrastruktuře těžkou ránu v již tak napjaté a nejisté době."
 BA_romania_news.3.a: "Strašlivá tragédie."
 BA_romania_news.2.t: "Král Michael byl donucen abdikovat!"
 BA_romania_news.2.d: "V Bukurešti došlo k dramatickému zvratu. Rumunský král Michael I. byl pod obrovským tlakem nově posílené komunistické vlády donucen podepsat abdikační listinu.\n\nZa přítomnosti sovětských vojsk v zemi a s komunistickými milicemi obklopujícími královský palác neměl mladý panovník jinou možnost než odstoupit, pokud nechtěl uvrhnout zemi do krvavé občanské války. Rumunská monarchie, která provedla národ některými z jeho nejvýznamnějších historických okamžiků, byla zrušena. Nic již nebrání vyhlášení lidové republiky."
 BA_romania_news.2.a: "Konec jedné éry."
 BA_romania_news.1.t: "Legionářské povstání v Rumunsku potlačeno!"
 BA_romania_news.1.d: "Zprávy z Bukurešti potvrzují, že rumunská armáda na rozkaz Iona Antonesca rozhodně potlačila násilné povstání fašistické Železné gardy.\n\nVzpoura, kterou provázely několikadenní pouliční boje a děsivé násilnosti v celém hlavním městě, skončila poté, co armáda nasadila těžké dělostřelectvo k odstranění barikád. Vedení legionářského hnutí bylo svrženo a jeho členové čelí pronásledování. Antonescu tak upevnil svou neomezenou kontrolu nad rumunským státem."
 BA_romania_news.1.a: "Krvavý konec křehké koalice."
 BA_romania_coalition.1.t: "Úplatky královské kamarilly"
 BA_romania_coalition.1.d: "Nejbližší okolí krále Carola II., všeobecně známé jako „kamarilla“, si uvědomilo vážnou hrozbu, kterou představuje naše nově vytvořená neoficiální koalice. V zoufalé snaze rozbít naši jednotu oslovili královští vyslanci klíčové představitele opozice s nabídkami výnosných státních zakázek a ministerských křesel.\n\nNěkteří pragmatici sice tvrdí, že přijetí těchto peněz by mohlo financovat naše politické kampaně proti králi, zároveň však riskujeme ztrátu morální převahy a odcizení našich nejvěrnějších demokratických příznivců."
 BA_romania_coalition.1.a: "Tyrani si nás nekoupí!"
 BA_romania_coalition.1.b: "Peníze přijmeme, ale použijeme je proti němu."
 BA_romania_coalition.2.t: "Střety Maniuových gard"
 BA_romania_coalition.2.d: "Politické napětí v zemi přerostlo v pouliční násilí. Maniuovy gardy, polovojenské křídlo Národní rolnické strany, se střetly se státní policií věrnou královskému režimu.\n\nAčkoli Iuliu Maniu veřejně vyzývá ke klidu a dodržování demokratických postupů, samotný pohled na ozbrojené rolnické oddíly pochodující provinčními městy vysílá karlistickému režimu jednoznačný vzkaz: lidem dochází trpělivost."
 BA_romania_coalition.2.a: "Nezbytná demonstrace síly."
 BA_romania_coalition.3.t: "Liberální průmyslníci podporují koalici"
 BA_romania_coalition.3.d: "V návaznosti na úsilí Dinu Brătiana o reformu Národní liberální strany přislíbilo několik bohatých průmyslníků a továrníků naší koalici plnou podporu. Tito magnáti, znechucení všudypřítomnou korupcí a protekcionářstvím Carolovy kamarilly, považují návrat ke skutečné demokracii za jedinou cestu ke stabilizaci hospodářství.\n\nJejich finanční podpora již umožnila rozšíření našeho civilního průmyslu, vytvořila nová pracovní místa a veřejnosti ukázala, že naše koalice dokáže účinně vládnout."
 BA_romania_coalition.3.a: "Kapitál proudí tam, kde je stabilita."
 BA_romania_coalition.4.t: "Rolnický pochod na Bukurešť!"
 BA_romania_coalition.4.d: "Dnešek přinesl skutečně přelomovou událost. Desetitisíce rolníků ze všech koutů země, mobilizované Ionem Mihalachem a sjednocenými agrárními stranami, pokojně vstoupily do hlavního města.\n\nV tradičních krojích a s transparenty požadujícími obnovení ústavních práv zaplnily ulice takovým počtem, že královská garda pouze přihlížela. Tato mohutná demonstrace podpory ze strany obyčejných lidí nade vší pochybnost dokazuje, že národ stojí za demokratickou koalicí."
 BA_romania_coalition.4.a: "Triumf demokracie!"
 BA_romania_coalition.5.t: "Poslední hrozba Carola II."
 BA_romania_coalition.5.d: "Král Carol II., který tuší svůj blížící se pád, svolal vůdce naší koalice do královského paláce. Během napjatého jednání pohrozil vyhlášením stanného práva a trvalým rozpuštěním všech politických organizací, pokud nepřestaneme usilovat o získání armády na svou stranu.\n\nJeho hrozby však znějí stále prázdněji. Klíčoví důstojníci odmítají potlačovat politickou opozici a královská moc se ocitá na pokraji zhroucení. Nastal čas jeho výhrůžkám vzdorovat."
 BA_romania_coalition.5.a: "Před samovládcem se neskloníme."
 BA_romania_coalition.6.t: "Útěk královské kamarilly!"
 BA_romania_coalition.6.d: "Po oficiálním odstranění královské diktatury a zhroucení své politické podpory uprchl bývalý král Carol II. ze země. V hluboké noci vyrazil k jugoslávským hranicím zvláštní královský vlak, který odvážel zdiskreditovaného panovníka, jeho milenku Elenu Lupescu a několik nejbližších spolupracovníků.\n\nAčkoli odjezd proběhl pokojně, podle dostupných zpráv byl vlak naložen cennými obrazy, zahraniční měnou a značnou částí královské pokladnice. Přestože je finanční ztráta bolestivá, celá země si s úlevou oddechla."
 BA_romania_coalition.6.a: "Ty úplatky jsme přece jen neměli přijímat..."
 BA_romania_coalition.6.b: "Dobře, že jsme se té pakáže zbavili!"
 BA_romania_coalition.7.t: "Odstranění karlistických důstojníků"
 BA_romania_coalition.7.d: "Po upevnění moci demokratické vlády zahájil generál Nicolae Rădescu rozsáhlou reorganizaci ozbrojených sil. Vysoce postavení důstojníci, kteří za svůj postup vděčili politické protekci nebo bezvýhradné věrnosti bývalému králi, jsou nenápadně posíláni do předčasné výslužby.\n\nNa jejich místa jsou povyšováni schopní velitelé na základě svých zásluh. Tato čistka monarchistické staré gardy výrazně zvýšila profesionalitu a morálku generálního štábu."
 BA_romania_coalition.7.a: "Armáda slouží národu, nikoli jedinému člověku."
 BA_romania_coalition.8.t: "Ústavní debata"
 BA_romania_coalition.8.d: "Příprava nové, skutečně demokratické ústavy odhalila ideologické rozpory uvnitř naší koalice. Národní liberální strana (PNL) prosazuje silný centralizovaný státní aparát, který by dokázal řídit rychlou industrializaci a udržovat pevný pořádek.\n\nNárodní rolnická strana (PNȚ) naproti tomu požaduje rozsáhlou decentralizaci, posílení místních vesnických rad a zajištění významného politického vlivu rolnické většiny. Kompromis je nezbytný, konečné znění ústavy se však přikloní k jedné z těchto představ."
 BA_romania_coalition.8.a: "Naší hlavní prioritou musí být decentralizace!"
 BA_romania_coalition.8.b: "Centralizace zaručuje efektivitu."
 BA_romania_coalition.9.t: "Shromáždění za volební právo žen"
 BA_romania_coalition.9.d: "Po přelomovém rozhodnutí rozšířit volební právo žen uspořádaly přední představitelky ženského hnutí, včetně Alexandriny Cantacuzino, mohutná oslavná shromáždění ve všech velkých městech.\n\nToto demokratické vítězství politicky aktivizovalo dosud opomíjenou část obyvatelstva. Tisíce žen se nejen zapojují do politického života, ale také se dobrovolně hlásí do pomocných služeb civilní obrany a průmyslu, čímž posilují celkovou odolnost naší země."
 BA_romania_coalition.9.a: "Historický krok vpřed."
 BA_romania_coalition.10.t: "Osud polovojenských organizací"
 BA_romania_coalition.10.d: "Nařízení o rozpuštění všech politických polovojenských organizací bylo úspěšně provedeno. Maniuovy gardy, zbytky fašistických oddílů i další nepravidelné milice dostaly rozkaz složit zbraně a vrátit se do civilního života.\n\nAčkoli se na několika místech objevily izolované případy odboje, armáda rychle zajistila tajné zbrojní sklady těchto skupin. Tisíce pušek, původně určených pro pouliční boje, byly zabaveny a předány přímo do státních zásob."
 BA_romania_coalition.10.a: "Pořádek byl plně obnoven."
 BA_romania_harvest_trade.1.t: "Rumunská obchodní nabídka"
 BA_romania_harvest_trade.1.d: "Rumunská vláda nás oslovila s výhodnou nabídkou. Výměnou za naši hospodářskou nebo vojenskou podporu je ochotna vyvézt k nám značnou část své letošní úrody. Taková dohoda by výrazně posílila naše zásobovací sítě."
 BA_romania_harvest_trade.1.a: "Přijmout dodávky."
 BA_romania_harvest_trade.1.b: "Jejich obilí nepotřebujeme."
 BA_romania_harvest_trade.2.t: "[FROM.GetNameDefCap] přijímá naši nabídku"
 BA_romania_harvest_trade.2.d: "[FROM.GetAdjective] vláda naši nabídku zemědělských produktů ochotně přijala. Vlaky již překračují hranice a my na oplátku získáváme dohodnuté protiplnění. Vývoz našich potravinových rezerv bude mít přirozeně různý dopad na domácí stabilitu podle toho, jak velké přebytky si skutečně můžeme dovolit postrádat."
 BA_romania_harvest_trade.2.a: "Výnosný obchod."
 BA_romania_harvest_trade.3.t: "[FROM.GetNameDefCap] odmítá naši nabídku"
 BA_romania_harvest_trade.3.d: "Naše diplomatická mise skončila neúspěchem. [FROM.GetAdjective] vláda odmítla naše dodávky zemědělských produktů s odůvodněním, že v současnosti má jiné priority. Naše obilí tak zůstane v sýpkách."
 BA_romania_harvest_trade.3.a: "Jejich škoda!"
 BA_romania_harvest.2.t: "Vynikající úroda!"
 BA_romania_harvest.2.d: "Počasí bylo v této sezóně našemu zemědělství mimořádně nakloněno a pečlivé plánování venkovských správců přineslo bohaté výsledky. Státní sýpky doslova přetékají dosud nevídanými přebytky obilí.\n\nTato výjimečná úroda nejen zajišťuje domácí hospodářskou stabilitu na dohlednou dobu, ale také nám poskytuje mimořádně výnosné zboží pro mezinárodní obchod. Venkovské obyvatelstvo prosperuje a národní morálka prudce vzrostla, zatímco vlaky naložené zemědělskými produkty vyrážejí na zahraniční trhy."
 BA_romania_harvest.2.a: "Bůh požehnej dešti!"
 BA_romania_harvest.3.t: "Dobrá úroda"
 BA_romania_harvest.3.d: "Letošní sklizeň přinesla v celé zemi solidní a spolehlivé výsledky. Díky příznivému počasí a usilovné práci našich rolníků jsou státní sýpky dostatečně zásobeny.\n\nAčkoli nejde o rekordní rok, dosažené přebytky poskytují našemu hospodářství vítanou rezervu a umožňují civilnímu průmyslu pokračovat v nerušeném provozu. Rolníci jsou spokojeni a nadprodukce nám umožňuje plnit stávající obchodní dohody, aniž bychom nadměrně zatěžovali domácí zásobování."
 BA_romania_harvest.3.a: "Jen tak dál."
 BA_romania_harvest.4.t: "Slabá úroda"
 BA_romania_harvest.4.d: "Nepříznivé počasí v kombinaci s nečekanými problémy v zásobování venkova způsobilo, že letošní zemědělská produkce nedosáhla očekávaných výsledků.\n\nCelková úroda zaostala za hospodářskými odhady a zanechala nám mnohem menší přebytky, než jsme předpokládali. Abychom udrželi hospodářskou stabilitu a splnili důležité vývozní závazky, bude vláda muset zavést přísnější přídělová opatření pro civilní spotřební zboží. Pro státní příjmy jde o nepříjemnou ztrátu, s níž se však musíme rozvážně vypořádat."
 BA_romania_harvest.4.a: "Zvládneme to."
 BA_romania_harvest.5.t: "Sucho!"
 BA_romania_harvest.5.d: "Naše hlavní zemědělské oblasti zasáhl vážný a dlouhotrvající nedostatek srážek, který výrazně poškodil letošní úrodu. Prudký propad zemědělské produkce zcela vymazal očekávané hospodářské přebytky a přinutil stát k rozsáhlým zásahům na trhu.\n\nAbychom ochránili strategické státní rezervy a zajistili nepřerušené zásobování průmyslu, jsou po celé zemi urychleně zaváděna přísná omezení civilní spotřeby a úsporná hospodářská opatření. Jde o vážnou logistickou a finanční překážku, jejíž překonání si vyžádá pečlivé řízení."
 BA_romania_harvest.5.a: "Čeká nás těžké období..."
 BA_romania_flavour.13.t: "Operace Tidal Wave"
 BA_romania_flavour.13.d: "Obloha nad Munténií potemněla, nikoli však bouřkovými mraky, nýbrž hrozivými siluetami stovek těžkých bombardérů země [plosti_raid_actor_country.GetNameDef]. Letectvo země [plosti_raid_actor_country.GetNameDefCap] zahájilo odvážný nálet přímo na černé srdce našeho válečného hospodářství: rozsáhlé ropné rafinerie v Ploješti.\n\nPo celé zemi znějí sirény a první bomby již dopadají na průmyslové objekty. K nebi stoupají mohutné sloupy hustého černého dýmu. Nepřátelské bombardéry letí nebezpečně nízko, aby unikly radarovému odhalení, a obloha se mění v chaotické ohnivé peklo. Naše protiletadlové baterie se horečně připravují k palbě. Musíme vyslat všechny dostupné stíhačky IAR a Messerschmitt, abychom tento ničivý nálet zastavili dříve, než bude naše těžba a zpracování ropy ochromeno!"
 BA_romania_flavour.13.a: "Vyšlete stíhačky! Braňte vlast!"
 BA_romania_flavour.14.t: "Bombardér B-24 donucen přistát"
 BA_romania_flavour.14.d: "Zuřivá letecká bitva nad ropnými poli nám přinesla nečekanou kořist. Uprostřed výbuchů protiletadlových granátů a prudkých vzdušných soubojů se našim dělostřelcům a statečným stíhacím pilotům podařilo těžce poškodit jeden z bombardérů, přezdívaných „létající pevnosti“, které používá letectvo země [plosti_raid_actor_country_2.GetNameDef].\n\nMohutný B-24 Liberator, zahalený do hustého dýmu a rychle ztrácející výšku, byl donucen k tvrdému nouzovému přistání v kukuřičném poli nedaleko města. Otřesená posádka padla do zajetí, především však samotný letoun zůstal poměrně nepoškozený. Rumunské královské letectvo již místo přistání zajistilo. Naši inženýři se nemohou dočkat, až stroj rozeberou, namalují na jeho křídla Michaelův kříž a odhalí technická tajemství tohoto těžkého strategického bombardéru."
 BA_romania_flavour.14.a: "Prozkoumáme tuto pevnost pro vlastní potřeby..."
 BA_romania_flavour.15.t: "Titulescu se vrací do vlasti"
 BA_romania_flavour.15.d: "Po rozptýlení temných mračen královské diktatury a uklidnění politické situace souhlasil Nicolae Titulescu s návratem z dobrovolného exilu. Tento vynikající diplomat, dlouholetý zastánce kolektivní bezpečnosti a Malé dohody, s sebou přináší mimořádnou prestiž i neocenitelné kontakty v Paříži a Londýně.\n\nUž samotná jeho přítomnost v Bukurešti vysílá světu jasný signál, že se Rumunsko znovu hlásí k mezinárodní spolupráci a vládě práva."
 BA_romania_flavour.15.a: "Skutečný státník se vrací domů."
 BA_romania_flavour.16.t: "Smrt Iona Inculețe"
 BA_romania_flavour.16.d: "Do hlavního města dnes dorazila tragická zpráva. Ion Inculeț, významný politik a jeden z hlavních strůjců připojení Besarábie k Velkému Rumunsku, zemřel po těžkém infarktu.\n\nPodle jeho blízkých jej nedávná ztráta milovaného rodného kraje ve prospěch Sovětského svazu zcela zdrtila. Stres a hluboký žal z toho, že se jeho celoživotní dílo rozpadlo před očima, nakonec představovaly pro jeho srdce příliš velkou zátěž."
 BA_romania_flavour.16.a: "Tragický konec vlastence."
 BA_romania_flavour.17.t: "Demonstrace v [GetMonth] [GetYear]"
 BA_romania_flavour.17.d: "Napětí v Bukurešti dosáhlo bodu varu. Dnes zaplavily Palácové náměstí desetitisíce příznivců monarchie a demokracie, aby vyjádřily podporu koruně v době našeho stále nepříjemnějšího spojenectví se Sověty.\n\nPůvodně pokojné shromáždění se rychle změnilo v násilnosti, když se komunističtí agitátoři a odboráři podporovaní Sověty pokusili dav násilně rozehnat. Nákladní vozy s ozbrojenými provokatéry vjely přímo mezi demonstranty, což vyvolalo rozsáhlé potyčky a chaotické pouliční boje v centru hlavního města.\n\nBěhem následného zmatku se rozzuřenému davu podařilo zadržet a přemoci několik významných komunistických agitátorů. Mezi nimi byl i mladý fanatický aktivista Nicolae Ceaușescu, kterého přesvědčení monarchisté vytáhli z vozidla a surově zbili, než stačily zasáhnout úřady. Ačkoli byl pořádek nakonec obnoven, dnešní krveprolití je krutou připomínkou hlubokých ideologických rozporů, které trhají naši společnost."
 BA_romania_flavour.17.a: "Možná pro nás ještě existuje naděje..."
 BA_romania_flavour.18.t: "Královský skandál otřásá zemí"
 BA_romania_flavour.18.d: "Rozmařilý životní styl a kontroverzní soukromý život krále Carola II. opět zostudily královskou korunu. Do nezávislého tisku unikly podrobnosti o široce sledovaném finančním skandálu, do něhož je zapleteno královo nejbližší okolí i jeho milenka Elena Lupescu.\n\nVeřejné pobouření roste, zatímco obyčejní občané jen stěží vycházejí s penězi a královská kamarilla se na jejich úkor obohacuje. Politická opozice využívá příležitosti k ostré kritice královy morálky i jeho způsobilosti vládnout."
 BA_romania_flavour.18.a: "Jeho Veličenstvo by mělo být diskrétnější..."
 BA_romania_flavour.19.t: "Obnova národa"
 BA_romania_flavour.19.d: "Válečná situace se konečně obrátila v náš prospěch a naše hranice jsou zabezpečeny. Vláda proto zahájila rozsáhlý program poválečné obnovy. Mosty se znovu stavějí, železnice opravují a továrny přizpůsobují potřebám mírového hospodářství.\n\nAčkoli jizvy konfliktu přetrvají po celé generace, zemí se šíří nová vlna optimismu. Vracející se vojáci odkládají zbraně, berou do rukou nástroje a pomáhají obnovovat svou vlast."
 BA_romania_flavour.19.a: "Budujeme lepší zítřek."
 BA_romania_flavour.20.t: "Nadvláda nad Černým mořem"
 BA_romania_flavour.20.d: "Díky nedávným strategickým vítězstvím a neúnavnému rozšiřování námořní infrastruktury proměnilo Rumunsko Černé moře prakticky ve své vlastní jezero.\n\nNaše flotila nyní nerušeně hlídkuje na jeho vodách a promítá naši moc od Konstance až k břehům Krymu. Tato nezpochybnitelná námořní převaha zajišťuje naše obchodní trasy a zaručuje, že žádná nepřátelská síla již nebude moci ohrozit naše pobřeží."
 BA_romania_flavour.20.a: "Naše moře!"
 BA_romania_legionary_rebellion.1.t: "Legionáři povstali!"
 BA_romania_legionary_rebellion.1.d: "Křehké spojenectví mezi vůdcem Ionem Antonescem a Železnou gardou se definitivně zhroutilo. Ozbrojené polovojenské oddíly věrné Horiovi Simovi vyšly do ulic Bukurešti, začaly stavět barikády a rozpoutaly násilné pogromy.\n\nAntonescu, který získal tichý souhlas německého vrchního velení k obnovení pořádku, nařídil armádě zasáhnout. Po několika dnech krvavých pouličních bojů, při nichž bylo nasazeno dělostřelectvo i tanky, armáda povstání rozdrtila. Vůdci legionářského hnutí byli zatčeni nebo uprchli do exilu."
 BA_romania_legionary_rebellion.1.a: "Pořádek byl obnoven. Stát je náš!"
 BA_romania_flavour.12.t: "Železná garda masakruje politické vězně v Jilavě!"
 BA_romania_flavour.12.a: "Temná noc pro Rumunsko..."
 BA_romania_flavour.12.d.both: "Křehké spojenectví se Železnou gardou dospělo ke krvavému zlomu. Během noci vtrhla do věznice v Jilavě neřízená komanda smrti Železné gardy a bez soudu popravila více než šedesát politických vězňů. Mezi oběťmi byli bývalý generál Gheorghe Argeșanu a šéf zpravodajské služby SSI Mihail Moruzov. Oba byli zavražděni údajně jako „odplata“ za smrt zakladatele gardy Cornelia Zelei Codreana.\n\nKrveprolití se však nezastavilo za vězeňskými zdmi. V následujících hodinách se teror rozšířil do ulic, kde byli ze svých domovů unášeni významní intelektuálové, kteří se veřejně stavěli proti gardě. Uznávaný historik Nicolae Iorga i vynikající ekonom Virgil Madgearu byli později nalezeni mrtví v nedalekém lese. Tato děsivá vlna politických vražd hluboce otřásla celým národem."
 BA_romania_flavour.12.d.spared: "Křehké spojenectví se Železnou gardou dospělo ke krvavému zlomu. Během noci vtrhla do věznice v Jilavě neřízená komanda smrti Železné gardy a bez soudu popravila více než šedesát politických vězňů. Několika významným osobnostem se naštěstí podařilo masakru uniknout, protože se v té době ve věznici nenacházely.\n\nKrveprolití se však nezastavilo za vězeňskými zdmi. V následujících hodinách se teror rozšířil do ulic, kde byli ze svých domovů unášeni významní intelektuálové, kteří se veřejně stavěli proti gardě. Uznávaný historik Nicolae Iorga i vynikající ekonom Virgil Madgearu byli později nalezeni mrtví v nedalekém lese. Tato děsivá vlna politických vražd hluboce otřásla celým národem."
 BA_romania_flavour.21.t: "Návrat královny matky"
 BA_romania_flavour.21.d: "Po dramatickém odchodu Carola II. se politická atmosféra v Bukurešti výrazně změnila. Vláda si uvědomuje potřebu sjednocující a všeobecně respektované osobnosti, která by mohla vést mladého krále Michaela, a proto oficiálně pozvala královnu matku Elenu k návratu z dlouholetého exilu ve Florencii.\n\nPo příjezdu na nádraží ji přivítaly nadšené davy a její přítomnost okamžitě navrátila královskému dvoru důstojnost. Její pověstný soucit a pevné morální zásady budou v těchto nejistých časech nepochybně představovat důležitou oporu pro celý národ."
 BA_romania_flavour.21.a: "Triumfální návrat."
 BA_romania_flavour.22.t: "Návrat Bílého prince"
 BA_romania_flavour.22.d: "Barbu Știrbey, zkušený státník a kdysi nejbližší důvěrník zesnulé královny Marie, se konečně vrací do popředí rumunské politiky. Po dlouhá léta žil v politickém ústraní, kam jej zahnal jeho nekompromisní odpor vůči korupci a skandálům předchozího režimu.\n\nNyní, když byli jeho někdejší soupeři odstraněni, jsou jeho mimořádné diplomatické kontakty v Londýně a Paříži i pronikavý politický úsudek opět k dispozici státu. Jeho návrat signalizuje obnovený příklon k pragmatické a uvážlivé diplomacii."
 BA_romania_flavour.22.a: "Jeho zkušenosti jsou neocenitelné."
 BA_romania_flavour.23.t: "Podněsterský guvernorát"
 BA_romania_flavour.23.d: "Úspěšný postup našich ozbrojených sil za řeku Dněstr přivedl pod rumunskou kontrolu rozsáhlá nová území. Maršál Ion Antonescu proto nařídil zřízení civilního guvernorátu, který zajistí řádnou správu této nově dobyté oblasti známé jako Podněstří.\n\nVedením tohoto rozsáhlého správního úkolu pověřil Gheorgheho Alexiana, důvěryhodného právníka a zkušeného úředníka. Jeho přísná opatření a bezohledná výkonnost budou klíčové pro získávání surovin z oblasti a udržování pořádku v týlu fronty."
 BA_romania_flavour.23.a: "Musíme nastolit pořádek."
 BA_romania_flavour.25.t: "Smrt patriarchy Mirona Cristey"
 BA_romania_flavour.25.d: "Národ truchlí. Patriarcha Miron Cristea, první patriarcha rumunské pravoslavné církve a ústřední postava nedávných politických dějin naší země, zemřel během léčebného pobytu v Cannes.\n\nJeho smrt zanechává hlubokou prázdnotu v duchovním i politickém životě Rumunska. Svatý synod se brzy sejde, aby formálně potvrdil Nicodima Munteana jako jeho nástupce. Musíme zajistit hladké předání úřadu, abychom v těchto bouřlivých časech zachovali stabilitu církve a morálku věřících."
 BA_romania_flavour.25.a: "Bůh dej jeho duši věčný pokoj."
 BA_romania_flavour.26.t: "Zemětřesení ve Vrancei roku 1940"
 BA_romania_flavour.26.d: "Naši zemi postihla katastrofa! Mohutné zemětřesení o odhadované síle přesahující magnitudo 7,4 prudce otřáslo celým Rumunskem. Jeho ohnisko se nacházelo hluboko v pohoří Vrancea, ničivé otřesy však zasáhly i velmi vzdálené oblasti.\n\nV Bukurešti se zcela zřítil moderní železobetonový obytný dům Carlton a pod jeho troskami zahynuly stovky lidí. Záchranné složky jsou přetíženy, telekomunikační spojení je přerušeno a obyvatelstvo zachvátila rozsáhlá panika. Musíme okamžitě zorganizovat pomoc a nasadit armádu k vyprošťování přeživších."
 BA_romania_flavour.26.a: "Zmobilizujte záchranné složky!"
 BA_romania_flavour.27.t: "Čistka mezi agrárníky"
 BA_romania_flavour.27.d: "S rudou vlajkou pevně vztyčenou nad Bukureští nová vláda neztrácí čas s odstraňováním svých politických soupeřů. Vůdci Národní rolnické strany, kteří se dlouho vydávali za ochránce venkovských mas, zatímco hájili buržoazní zájmy, byli rychle zneškodněni.\n\nVýznamné osobnosti jako Iuliu Maniu a Ion Mihalache byly zatčeny na základě obvinění z reakčního spiknutí a špionáže, zatímco jejich rozsáhlá politická síť na venkově je systematicky rozkládána. Cesta ke skutečnému socialismu je konečně volná."
 BA_romania_flavour.27.a: "Revoluce žádnou opozici nestrpí."
 BA_romania_flavour.28.t: "Palácový převrat uspěl!"
 BA_romania_flavour.28.d: "Během rychlé a nekrvavé akce zorganizované novou loajalistickou kamarillou obsadila královská garda včera v noci všechny východy z královského paláce. Král Carol II., odříznutý od svých zkorumpovaných pochlebovačů a vystavený vojenskému ultimátu, dnes časně ráno podepsal abdikační listinu.\n\nJeho syn, král Michael I., okamžitě složil panovnickou přísahu. Na rozdíl od svého otce je mladý král obklopen pragmatickou autoritářskou radou, odhodlanou potlačit fašistické agitátory i komunistické podvratné živly. V Rumunsku začíná nová éra přísné a neústupné monarchie."
 BA_romania_flavour.28.a: "Ať žije král!"
 BA_romania_flavour.29.t: "Bukurešťský bezpečnostní summit"
 BA_romania_flavour.29.d: "Na pozvání rumunské koruny se v Bukurešti shromáždili delegáti ze všech zemí naší aliance. Naše vlády, povzbuzené rozhodným postupem Rumunska proti domácímu extremismu, podepsaly rozsáhlý pakt o vzájemné obraně a sdílení zpravodajských informací.\n\nNyní nás spojuje společný cíl: vytvořit neproniknutelnou hráz proti radikálním ideologiím, které rozvracejí Evropu."
 BA_romania_flavour.29.a: "Společně jsme silní."
 BA_romania_flavour.30.t: "Panovníkovy bludy"
 BA_romania_flavour.30.d: "S rostoucím politickým tlakem se chování krále Carola II. stává stále nevyzpytatelnějším. Uzavřen v paláci a obklopen pouze nejbližšími a nejzkorumpovanějšími pochlebovači střídá záchvaty vzteku s ochromující nerozhodností. Armádě i tradičním elitám začíná být bolestně zřejmé, že král zcela ztratil kontakt s realitou."
 BA_romania_flavour.30.a: "Představuje hrozbu pro stát."
 BA_romania_flavour.31.t: "Generál Rădescu přebírá mimořádné pravomoci"
 BA_romania_flavour.31.d: "V zoufalé snaze obnovit pořádek a zachránit svou rozpadající se autoritu jmenoval král Carol II. generála Nicolaea Rădesca předsedou vlády a udělil mu rozsáhlé mimořádné pravomoci.\n\nAčkoli je Rădescu vysoce respektovanou vojenskou osobností, přichází toto opatření příliš pozdě. Důstojníci věrní koruně, kteří připravují převrat, v něm vidí pouze zoufalý pokus krále skrýt se za prestiž armády."
 BA_romania_flavour.31.a: "Kostky jsou vrženy."
 BA_romania_flavour.32.t: "Abdikace krále Carola II."
 BA_romania_flavour.32.d: "Je konec. Král Carol II., vystaven ultimátu vrchního vojenského velení a opuštěn vlastní gardou, podepsal abdikační listinu. Musí okamžitě opustit zemi.\n\nKoruna nyní přechází na jeho syna Michaela. Náš národ musí hledět do budoucnosti a napravit škody, které způsobila královská kamarilla."
 BA_romania_flavour.32.a: "Ať žije král!"
 BA_romania_flavour.33.t: "Ustavení regentské rady"
 BA_romania_flavour.33.d: "Král Michael dosud nedosáhl věku potřebného k samostatnému výkonu panovnických pravomocí. V souladu s ústavou proto musí být ustavena regentská rada, která bude královská práva vykonávat až do jeho osmnáctých narozenin.\n\nAčkoli bude mít rada několik členů, jedna osobnost musí převzít politické vedení a zajistit stabilitu. Kdo stane v jejím čele?"
 BA_romania_flavour.33.a: "Královna matka Elena, aby vedla svého syna."
 BA_romania_flavour.33.b: "Patriarcha, aby poskytl morální autoritu."
 BA_romania_flavour.33.c: "Předseda nejvyššího soudu, aby hájil zákon."
 BA_romania_flavour.34.t: "[FROM.GetName] nás vylučuje z aliance!"
 BA_romania_flavour.34.d: "Po nedávné změně naší vlády dorazily z Bukurešti znepokojivé diplomatické zprávy. Rumunská vláda, která zastává nekompromisní protiextremistické postoje, prohlásila naše nové ideologické směřování za zcela neslučitelné se svým bezpečnostním paktem.\n\nS odvoláním na ideologickou jednotu aliance a probíhající křížovou výpravu proti radikalismu nám oficiálně zrušila členství, vypověděla naše vojenské přidělence a přerušila veškeré závazky vzájemné obrany. Zůstali jsme sami."
 BA_romania_flavour.34.a: "Naše názory se zkrátka lišily..."
 BA_romania_flavour.35.t: "Král Michael dosáhl plnoletosti"
 BA_romania_flavour.35.d: "Dnešek představuje významný okamžik v dějinách Rumunského království: Jeho Veličenstvo král Michael I. oslavil osmnácté narozeniny. Mladý panovník dosáhl zákonné plnoletosti a nyní může samostatně vykonávat veškeré královské pravomoci, čímž zaniká ústavní potřeba regentské rady.\n\nPo celé zemi probíhají slavnosti, Bukureští procházejí velkolepé vojenské přehlídky a ve všech městech znějí kostelní zvony. Lid vzhlíží ke svému mladému a důstojnému panovníkovi s obnovenou nadějí na stabilní a prosperující budoucnost."
 BA_romania_flavour.35.a: "Všechno nejlepší k narozeninám, Vaše Veličenstvo!"
 BA_romania_flavour.36.t: "Protesty proti postupu na východ"
 BA_romania_flavour.36.d: "Po úspěšném znovuzískání Besarábie a severní Bukoviny překročily naše ozbrojené síly Dněstr a postoupily hluboko do sovětského Podněstří.\n\nZatímco vojenské velení považuje tento postup za strategickou nutnost, tradiční demokratičtí vůdci Iuliu Maniu a Dinu Brătianu zaslali vládě ostré veřejné memorandum. Tvrdí, že Rumunsko vstoupilo do války výhradně za osvobození vlastního území a další postup do Ruska mění obrannou válku v nespravedlivou útočnou výpravu, která náš osud zcela svazuje s mocnostmi Osy."
 BA_romania_flavour.36.a: "O tom, kam potáhneme, rozhoduje armáda!"
 BA_romania_flavour.37.t: "Reforma královské diktatury"
 BA_romania_flavour.37.d: "Nová ústava pevně zakotvila královskou diktaturu a král Carol II. nyní musí jmenovat důvěryhodného poradce, který bude dohlížet na plnění jeho vůle a správu státních záležitostí.\n\nMá dvě významné možnosti: Ernesta Urdăreana, bezohledného a velmi kontroverzního ministra královského dvora s obrovským vlivem na kamarillu, nebo Grigora Gafenca, umírněnějšího státníka s diplomatickými sklony, který by režimu mohl dodat tolik potřebné zdání legitimity."
 BA_romania_flavour.37.a: "Jmenovat Ernesta Urdăreana správcem královského dvora."
 BA_romania_flavour.37.b: "Jmenovat Grigora Gafenca k posílení legitimity režimu."
 BA_romania_flavour.38.t: "Konec „Kapitána“"
 BA_romania_flavour.38.d: "Corneliu Zelea Codreanu, fanatický a nebezpečný vůdce Železné gardy, byl konečně odstraněn.\n\nJeho extremistické hnutí po dlouhá léta šířilo v rumunských ulicích teror, politické vraždy a nestabilitu. Včera v noci byl Codreanu spolu s několika významnými spolupachateli zastřelen během převozu do věznice Jilava pod silným četnickým doprovodem. Oficiální státní prohlášení pouze uvádí, že se vězni „pokusili uprchnout do lesa“. Bez ohledu na přesné okolnosti jeho smrti vláda rozhodně odstranila vážnou hrozbu pro národní bezpečnost. Ačkoli jeho zbývající radikální stoupenci kypí vztekem, stát dal naprosto jasně najevo, že fašistický terorismus bude vymýcen všemi dostupnými prostředky."
 BA_romania_flavour.38.a: "Kdo mečem zachází..."
 BA_romania_fall_of_carol.1.t: "Královo jednání je zpochybňováno!"
 BA_romania_fall_of_carol.1.d: "Po sérii ostudných politických a diplomatických přešlapů se zemí šíří nespokojenost a důvěra veřejnosti i státních institucí v diktaturu krále Carola II. rychle slábne. Ulice naplňuje nesouhlas a radikální živly Železné gardy jsou stále troufalejší, protože vycítily slabost monarchie.\n\nV zoufalé snaze obnovit pořádek a zachránit upadající legitimitu navrhl královský dvůr pragmatické řešení: jmenovat generála Iona Antonesca předsedou vlády. Antonescu, respektovaný voják do značné míry nezapletený do tradičních stranických sporů, nabízí tolik potřebnou pevnou ruku. Poradci doufají, že jeho povýšení nejen uklidní nespokojenou armádu prostřednictvím rozsáhlých vojenských reforem, ale také dodá režimu autoritu potřebnou k zastrašení a zkrocení stále bojovnějších fašistických frakcí.\n\nKrál ztrácí nad zemí kontrolu a nyní se musí obrátit na armádu, aby mu zachránila korunu."
 BA_romania_fall_of_carol.1.a: "Král potřebuje reformátora!"
 BA_romania_fall_of_carol.2.t: "Reformovat krále!"
 BA_romania_fall_of_carol.2.d: "Riskantní pokus zachránit vládu Carola II. se obrátil v naprostý nezdar. Sotva měsíc po svém jmenování předsedou vlády zhodnotil generál Ion Antonescu politické trosky, které po sobě zanechalo královo nevyzpytatelné a bezohledné panování. Místo toho, aby se stal štítem ohroženého monarchy, dospěl „Železný generál“ k závěru, že samotná koruna táhne národ do propasti.\n\nAntonescu pochopil, že monarchie nepřežije ani další den Carolovy katastrofální vlády, a rozhodl se jednat. Předložil králi nekompromisní ultimátum a požadoval jeho okamžitou abdikaci, aby zachránil zemi před úplným vnitřním zhroucením. Carol, zahnaný do kouta vlastními politickými chybami a zbavený posledních spojenců, neměl jinou možnost než podepsat abdikační dekret. Odchází do exilu jako panovník zničený vlastní pýchou.\n\nNa trůn nastoupil jeho mladý syn Michael. Ačkoli nový král zdědil korunu, éra královské diktatury skončila. Skutečná moc nyní pevně spočívá v rukou Antonesca."
 BA_romania_fall_of_carol.2.a: "Král je pryč, ať žije král!"
 BA_romania_fall_of_carol.3.t: "Zelené košile vycházejí do ulic"
 BA_romania_fall_of_carol.3.d: "Politická krize dosáhla bodu varu. Desetitisíce legionářů, povzbuzené našimi nedávnými politickými kroky a rostoucí podporou veřejnosti, vyšly do ulic Bukurešti.\n\nPolovojenské oddíly v zelených košilích skandují nacionalistická hesla a požadují konec zkorumpované královské diktatury. Hlavní město je prakticky ochromeno. Policie i armáda, sympatizující s nacionalistickou věcí, nečinně přihlížejí a odmítají rozehnat davy. Autorita krále Carola II. se hroutí každou hodinou."
 BA_romania_fall_of_carol.3.a: "Královská autorita se rozpadá."
 BA_romania_fall_of_carol.4.t: "Palác v obklíčení"
 BA_romania_fall_of_carol.4.d: "Královský palác je nyní zcela obklíčen legionářskými oddíly a jejich příznivci v armádě. Král Carol II. se ocitl v naprosté izolaci. Jeho věrná kamarilla se rozprchla a nechala jej samotného čelit hněvu nacionalistické revoluce.\n\nGenerálové oddaní naší věci vstoupili do paláce a předložili králi nekompromisní ultimátum: okamžitě abdikovat a zabránit krvavé občanské válce, nebo čelit následkům rozzuřeného davu před branami."
 BA_romania_fall_of_carol.4.a: "Už mu nezbývá jiná možnost."
 BA_romania_fall_of_carol.5.t: "Útěk kamarilly"
 BA_romania_fall_of_carol.5.d: "Pod rouškou tmy nastoupil zdiskreditovaný král Carol II. spolu se svou milenkou Elenou Lupescu a hrstkou posledních věrných do zvláštního královského vlaku směřujícího k jugoslávským hranicím.\n\nPřed útěkem se královskému doprovodu podařilo naložit do vlaku ohromné státní bohatství, včetně neocenitelných obrazů, zlata a zahraniční měny. Přestože ztráta pro státní pokladnu je značná, ulice Bukurešti propukají v jásot. Tyran uprchl!"
 BA_romania_fall_of_carol.5.a: "Konečně jsme se ho zbavili!"
 BA_romania_flavour.1.t: "Protikomunistické shromáždění!"
 BA_romania_flavour.1.d: "Od rozhodnutí upřednostnit Staré království roste mezi venkovskými komunitami nespokojenost s nedostatečnou podporou, kterou dostávají.\n\nPřibývá zpráv o aktivitách Železné gardy v těchto oblastech i o stále častějších shromážděních, na nichž její příznivci požadují vyhnání komunismu a socialistické zvrácenosti z Rumunska.\n\nAčkoli značná část těchto komunit je pouze frustrovaná, Železná garda jejich stížnosti využívá k ospravedlnění vlastních postojů. Zdá se tedy, že máme dvě možnosti. Můžeme oslovit obyvatele oblastí, kde je vliv gardy slabší, a pokusit se je odvrátit od jejích myšlenek, nebo naopak přilít olej do ohně, který Železná garda již rozdmýchala."
 BA_romania_flavour.1.a: "Rumunské království je domovem všech Rumunů."
 BA_romania_flavour.1.b: "Vyženeme komunistickou hrozbu z Balkánu!"
 BA_romania_flavour.2.t: "Žádost o dodatečné financování"
 BA_romania_flavour.2.d: "Po příslibu větší finanční podpory Novému království se na nás regionální představitelé znovu obrátili s další žádostí. Jejich hlavním argumentem je skutečnost, že oblasti dříve náležející Rakousko-Uhersku nejsou zdaleka tak rozvinuté jako Staré království. Dodatečné investice by proto pomohly posílit jejich hospodářství a přiblížit je úrovni zbytku Rumunska.\n\nPřestože jsme již podnikli první kroky ke zmírnění rozdílů mezi Novým a Starým královstvím, místní představitelé nás vyzývají k dalšímu úsilí. V těchto regionech je totiž stále častěji spatřována Železná garda, která zjevně rozdmýchává nespokojenost se současnou vládou a monarchií."
 BA_romania_flavour.2.a: "Král jistě může financovat další regionální pracovní programy?"
 BA_romania_flavour.2.b: "S tím by si mohly poradit odborové svazy."
 BA_romania_flavour.3.t: "Atentát na Armanda Călinesca"
 BA_romania_flavour.3.d: "V pozdních nočních hodinách se Armand Călinescu vracel se svým osobním strážcem ke Cotrocenskému paláci, když se jejich vůz dostal do léčky. Skupina atentátníků do automobilu narazila a vyřadila jej z provozu. Když osobní strážce vystoupil, aby prozkoumal domnělou dopravní nehodu, útočníci jej zastřelili.\n\nNásledně obrátili svou pozornost na Călinesca, kterého zastřelili na zadním sedadle vozu. Poté uprchli do nedalekého sídla Rumunské rozhlasové společnosti. Ještě než však stačili odvysílat své prohlášení, ředitel stanice přerušil vysílání a přivolal bezpečnostní složky, které skupinu odzbrojily.\n\nKrátce nato dorazila policie a atentátníky zatkla. Zadržení se k činu přiznali a nyní čekají na soud."
 BA_romania_flavour.3.a: "Železná garda se vymyká kontrole..."
 BA_romania_flavour.4.t: "Maršál Prezan se vrací do aktivní služby!"
 BA_romania_flavour.4.d: "Po celém kontinentu se opět ozývají válečné bubny a rumunské vrchní velení naléhavě potřebuje zkušené vůdce. Dnes zaznělo významné oznámení, které pozvedlo morálku celého národa: maršál Constantin Prezan se oficiálně vrátil do aktivní služby.\n\nTento veterán druhé balkánské války a jeden z nejbrilantnějších stratégů první světové války sehrál klíčovou úlohu při obraně Moldavska v temných letech 1916 a 1917. Společně s generálem Alexandrem Averescem připravil vítěznou obranu u Mărăști, Mărășești a Oituzu, čímž zachránil rumunský stát před úplným zhroucením. Přestože odešel do výslužby na své panství v Schinetee, rostoucí hrozby pro rumunské hranice přiměly starého hrdinu znovu obléknout uniformu. Už samotná jeho přítomnost na bojišti vzbuzuje mezi důstojníky mimořádný respekt. Ačkoli je v pokročilém věku, jeho strategický úsudek zůstává ostrý jako bajonet. Hrdina minulosti se vrátil, aby bránil národ před novou válečnou bouří!"
 BA_romania_flavour.4.a: "Vítejte zpět, maršále!"
 BA_romania_flavour.5.t: "Maršála Prezana postihly vážné zdravotní potíže!"
 BA_romania_flavour.5.d: "Vyčerpávající tempo vojenského velení si vybralo těžkou daň na našem nejváženějším veliteli. Během dnešního zasedání generálního štábu se maršál Constantin Prezan zhroutil následkem vážné srdečně-cévní příhody, což mezi vrchním velením vyvolalo paniku.\n\nJeho stav je nyní stabilizovaný, lékaři však vydali důrazné varování: maršálovo tělo selhává a pokračování ve službě by se mu pravděpodobně stalo osudným. To vyvolalo bouřlivou debatu. Někteří tvrdí, že ponechat muže v tak pokročilém věku ve velení představuje neúnosné riziko, zatímco jiní trvají na tom, že jeho strategický génius a schopnost povzbuzovat morálku jsou nenahraditelné. Musíme rozhodnout o budoucnosti starého maršála."
 BA_romania_flavour.5.a: "Bylo to o vlásek! Zdá se však, že konec je nevyhnutelný..."
 BA_romania_flavour.5.b: "Nemůžeme si dovolit přijít o takovou mysl!"
 BA_romania_flavour.6.t: "Constantin Prezan zemřel!"
 BA_romania_flavour.6.d: "Na zemi dolehl tíživý smutek a vlajky byly spuštěny na půl žerdi. Maršál Constantin Prezan, zachránce Moldavska a jeden z velikánů první světové války, zemřel.\n\nPrezan zasvětil celý svůj život obraně Rumunska. Jeho pevné vedení a nezlomné odhodlání během světové války umožnily naší armádě udržet linii na Siretu proti drtivé přesile Ústředních mocností. Velel s autoritou a důstojností, získal si neochvějnou oddanost svých vojáků a stal se živoucím symbolem národní jednoty a vojenské dokonalosti.\n\nV Bukurešti se připravuje státní pohřeb se všemi vojenskými poctami. Jeho odkaz zůstane navždy zapsán v našich dějinách, jeho odchod však znamená, že stará garda postupně mizí a zanechává v našem velení obrovskou prázdnotu."
 BA_romania_flavour.6.a: "Nechť jeho duše odpočívá v pokoji..."
 BA_romania_flavour.7.t: "Slavnostní otevření nového Vítězného oblouku"
 BA_romania_flavour.7.d: "Dnešek představuje významný milník v dějinách Bukurešti: slavnostní otevření přestavěného Vítězného oblouku.\n\nPůvodní stavba, narychlo zhotovená ze dřeva a štuku v roce 1922 na počest veteránů vracejících se z první světové války, postupně chátrala. Stát si uvědomil potřebu trvalého památníku oslavujícího sjednocení Rumunska a válečné oběti, a proto zadal velkolepou přestavbu z pevného mramoru.\n\nNový monument, který se hrdě tyčí na Kiseleffově třídě, dnes slavnostně otevřel král Carol II. Za zvuků vojenských kapel a jásotu shromážděných davů se oblouk stává trvalým symbolem odolnosti a slávy Velkého Rumunska."
 BA_romania_flavour.7.a: "Velkolepý památník sjednoceného národa!"
 BA_romania_flavour.8.t: "Otevření Národního muzea vesnice"
 BA_romania_flavour.8.d: "Aby uchoval autentickou duši rumunského venkova, slavnostně otevřel král Carol II. v Bukurešti Národní muzeum vesnice.\n\nTento skanzen, jehož vznik inicioval sociolog Dimitrie Gusti, patří k prvním svého druhu na světě. Desítky rolnických usedlostí, dřevěných kostelů a dílen byly rozebrány v různých částech Velkého Rumunska a pečlivě znovu postaveny na březích jezera Herăstrău.\n\nPestrý zahajovací ceremoniál oslavil bohatství našeho folkloru. Ve světě procházejícím rychlou industrializací představuje muzeum důležité spojení s našimi venkovskými kořeny a vzdává hold přetrvávajícím tradicím a řemeslnému umění obyčejných Rumunů."
 BA_romania_flavour.8.a: "Naše kořeny jsou naší silou."
 BA_romania_flavour.9.t: "Dokončení nových křídel královského paláce"
 BA_romania_flavour.9.d: "Po ničivém požáru roku 1926 zahájil král Carol II. ambiciózní rekonstrukci královského paláce na třídě Calea Victoriei. Dnes bylo konečně odstraněno poslední lešení.\n\nNová křídla se pyšní monumentálním neoklasicistním průčelím, které odráží královu snahu vyzařovat stabilitu a moderní autoritu. Stejně velkolepý je i rozšířený interiér s přepychovými přijímacími sály a zesílenými galeriemi určenými pro umělecké sbírky koruny.\n\nDokončený palác nyní hrdě stojí v srdci Bukurešti jako působivý symbol trvalé moci monarchie."
 BA_romania_flavour.9.a: "Důstojné sídlo koruny."
 BA_romania_flavour.10.t: "Otevření Národního parku krále Carola"
 BA_romania_flavour.10.d: "Bukurešť získala novou nádhernou zelenou oázu. Po rozsáhlých veřejných pracích, které odvodnily močály kolem jezera Herăstrău, byl oficiálně otevřen Národní park krále Carola I.\n\nTato proměna je skutečným inženýrským mistrovským dílem. Nabízí rozlehlé upravené promenády a regulované koryto řeky Colentiny. Park se rozprostírá na více než stovce hektarů bujné zeleně a stromových alejí a okamžitě se stal nejvýznamnějším rekreačním místem hlavního města.\n\nTento velkolepý veřejný projekt zcela oživil severní část Bukurešti a představuje mimořádný triumf moderního urbanismu."
 BA_romania_flavour.10.a: "Triumf městského plánování!"
 BA_romania_flavour.11.t: "Zemřela královna Marie!"
 BA_romania_flavour.11.d: "Velké Rumunsko zachvátila hluboká vlna smutku. Její Veličenstvo královna Marie, milovaná „matka raněných“, zemřela na zámku Pelișor.\n\nMarie přijala svou novou vlast s mimořádným zápalem. Během první světové války statečně pečovala o vojáky nakažené cholerou na moldavské frontě a její pozdější diplomatické úsilí v Paříži sehrálo zásadní roli při zajištění mezinárodního uznání Velkého Rumunska.\n\nPodle její poslední vůle bude její srdce uloženo v milované kapli Stella Maris v Balčiku. Zatímco vlaky zahalené černým suknem převážejí její ostatky, miliony plačících Rumunů lemují železniční tratě, aby se naposledy rozloučily se svou královnou."
 BA_romania_flavour.11.a: "Srdce Rumunska pláče..."
 BA_romania_new_kingdom.1.t: "Nové království žádá o pomoc"
 BA_romania_new_kingdom.1.d: "Po skončení první světové války se naše území výrazně rozšířilo. Hospodářské a politické rozdíly mezi oblastmi označovanými jako Staré a Nové království však vytvořily v zemi zřetelnou propast.\n\nZačlenění rozsáhlých nově získaných území se neobešlo bez problémů a představitelé Nového království nyní žádají další pomoc, která by jim umožnila dosáhnout úrovně starších částí státu.\n\nNaše finanční prostředky jsou však omezené a musíme se pokusit uspokojit obě strany, chceme-li překonat nadcházející bouři."
 BA_romania_new_kingdom.1.a: "Samozřejmě, musíme pomáhat všem Rumunům!"
 BA_romania_new_kingdom.1.b: "Bohužel, Staré království má naléhavější potřeby."
 BA_romania_general_election.1.t: "Výsledky parlamentních voleb"
 BA_romania_general_election.1.d: "Konečně byly oznámeny výsledky parlamentních voleb. Zdá se, že vládnoucí Národní liberální strana, Partidul Național Liberal, získala nejvíce hlasů ze všech kandidujících stran. Obdržela jich však podstatně méně, než se očekávalo, a sama proto nedokáže sestavit vládu. Zároveň kategoricky odmítá vytvořit koalici s druhou nejsilnější stranou, Národní rolnickou stranou, Partidul Național Țărănesc, nebo dokonce s třetí nejpopulárnější stranou Totul pentru Țară, vedenou Corneliem Codreanem.\n\nVolby tak skončily politickým patem a šíří se zvěsti, že osobně zasáhne král Carol II. a vynutí si sestavení koaliční vlády."
 BA_romania_general_election.1.a: "Z králova rozkazu najděte někoho, kdo dokáže sestavit vládu!"
 BA_romania_general_election.2.t: "Politické strany si stěžují na shromáždění Železné gardy"
 BA_romania_general_election.2.d: "Železná garda je známá pořádáním častých shromáždění, na nichž zdůrazňuje, co znamená být Rumunem a co je třeba udělat pro ochranu Rumunska před tím, co označuje za zvrácené a požitkářské praktiky, jako jsou socialismus a komunismus.\n\nNení to poprvé, co musely bezpečnostní složky některé z jejích shromáždění rozehnat. S blížícími se volbami však ostatní strany požadují ještě tvrdší postup. Vyzývají nás, abychom gardistická shromáždění rozpouštěli při každé příležitosti, neboť podle nich je toto hnutí ve své podstatě antidemokratické a usiluje o nastolení Codreanovy diktatury.\n\nNa tvrzeních ostatních stran je jistá část pravdy, Železná garda je však stále legální politickou stranou, stejně jako ony."
 BA_romania_general_election.2.a: "Mají právo pořádat shromáždění jako všichni ostatní."
 BA_romania_general_election.2.b: "Musíme Železnou gardu zkrotit."
 BA_romania_general_election.3.t: "Železná garda zdůrazňuje hrozbu ze strany [SOV.GetNameDefCap]"
 BA_romania_general_election.3.d: "Před nadcházejícími volbami vykreslil řečník Železné gardy před tisíci posluchačů zemi [SOV.GetNameDef] jako medvěda číhajícího na svou kořist i na každého, kdo se k ní přiblíží. Tvrdí, že je jen otázkou času, než armády této země překročí naše východní hranice a potáhnou až k městu [ROM.capital.GetCapitalVictoryPointName].\n\nAčkoli většina obyvatel chápe, že nám země [SOV.GetNameDef] momentálně nepředstavuje bezprostřední hrozbu, roste počet těch, kteří požadují další militarizaci našich společných hranic."
 BA_romania_general_election.3.a: "Hrozbu z jejich strany nesmírně zveličuje."
 BA_romania_general_election.3.b: "Musíme být připraveni na všechno, co proti nám mohou podniknout."
 BA_romania_general_election.4.t: "Možná koalice se rozpadá"
 BA_romania_general_election.4.d: "Zdá se, že současná politická situace v Evropě zvyšuje napětí mezi našimi politickými stranami. Šíří se zvěsti, že Národní liberální strana, která má v současnosti největší šanci volby vyhrát, má vážné potíže s přípravou případné koalice s ostatními stranami.\n\nLiberálové zjevně odmítají jakékoli ústupky či kompromisy s politickými partnery, s nimiž by mohli vytvořit společnou vládu a následně společně řídit zemi."
 BA_romania_general_election.4.a: "Myslí to vůbec vážně?"
 BA_romania_royal_dictatorship.1.t: "Ustavení královské vlády"
 BA_romania_royal_dictatorship.1.d: "Po fiasku posledních parlamentních voleb vystoupil král Carol v celostátním rozhlasovém vysílání s oznámením, že dosavadní parlament bude rozpuštěn a veškerá vládní moc přejde přímo do jeho rukou.\n\nAčkoli jde o krajní opatření, Carol zdůrazňuje, že je nezbytné pro budoucí návrat Rumunska ke skutečné demokracii a že půjde pouze o dočasné řešení problému, který by jinak mohl přetrvávat."
 BA_romania_royal_dictatorship.1.a: "Snad nás dokáže vést správným směrem..."
 BA_romania_german_four_year_plan.100.t: "[ROM.GetNameDefCap] si přeje vstoupit do frakce [GER.GetFactionName]"
 BA_romania_german_four_year_plan.100.d: "Dnes časně ráno dorazil vyslanec země [ROM.GetNameDef] s žádostí o přijetí do frakce [GER.GetFactionName]. Zdůraznil, že vztahy mezi našimi zeměmi se v poslední době zlepšují a že vzhledem k měnící se situaci v Evropě v nás jeho vláda vidí jediného logického spojence.\n\nJiž dříve byly připraveny plány, jak s Rumunskem naložit. Jeho dobrovolné přiblížení k nám však může potřebu těchto plánů zcela odstranit, nebo naopak jejich uskutečnění urychlit."
 BA_romania_german_four_year_plan.100.a: "Vítaná posila."
 BA_romania_german_four_year_plan.100.c: "S Balkánem máme jiné plány."
 BA_romania_german_four_year_plan.101.t: "[GER.GetNameDefCap] nás přijímá do frakce [GER.GetFactionName]"
 BA_romania_german_four_year_plan.101.d: "Naštěstí se zdá, že vláda země [GER.GetNameDef] je více než ochotna přijmout nás do svého spojenectví. Bez její podpory by bylo jen otázkou času, než by se země [SOV.GetNameDef] začala domáhat našich území, ať už postupným vynucováním územních ústupků, nebo násilným podrobením.\n\nNyní, když máme tohoto mocného spojence po boku, můžeme naše obyvatelstvo ujistit, že stojíme na správné straně dějin a že veškeré územní požadavky i pokusy o expanzi ze strany země [SOV.GetNameDef] budou odraženy."
 BA_romania_german_four_year_plan.101.a: "To jsou skvělé zprávy."
 BA_romania_german_four_year_plan.102.t: "Německý čtyřletý plán"
 BA_romania_german_four_year_plan.102.d.g: "V časných ranních hodinách dorazil z města [GER.capital.GetCapitalVictoryPointName] německý úředník s malým doprovodem. Společně nám představili čtyřletý plán hospodářského rozvoje. Značná část kapitálu potřebného k dalšímu rozšíření těžby na munténských ropných polích by pocházela ze země [GER.GetNameDef], téměř každý barel vytěžené ropy by však namísto využití v Rumunsku putoval přímo do města [GER.capital.GetCapitalVictoryPointName].\n\nSamotná nabídka je zjevnou snahou o naše hospodářské podrobení, a proto máme v zásadě tři možnosti. Můžeme doufat, že Němci přijmou výhodnější protinávrh, který bude přínosný pro obě strany. Můžeme plán rovnou odmítnout a riskovat hospodářskou odvetu, nebo jej navzdory zjevným nevýhodám přijmout."
 BA_romania_german_four_year_plan.102.a: "Předložme protinávrh."
 BA_romania_german_four_year_plan.102.b: "Rozhodně ne! Co přijde příště? Vojenská integrace?"
 BA_romania_german_four_year_plan.102.c: "Třeba se nám to časem vyplatí..."
 BA_romania_german_four_year_plan.103.t: "[GER.GetNameDefCap] odmítá naši žádost o vstup do frakce [GER.GetFactionName]"
 BA_romania_german_four_year_plan.103.d: "Bohužel se zdá, že země [GER.GetNameDef] nemá zájem přijmout nás do svého spojenectví. Zda to znamená, že uzavřela dohodu se zemí [SOV.GetNameDef], [HUN.GetNameDef] nebo [BUL.GetNameDef] a chystá se připravit nás o naše území, zatím nevíme. Musíme se však připravit na možný útok ze všech stran.\n\nNyní je důležitější než kdy jindy ujistit náš lid, že se nevzdáme ani pídi země, aniž by za ni agresor zaplatil krví."
 BA_romania_german_four_year_plan.103.a: "Musíme se připravit."
 BA_romania_german_four_year_plan.2.t: "[FROM.GetNameDefCap] přichází s alternativním čtyřletým plánem"
 BA_romania_german_four_year_plan.2.d: "Poté, co měla země [ROM.GetNameDef] několik hodin na zvážení našeho návrhu, se její vyslanec vrátil s protinabídkou. Ta by pro nás stále byla výhodná, pro Rumunsko však představuje mnohem lepší dohodu než náš původní návrh.\n\nMísto toho, aby nám Rumuni odevzdávali veškerou produkci svých ropných polí přímo do města [GER.capital.GetCapitalVictoryPointName], nabízejí spolupráci při výstavbě modernějších rafinerií a svůj vstup do frakce [GER.GetFactionName]. Tím by se zajistilo pokračování dodávek ropy pro nás i naše spojence."
 BA_romania_german_four_year_plan.2.a: "Zajímavý návrh, můžeme souhlasit."
 BA_romania_german_four_year_plan.2.b: "Pak z dohody nic nebude."
 BA_romania_german_four_year_plan.21.t: "[GER.GetNameDefCap] nás přijímá do frakce [GER.GetFactionName]"
 BA_romania_german_four_year_plan.21.d: "Zdá se, že náš protinávrh byl Němci přijat natolik příznivě, že nám umožní vstoupit do jejich spojenectví.\n\nS tak mocným spojencem po boku můžeme našemu lidu oznámit, že stojíme na správné straně dějin a že veškeré územní požadavky či expanzivní snahy země [SOV.GetNameDef] budou odraženy."
 BA_romania_german_four_year_plan.21.a: "Skvělé zprávy!"
 BA_romania_german_four_year_plan.22.t: "[GER.GetNameDefCap] odmítá naši žádost o vstup do frakce [GER.GetFactionName]"
 BA_romania_german_four_year_plan.22.d: "Němci bohužel neprojevili zájem o náš protinávrh. Zjevně dávají přednost našemu hospodářskému podrobení před tím, než by nás přijali do svého spojenectví. To nám však říká jednu zásadní věc: musíme se připravit na možný útok ze všech stran.\n\nNyní je důležitější než kdy jindy ujistit náš lid, že se nevzdáme ani pídi země, aniž by za ni agresor zaplatil krví."
 BA_romania_german_four_year_plan.22.a: "To nevěstí nic dobrého."
 BA_romania_german_four_year_plan.3.t: "[FROM.GetNameDefCap] odmítá čtyřletý plán"
 BA_romania_german_four_year_plan.3.d: "Náš vyslanec do města [ROM.capital.GetCapitalVictoryPointName] se dnes vrátil s nepříliš příjemnými zprávami. Vláda země [ROM.GetNameDef] náš navrhovaný plán kategoricky odmítla a našemu zástupci pouze popřála šťastnou cestu zpět do města [GER.capital.GetCapitalVictoryPointName].\n\nNaše reakce může výrazně zkomplikovat budoucí vztahy mezi oběma zeměmi. Můžeme však také celou záležitost přejít a pokračovat v dovozu rumunské ropy jako dosud."
 BA_romania_german_four_year_plan.3.a: "Budiž, koneckonců je to jejich ropa."
 BA_romania_german_four_year_plan.3.b: "Uvidíme, co dokáže trocha hospodářského nátlaku."
 BA_romania_german_four_year_plan.31.t: "[GER.GetNameDefCap] respektuje naši svrchovanost"
 BA_romania_german_four_year_plan.31.d: "Ačkoli jsou naše ropná pole zásadní součástí připravovaných válečných plánů německého vrchního velení, zdá se, že země [GER.GetNameDef] respektuje naše právo jakožto suverénního státu její nabídku odmítnout."
 BA_romania_german_four_year_plan.31.a: "To je... překvapivé."
 BA_romania_german_four_year_plan.32.t: "[GER.GetNameDefCap] zahajuje hospodářskou odvetu"
 BA_romania_german_four_year_plan.32.d: "Jak jsme očekávali, naše ropná pole představují zásadní součást připravovaných válečných plánů německého vrchního velení. Odmítnutí čtyřletého plánu proto vedlo k tomu, že nám Němci zvýšili ceny svých surovin a naše vlastní zdroje jsou nyní ochotni nakupovat pouze za snížené ceny."
 BA_romania_german_four_year_plan.32.a: "To jsme mohli čekat."
 BA_romania_german_four_year_plan.4.t: "[FROM.GetNameDefCap] neochotně přijímá čtyřletý plán"
 BA_romania_german_four_year_plan.4.d: "Vyslanec, kterého jsme dříve poslali do města [ROM.capital.GetCapitalVictoryPointName], se dnes ozval s vynikající zprávou. Vláda země [ROM.GetNameDef] přijala čtyřletý plán a tamní ropná pole se již připravují na odesílání barelů ropy přímo do města [GER.capital.GetCapitalVictoryPointName]."
 BA_romania_german_four_year_plan.4.a: "Nečekané, ale vítané překvapení."
 BA_romania_german_four_year_plan.41.t: "Hospodářské podrobení zemí [GER.GetNameDef]"
 BA_romania_german_four_year_plan.41.d: "V souladu s německým čtyřletým plánem je ropa těžená a zpracovávaná na munténských ropných polích nyní odkláněna do města [GER.capital.GetCapitalVictoryPointName]. Výměnou jsme obdrželi pouze základní hospodářské odškodnění za surovinu, která bude v nadcházejících letech nepochybně pohánět německou válečnou mašinerii."
 BA_romania_german_four_year_plan.41.a: "Doufejme, že se to nakonec vyplatí..."
 BA_romania_combat_iron_guard.1.t: "Shromáždění Železné gardy poškodilo infrastrukturu"
 BA_romania_combat_iron_guard.1.d: "Po dalším shromáždění Železné gardy došlo k poškození části místní infrastruktury, ať už úmyslně, nebo nešťastnou náhodou. Železná garda se každopádně stává stále větším důvodem k obavám. Pokud budeme muset po každém jejím shromáždění financovat opravy všeho, co její členové zničí, vypořádání se s tímto hnutím bude nepochybně velmi nákladné."
 BA_romania_combat_iron_guard.1.a: "Rozežeňte je a škody co nejrychleji opravte."
 BA_romania_combat_iron_guard.2.t: "Shromáždění Železné gardy způsobilo požár továrny"
 BA_romania_combat_iron_guard.2.d: "Včera byly místní hasičské sbory přivolány k požáru, který vypukl po shromáždění místní organizace Železné gardy. Zatím není jasné, zda za požárem skutečně stojí její členové, odpůrci hnutí však na gardisty okamžitě ukázali prstem."
 BA_romania_combat_iron_guard.2.a: "Přivolejte hasiče!"
 BA_romania_combat_iron_guard.3.t: "Železná garda využila shromáždění k přepadení zbrojovky"
 BA_romania_combat_iron_guard.3.d: "Po mimořádně násilném shromáždění před jednou z našich zbrojních továren vyšlo najevo, že samotná demonstrace sloužila pouze jako zástěrka. Zatímco poutala pozornost, malá skupina členů Železné gardy pronikla do továrny.\n\nZdá se, že se jim podařilo odnést jen několik pušek, během útěku však také sabotovali část továrního vybavení."
 BA_romania_combat_iron_guard.3.a: "Najděte a zatkněte všechny účastníky přepadení."
 BA_romania_transylvanian_reclamation.1.t: "[FROM.GetNameDefCap] navrhuje výměnu území"
 BA_romania_transylvanian_reclamation.1.d: "Po našem společném vyhlášení války zemi [SOV.GetNameDef] nyní rumunská vojska okupují části západní Ukrajiny. Rumuni navrhují, že nám předají kontrolu nad Podněstřím, zahrnujícím Vinnycji, Baltu-Tiraspol a Oděsu, pokud jim výměnou vrátíme sedmihradská území, která byla přidělena zemi [HUN.GetNameDef].\n\nJak bychom měli odpovědět?"
 BA_romania_transylvanian_reclamation.1.a: "Ne, ať si vezmou území od země [SOV.GetNameDef]."
 BA_romania_transylvanian_reclamation.1.b: "Hmm... prokázali, že si to zaslouží."
 BA_romania_transylvanian_reclamation.2.t: "[FROM.GetNameDefCap] odmítá naši žádost o výměnu území"
 BA_romania_transylvanian_reclamation.2.d: "Po našem vstupu do války po boku země [GER.GetNameDef] proti zemi [SOV.GetNameDef] jsme doufali, že získaná východní území budeme moci využít k vyjednání návratu Sedmihradska.\n\nZdá se však, že Němci dávají přednost Maďarům. Bylo nám řečeno, že pokud usilujeme o územní rozšíření, máme nyní dostatek příležitostí na východě."
 BA_romania_transylvanian_reclamation.2.a: "Pak budeme postupovat na východ..."
 BA_romania_transylvanian_reclamation.3.t: "[FROM.GetNameDefCap] žádá o navrácení Sedmihradska"
 BA_romania_transylvanian_reclamation.3.d: "Překvapivým zvratem událostí se Rumunům zjevně podařilo přesvědčit Němce, aby jejich jménem požádali o obnovení rumunské vlády nad Sedmihradskem.\n\nNěmečtí představitelé zároveň zdůraznili, že rozhodnutí, zda se vzdáme území, která nám byla přidělena, je zcela na nás. Sami nemají zájem se touto záležitostí dále zabývat."
 BA_romania_transylvanian_reclamation.3.a: "Ne, právoplatné maďarské území si ponecháme."
 BA_romania_transylvanian_reclamation.3.b: "Pokud to spor ukončí, mohou je dostat zpět."
 BA_romania_transylvanian_reclamation.31.t: "[FROM.GetNameDefCap] si ponechává kontrolu nad Sedmihradskem"
 BA_romania_transylvanian_reclamation.31.d: "Jak jsme očekávali, země [HUN.GetNameDef] odmítla naši žádost o obnovení rumunské vlády nad Sedmihradskem, a to navzdory německému zprostředkování.\n\nTo, že jsme svá území nezískali zpět dnes, však neznamená, že se situace v budoucnu nemůže obrátit a nenaskytne se nám další příležitost."
 BA_romania_transylvanian_reclamation.31.a: "Nezbývá než vyčkat na svou chvíli."
 BA_romania_turn_of_the_tide.0.t: "[FROM.GetNameDefCap] jedná o míru se zemí [SOV.GetNameDef]"
 BA_romania_turn_of_the_tide.0.d: "Dozvěděli jsme se, že země [ROM.GetNameDef] prostřednictvím neutrálních prostředníků zahájila jednání se zemí [SOV.GetNameDef]. Ačkoli nemáme spolehlivé informace o obsahu připravované mírové smlouvy, rumunské vystoupení z války by vážně oslabilo naše křídlo a otevřelo prostor pro sovětský protiútok."
 BA_romania_turn_of_the_tide.0.a: "Velmi zajímavé, opravdu zajímavé..."
 BA_romania_turn_of_the_tide.1.t: "[FROM.GetNameDefCap] žádá o mírovou smlouvu"
 BA_romania_turn_of_the_tide.1.d: "Poté, co proti nám společně a bezostyšně vyhlásili válku, se nyní, když se válečné štěstí začíná obracet proti nim, Rumuni zjevně zdráhají umírat za Němce.\n\nProstřednictvím tajných diplomatických kanálů nás oslovili s návrhem mírové smlouvy, podle níž by vystoupili z frakce [GER.GetFactionName] a připojili se k frakci [SOV.GetFactionName].\n\nMůžeme je připoutat na svou stranu a donutit, aby se k nám připojili při postupu do německého vnitrozemí, nebo je smést z cesty společně s Němci."
 BA_romania_turn_of_the_tide.1.a: "O jednu frontu méně."
 BA_romania_turn_of_the_tide.1.b: "Vědí, jaké následky je čekají."
 BA_romania_turn_of_the_tide.2.t: "[FROM.GetNameDefCap] souhlasí s mírovou smlouvou"
 BA_romania_turn_of_the_tide.2.d: "Diplomaté v Moskvě naštěstí souhlasili s uzavřením příměří. Jednou z podmínek dohody však je náš vstup do frakce [SOV.GetFactionName] a zapojení do její války proti Němcům.\n\nZa normálních okolností bychom se pokusili vyhnout i této podmínce, Maďaři však nyní okupují právoplatná rumunská území a tato dohoda nám poskytuje nejlepší příležitost, jak je získat zpět."
 BA_romania_turn_of_the_tide.2.a: "Doufejme, že jsme se rozhodli správně."
 BA_romania_turn_of_the_tide.3.t: "[FROM.GetNameDefCap] odmítá mírovou smlouvu"
 BA_romania_turn_of_the_tide.3.d: "Vláda země [SOV.GetNameDef] bohužel odmítla naši žádost o mírovou smlouvu. Místo toho prohlásila, že nyní musíme nést následky svého rozhodnutí spojit osud s Němci.\n\nNezbývá nám než se zakopat a doufat, že se nám časem podaří zahájit protiútok proti sovětským vojskům."
 BA_romania_turn_of_the_tide.3.a: "Pak budeme bojovat až do hořkého konce!"
 BA_romania_another_great_game.1.t: "[FROM.GetNameDefCap] nás oslovuje kvůli zemi [SOV.GetNameDef]"
 BA_romania_another_great_game.1.d: "Po uzavření pařížské mírové smlouvy oslovil naši delegaci vyslanec země [ROM.GetNameDef]. Zdůraznil význam moskevské smlouvy a zásadní roli Rumunska při zkrácení války v Evropě. Nyní žádá, abychom uznali jeho podíl na porážce mocností Osy a považovali Rumunsko nikoli za poraženého spolubojovníka Německa, ale za vítězného spojence.\n\nVyslanec zdůraznil, že bez převratu, který dosadil na trůn krále Michaela, mohla válka pokračovat dodnes. Rumunský lid by podle něj neměl být trestán za činy předchozího režimu, když současná vláda pomohla válku ukončit.\n\nNyní musíme rozhodnout, zda zemi [FROM.GetNameDef] uznáme za vítězného člena Spojenců, nebo za poraženého člena Osy."
 BA_romania_another_great_game.1.a: "Prokázali, že byli cenným členem Spojenců."
 BA_romania_another_great_game.1.b: "Spojili svůj osud s Němci, nyní musí nést následky."
 BA_romania_another_great_game.11.t: "[FROM.GetNameDefCap] uznává náš přínos"
 BA_romania_another_great_game.11.d: "Po jednání se západními Spojenci o budoucnosti našeho národa se zdá, že uznávají význam našeho příspěvku k ukončení války v Evropě. Považují jej za natolik zásadní, že jsou ochotni přehlédnout zločiny předchozí vlády, která nás přivedla k podpisu Paktu tří a vstupu do Osy v její válce proti světu."
 BA_romania_another_great_game.11.a: "Skvělé zprávy!"
 BA_romania_another_great_game.12.t: "[FROM.GetNameDefCap] nás nadále považuje za poraženou zemi"
 BA_romania_another_great_game.12.d: "Po jednání se západními Spojenci se ukázalo, že nejsou ochotni přehlédnout činy naší předchozí vlády na východě. Navzdory našemu podílu na ukončení války nás nadále považují za jednoho z poražených členů Osy."
 BA_romania_another_great_game.12.a: "To se... dalo očekávat."
 BA_romania_another_great_game.2.t: "[FROM.GetNameDefCap] žádá o povolení opustit frakci [SOV.GetFactionName]"
 BA_romania_another_great_game.2.d: "Před časem k nám dorazil vyslanec země [FROM.GetNameDef], aby projednal rumunské členství ve frakci [SOV.GetFactionName], přesněji řečeno možnost jejího opuštění.\n\nPřipomněl, že ačkoli se Rumunsko původně připojilo k Němcům ve válce proti nám, následný převrat a jeho přínos k ukončení konfliktu byly zásadní pro to, že válka skončila právě tehdy. Nyní se touto zásluhou snaží podpořit žádost o vystoupení z frakce [SOV.GetFactionName], aby mohlo napravit své vztahy se západními Spojenci."
 BA_romania_another_great_game.2.a: "Prokázali svou hodnotu, neměli bychom je trestat za činy Němců."
 BA_romania_another_great_game.2.b: "Změna stran neodčiní škody, které napáchali. Ne."
 BA_romania_another_great_game.21.t: "[FROM.GetNameDefCap] nám dovoluje opustit frakci [SOV.GetFactionName]"
 BA_romania_another_great_game.21.d: "Překvapivým zvratem událostí země [SOV.GetNameDef] souhlasila s naší žádostí o vystoupení z její frakce. Domácí politici očekávali, že nám Sověti budou naše předchozí kroky vyčítat a přinutí nás zůstat v jejich bezprostřední sféře vlivu. Zdá se však, že tomu tak není."
 BA_romania_another_great_game.21.a: "Nečekané, ale vítané překvapení."
 BA_romania_another_great_game.22.t: "[FROM.GetNameDefCap] trvá na moskevské smlouvě"
 BA_romania_another_great_game.22.d: "Ačkoli jsme doufali v zázrak, který by nám umožnil opustit frakci [SOV.GetFactionName], zdá se, že Sověti dosud nejsou ochotni uvolnit své sevření naší země."
 BA_romania_another_great_game.22.a: "Bohužel, ale co jsme vlastně čekali?"
 BA_romania_another_great_game.3.t: "[FROM.GetNameDefCap] navrhuje neutralitu výhodnou pro zemi [SOV.GetNameDef]"
 BA_romania_another_great_game.3.d: "Po našem rozhodnutí ponechat zemi [FROM.GetNameDef] v naší sféře vlivu přišla její vláda s novým návrhem dohody. Podle ní by Rumunsko vystoupilo z frakce [SOV.GetFactionName], ale zavázalo by se k přísné neutralitě a nevstoupilo do žádného jiného spojenectví. Součástí návrhu je rovněž řada ustanovení zvýhodňujících naše zájmy. Rumunsko by zůstalo přísně neutrální vůči Západu, současně by však udržovalo příznivé obchodní vztahy s námi a účastnilo se společných vojenských cvičení.\n\nVeškeré nákupy zahraniční výzbroje by navíc musely probíhat naším prostřednictvím, nikoli přes západní země."
 BA_romania_another_great_game.3.a: "To zní výhodně, můžeme souhlasit."
 BA_romania_another_great_game.3.b: "Už jsme jednou řekli ne."
 BA_romania_another_great_game.31.t: "[FROM.GetNameDefCap] souhlasí s prosovětskou neutralitou"
 BA_romania_another_great_game.31.d: "Zdá se, že náš návrh na přijetí prosovětské neutrality našel u Sovětů pochopení a ti s ním souhlasili. To znamená, že již nejsme přímým členem frakce [SOV.GetFactionName] a můžeme podle vlastního uvážení navazovat zahraniční vztahy s ostatními zeměmi.\n\nPodle naší dohody však budou muset veškeré budoucí nákupy zbraní probíhat výhradně prostřednictvím země [SOV.GetNameDef]. To by nám nemělo způsobit zásadní potíže, neboť nám to umožní sjednotit výzbroj se sovětskými standardy a zajistí spolehlivého dodavatele pro případ potřeby."
 BA_romania_another_great_game.31.a: "Vynikající zprávy!"
 BA_romania_another_great_game.32.t: "[FROM.GetNameDefCap] odmítá náš návrh"
 BA_romania_another_great_game.32.d: "Zdá se, že země [SOV.GetNameDef] není spokojena s našimi opakovanými návrhy na obnovení nezávislosti. Sověti znovu zdůraznili, že jsme poraženým členem Osy a nemůžeme očekávat navrácení plné suverenity jen proto, že jsme si vedli dobře proti nepříteli, který nebyl připraven na naši zradu."
 BA_romania_another_great_game.32.a: "Taková škoda..."
 BA_romania_another_great_game.5.t: "[FROM.GetNameDefCap] žádá o naši případnou intervenci"
 BA_romania_another_great_game.5.d: "Dnes nás navštívil vyslanec země [FROM.GetNameDef] s žádostí, která má prozatím zůstat v tajnosti. Zdá se, že země [SOV.GetNameDef] pevně trvá na udržení Rumunska ve své sféře vlivu. Navzdory návrhům na prosovětskou neutralitu Sověti odmítají povolit jakoukoli změnu jeho současného postavení.\n\nRumuni nás nyní žádají, zda bychom v rozhodující chvíli zasáhli v jejich prospěch a pomohli přerušit vazby mezi zeměmi [SOV.GetNameDef] a [FROM.GetNameDef].\n\nAčkoli to nebylo výslovně řečeno, pokud by situace dospěla ke krajnímu řešení, očekávalo by se od nás, že se připojíme k Rumunům v doufejme krátké válce."
 BA_romania_another_great_game.5.a: "Jakkoli jsme Sovětům vděční, dlouhodobě jim nelze důvěřovat."
 BA_romania_another_great_game.5.b: "Pokud Sověti řekli ne, kdo jsme my, abychom je přehlasovali?"
 BA_romania_another_great_game.51.t: "[FROM.GetNameDefCap] se za nás postaví"
 BA_romania_another_great_game.51.d: "Od našeho vyslance, který byl vyslán do země [FROM.GetNameDef], dorazily dobré zprávy. Západní Spojenci nás podpoří, až se obrátíme na zemi [SOV.GetNameDef] a předložíme ultimátum požadující stažení všech sovětských poradců a vojenského personálu z Rumunska.\n\nZatím nevíme, jak na tento krok Sověti zareagují, musíme však být připraveni."
 BA_romania_another_great_game.51.a: "Výborně, nyní znovu promluvíme s Moskvou."
 BA_romania_another_great_game.52.t: "[FROM.GetNameDefCap] naše požadavky nepodpoří"
 BA_romania_another_great_game.52.d: "Zdá se, že západní Spojenci nejsou ochotni riskovat válku se zemí [SOV.GetNameDef] kvůli naší nezávislosti, přestože nás uznávají jako vítězného člena spojeneckých sil v Evropě.\n\nNa druhou stranu již dříve ponechali Polsko napospas sovětskému podrobení, takže jsme od nich možná neměli vůbec nic očekávat."
 BA_romania_another_great_game.52.a: "Pak jsme v této situaci uvězněni."
 BA_romania_another_great_game.6.t: "[FROM.GetNameDefCap] požaduje stažení veškerého sovětského personálu z Rumunska"
 BA_romania_another_great_game.6.d: "Ačkoli jsme vládě země [FROM.GetNameDef] opakovaně připomínali, že patří mezi poražené členy bývalé Osy a musí nést příslušné důsledky, Rumuni se zjevně nevzdali snahy získat plnou nezávislost.\n\nProstřednictvím tajných diplomatických jednání se jim podařilo přesvědčit západní Spojence, aby jejich požadavky na nezávislost podpořili, a podle všeho jsou kvůli nim připraveni i válčit.\n\nJak na jejich ultimátum odpovíme?"
 BA_romania_another_great_game.6.a: "Rozpoutat další světovou válku kvůli Rumunsku? Nechme je odejít."
 BA_romania_another_great_game.6.b: "Ne, ani v této záležitosti Západu neustoupíme."
 BA_romania_another_great_game.61.t: "[FROM.GetNameDefCap] ustupuje"
 BA_romania_another_great_game.61.d: "Zdá se, že naše politické manévrování přineslo ovoce. Země [SOV.GetNameDef] oznámila úplné stažení veškerého sovětského personálu z našeho území. Moskevská vláda není spokojena se způsobem, jakým jsme situaci vyřešili, jinou možnost nám však nedala.\n\nKonečně můžeme svobodně rozhodovat o vlastní budoucnosti a naším prvním krokem bude sblížení se západními Spojenci."
 BA_romania_another_great_game.61.a: "Ach, vítězství."
 BA_romania_another_great_game.62.t: "[FROM.GetNameDefCap] proti nám mobilizuje"
 BA_romania_another_great_game.62.d: "Zdá se, že naše požadavky na stažení sovětských sil z Rumunska nebyly v Moskvě přijaty vůbec dobře. Namísto odchodu vojenského i civilního personálu Sověti své pozice zjevně ještě posilují a zpravodajské informace naznačují, že sovětská válečná mašinerie nyní obrací svou pozornost k nám."
 BA_romania_another_great_game.62.a: "Věděli jsme, že se to může stát."
 BA_romania_bulgaria_ssr.1.t: "[FROM.GetNameDefCap] navrhuje sjednocení se zemí [BUL.GetNameDef]"
 BA_romania_bulgaria_ssr.1.d: "Před několika hodinami k nám dorazil vyslanec země [FROM.GetNameDef] s návrhem, který má posílit frakci [SOV.GetFactionName] a upevnit naše postavení na Balkáně.\n\nKonkrétně navrhuje sjednocení zemí [FROM.GetNameDef] a [BUL.GetNameDef]. Podobná myšlenka se zjevně objevila již v minulosti, byť za jiných okolností a z odlišných důvodů.\n\nNevíme, co by si o takovém kroku myslel Západ, ten však má své sféry vlivu a my máme své vlastní.\n\nJak se tedy rozhodneme?"
 BA_romania_bulgaria_ssr.1.a: "Zajímavá myšlenka, zeptejme se Bulharů."
 BA_romania_bulgaria_ssr.1.b: "A proč bychom s tím měli souhlasit?"
 BA_romania_bulgaria_ssr.11.t: "[FROM.GetNameDefCap] otevírá otázku rumunsko-bulharského sjednocení"
 BA_romania_bulgaria_ssr.11.d: "Překvapivým zvratem událostí nás země [FROM.GetNameDef] oslovila s návrhem na rumunsko-bulharské sjednocení, který kdysi před první světovou válkou koloval mezi evropskými dvory, ale nakonec neuspěl.\n\nZdá se, že obyvatelé země [ROM.GetNameDef] mají o tuto myšlenku značný zájem. Slyšeli jsme však, že ji začínají podporovat i někteří naši vlastní politici, takže rozhodně nejde o jednostranný požadavek.\n\nUskutečnění návrhu by ovšem znamenalo zánik země [BUL.GetNameDef] v její současné podobě. A přestože má sjednocení své zastánce, nechybějí mu ani odpůrci."
 BA_romania_bulgaria_ssr.11.a: "Pokud si to lid přeje, proč bychom mu měli bránit?"
 BA_romania_bulgaria_ssr.11.b: "Raději zůstaneme Bulhary."
 BA_romania_bulgaria_ssr.111.t: "[FROM.GetNameDefCap] souhlasí se sjednocením!"
 BA_romania_bulgaria_ssr.111.d: "Dnes jsme obdrželi zprávu, že země [SOV.GetNameDef] nejen oslovila vládu země [BUL.GetNameDef], ale že Bulhaři také přijali návrh na sjednocení!\n\nPro oba naše národy jde o historický okamžik. V minulosti jsme byli soupeři i spojenci, nyní se však skutečně stáváme bratry.\n\nBukurešťská vláda již začala přijímat informace od vlády v Sofii a přípravy na sjednocení jsou v plném proudu."
 BA_romania_bulgaria_ssr.111.a: "Ať žije rumunsko-bulharská unie!"
 BA_romania_bulgaria_ssr.12.t: "[FROM.GetNameDefCap] blokuje návrh na sjednocení"
 BA_romania_bulgaria_ssr.12.d: "Nepříjemným, avšak očekávaným vývojem země [SOV.GetNameDef] zablokovala navrhované sjednocení našich dvou národů. Sověti tvrdí, že v nejlepším zájmu frakce [SOV.GetFactionName] je zachování nezávislosti obou zemí.\n\nPokud by v Bukurešti nebo Sofii propukl chaos, zůstal by omezen na jednu zemi, místo aby současně destabilizoval oba národy.\n\nVěděli jsme, že šance na přijetí návrhu jsou malé, přesto stálo za to jej předložit."
 BA_romania_bulgaria_ssr.12.a: "Bohužel, dalo se to očekávat."
 BA_romania_bulgaria_ssr.112.t: "[FROM.GetNameDefCap] odmítá návrh na sjednocení"
 BA_romania_bulgaria_ssr.112.d: "Ačkoli země [SOV.GetNameDef] zjevně projevila zájem o náš návrh na sjednocení s Bulhary, samotná bulharská strana mu není nakloněna natolik, jak jsme původně očekávali.\n\nJejí důvody pro odmítnutí chápeme, neměli bychom však dovolit, aby tento neúspěch poškodil naši budoucí spolupráci se zemí [BUL.GetNameDef]."
 BA_romania_bulgaria_ssr.112.a: "To je nešťastné."
 BA_romania.1.t: "[FROM.GetName] žádá o Moldavskou ASSR"
 BA_romania.1.d: "V roce 1924 sovětské úřady vytvořily ve státě [834.GetName] Moldavskou autonomní sovětskou socialistickou republiku, přestože obyvatelstvo oblasti bylo převážně ukrajinské. Tento krok, zjevně zaměřený na ospravedlnění územních nároků vůči rumunskému Moldavsku, nyní vedl vládu země [FROM.GetNameDef] k požadavku, abychom jí odstoupili území na naší straně hranice, které tvořilo Moldavskou ASSR, a ukončili tak dlouhotrvající spor."
 BA_romania.1.a: "Jako gesto dobré vůle jim území přenecháme."
 BA_romania.1.b: "Strategicky výhodnější bude si je ponechat."
 BA_romania.2.t: "[FROM.GetName] odstupuje Moldavskou ASSR"
 BA_romania.2.d: "Od našich zástupců ve městě [SOV.capital.GetCapitalVictoryPointName] dnes dorazily příznivé zprávy. Vláda země [FROM.GetNameDef] souhlasila s odstoupením státu [834.GetName] a rozpuštěním správního celku, který dříve tvořil Moldavskou ASSR."
 BA_romania.2.a: "Velké Rumunsko je ještě větší!"
 BA_romania.3.t: "[FROM.GetName] odmítá odstoupit Moldavskou ASSR"
 BA_romania.3.d: "Navzdory našemu úsilí o zlepšení vztahů se zemí [FROM.GetNameDef] byli naši diplomaté ihned poté, co předložili požadavek na odstoupení území dříve náležejících Moldavské ASSR, informováni, že tamní vláda takový návrh nepřijme."
 BA_romania.3.a: "Musíme na svém nároku trvat!"
 BA_romania.3.b: "Nesmíme si znepřátelit [FROM.GetName]."
 BA_romania.4.t: "[FROM.GetName] se dovolává našeho spojenectví"
 BA_romania.4.d: "[FROM.GetNameDef], napadená zemí [SOV.GetNameDef], nás vyzvala, abychom se k válce připojili na její obranu. Podle polsko-rumunské spojenecké smlouvy z roku 1921 jsme se zavázali v takové situaci poskytnout pomoc, pokud o ni budeme požádáni. Obrana proti sovětské moci však může představovat mimořádně náročný úkol."
 BA_romania.4.a: "Dodržíme svůj slib."
 BA_romania.4.b: "Ohrozilo by to naše vlastní přežití."
 BA_romania.5.t: "[FROM.GetName] nám přichází na pomoc"
 BA_romania.5.d: "Dnes jsme obdrželi zprávu, že země [FROM.GetNameDef] dostála spojeneckým závazkům a připojila se k našemu boji proti zemi [SOV.GetNameDef]. Tato zpráva výrazně pozvedla morálku našich vojáků, kteří se těší na spolupráci s novým spojencem."
 BA_romania.5.a: "Společně k vítězství!"
 BA_romania.6.t: "[FROM.GetName] zrazuje polsko-rumunské spojenectví"
 BA_romania.6.d: "Naši zástupci v zemi [FROM.GetNameDef] dnes zažili nepříjemné překvapení. Naše žádost o pomoc proti zemi [SOV.GetNameDef] byla okamžitě zamítnuta, přestože se druhá strana k poskytnutí podpory zavázala polsko-rumunskou spojeneckou smlouvou.\n\nZdá se, že tamní vláda již dříve projednávala možnost, že se naše spojenectví pokusíme uplatnit, a dospěla k závěru, že riziko zatažení do války je příliš vysoké."
 BA_romania.6.a: "S nimi si to vyřídíme později."
 BA_romania.10.t: "[FROM.GetName] žádá o přístup k úžinám pro své spojence"
 BA_romania.10.d: "Země [FROM.GetNameDef], která buduje spojenectví na Balkáně, považuje pravidla pro plavbu mezi Černým a Středozemním mořem za příliš omezující. Proto nás požádala, abychom tato pravidla vůči ní a jejím spojencům uplatňovali méně přísně."
 BA_romania.10.a: "Rozumná žádost."
 BA_romania.10.b: "Musíme dodržovat úmluvu z Montreux."
 BA_romania.11.t: "[FROM.GetName] povoluje průjezd úžinami"
 BA_romania.11.d: "Dnes jsme obdrželi příznivé zprávy ze země [TUR.GetNonIdeologyName]. Tamní vláda slíbila, že vůči nám a našim spojencům nebude příliš přísně vymáhat ustanovení úmluvy z Montreux. To by mělo výrazně usnadnit naše zásobování."
 BA_romania.11.a: "Skvělé zprávy."
 BA_romania.12.t: "[FROM.GetName] odmítá povolit průjezd úžinami"
 BA_romania.12.d: "Naši diplomaté nás dnes informovali, že země [TUR.GetNameDef] bohužel odmítla přiznat nám a našim spojencům zvláštní práva na plavbu černomořskými úžinami, které má pod svou kontrolou."
 BA_romania.12.a: "Nedá se nic dělat."
 BA_romania.12.b: "Musíme obsadit Bospor!"
 BA_romania.13.t: "NMS Delfinul připlouvá ze země [ITA.GetNonIdeologyName]"
 BA_romania.13.d: "Dnes naše námořnictvo slavnostně přivítalo ponorku NMS Delfinul, jejíž stavba byla pod naším dohledem dokončena v zemi [ITA.GetNameDef] přibližně před týdnem. Jako první ponorka navržená pro naše námořnictvo a první plavidlo třídy Delfinul symbolizuje začátek našich plánů na modernizaci loďstva."
 BA_romania.13.a: "Podrobme ji zkouškám."
 BA_romania.14.t: "Vyvažování zahraničních vztahů"
 BA_romania.14.d: "Naše zahraniční politika se již dlouho orientuje na Francii a její tradiční spojence. Rovnováha sil v Evropě se však začíná měnit a my se nyní musíme rozhodnout, zda setrváme na dosavadním kurzu, nalezneme nové spojence, nebo se pokusíme o pragmatičtější přístup."
 BA_romania.14.a: "Když dokážeme hrát na obě strany..."
 BA_romania.15.t: "Spor o vedení strany"
 BA_romania.15.desc: "Nyní, když jsme upevnili svou vládu nad zemí [ROOT.GetNonIdeologyName], nastal čas přehodnotit, kdo by měl v budoucnu vést komunistickou stranu i celý stát. Ačkoli se socialistická hnutí dostala k moci díky vedení osoby [ROOT.GetLeader], možná by jiná významná osobnost dokázala jejich postavení lépe udržet."
 BA_romania.15.a: "Úsilí dosavadního vedení musí pokračovat."
 BA_romania.15.b: "Gheorghiu-Dej má podporu našich reformátorů."
 BA_romania.15.c: "Pătrășcanu prosazuje pragmatičtější přístup."
 BA_romania.16.t: "[FROM.GetName] navrhuje Balkánskou unii"
 BA_romania.16.desc: "Nová vláda země [FROM.GetNameDef] znovu oživila myšlenku Balkánské unie. Jelikož patříme mezi její spojence, není překvapením, že nás nyní tamní diplomaté oslovili, aby zjistili, zda bychom tento záměr podpořili."
 BA_romania.16.a: "Právě to si lidé přejí."
 BA_romania.16.b: "To je jen další forma expanzionismu."
 BA_romania.17.t: "[FROM.GetName] souhlasí se sjednocením"
 BA_romania.17.desc: "Z města [FROM.capital.GetCapitalVictoryPointName] dorazily dobré zprávy. Náš návrh na balkánskou integraci byl přijat příznivě. Složitá administrativní stránka sjednocení se již řeší a v zemi [FROM.GetNameDef] se začínají objevovat naše státní vlajky."
 BA_romania.17.a: "Skvělé zprávy!"
 BA_romania.18.t: "[FROM.GetName] odmítá sjednocení"
 BA_romania.18.desc: "Zdá se, že obyvatelé země [FROM.GetNameDef], nebo přinejmenším jejich političtí představitelé, nepřijali náš návrh na vytvoření Balkánské unie příznivě. Nyní musíme rozhodnout, jak dále postupovat. Možná časem změní názor."
 BA_romania.19.t: "[FROM.GetName] navrhuje společný fortifikační program"
 BA_romania.19.desc: "V rámci programů vojenské spolupráce, které země [FROM.GetNonIdeologyName] zahájila v naší alianci, byl předložen návrh na společné vybudování obranné linie podél vnějších hranic naší frakce."
 BA_romania.19.a: "Investice, která se vyplatí."
 BA_romania.19.b: "Takové prostředky si nemůžeme dovolit."
 BA_romania.20.t: "$ROM_fate_of_the_monarchy$"
 BA_romania.20.desc: "Nedávno odstavený král Carol pochopil, že jeho vláda končí, a dnes jsme zjistili, že uprchl ze země. Ačkoli svým jednáním poškodil pověst monarchie, většina obyvatel si přeje její zachování jako záruky tolik potřebné stability rumunského politického života. Musíme proto rozhodnout, zda tuto úlohu dokáže splnit jeho syn, princ Michael, který se od svého otce distancoval již dávno před touto aférou."
 BA_romania.20.desc.2: "Po zajetí krále Carola II. během našeho nečekaného postupu na město [ROOT.capital.GetCapitalVictoryPointName] je jisté, že mu nedovolíme zastávat žádnou funkci, která by mohla umožnit jeho návrat k moci. Zůstává však otázka, jak naložit s ostatními členy královské rodiny, zejména s princem Michaelem, který se od svého otce již léta distancuje a nesdílí jeho politické názory."
 BA_romania.20.a: "Omezíme královské pravomoci na reprezentativní úlohu."
 BA_romania.20.b: "Uvěznit je všechny."
 BA_romania.20.c: "Ponecháme Michaela jako reprezentativní hlavu státu."
 BA_romania.20.d: "Král se bude podílet na politickém životě Rumunska."
 BA_romania.21.t: "[SOV.GetNameDefCap] odsuzuje naši politiku"
 BA_romania.21.desc: "Naše nedávná politická rozhodnutí vyvolala nespokojenost sovětského vedení, a tím i jeho přisluhovačů v zemi [ROM.GetNameDef]. Nyní se musíme rozhodnout, zda setrváme na dosavadním kurzu a budeme prosazovat větší nezávislost, nebo se pokusíme zemi [SOV.GetNameDef] usmířit."
 BA_romania.21.a: "Přistoupíme na některé ústupky."
 BA_romania.21.b: "Důvěřujeme vlastnímu výkladu komunismu."
 BA_romania.22.t: "[SOV.GetName] kritizuje vedení komunistické strany v naší zemi"
 BA_romania.22.desc: "Poté, co země [SOV.GetNameDef] odsoudila naše předchozí kroky jako odporující jejímu výkladu ideologie [?SOV.country_leader.GetIdeologyGroup], nyní svou kritiku a nenápadný nátlak ještě vystupňovala. Přímo napadá vedení naší komunistické strany kvůli jeho nedávným rozhodnutím."
 BA_romania.22.a: "Uklidníme je změnou vedení."
 BA_romania.22.b: "Jejich příkladu jsme následovali už dost dlouho."
 BA_romania.23.t: "[FROM.GetName] se vydává nezávislou cestou"
 BA_romania.23.desc: "Navzdory našemu vlivu na několik klíčových politiků země [FROM.GetNameDef] se tamní vláda začala ubírat směrem, který neodpovídá naší ideologii [?ROOT.country_leader.GetIdeologyGroup]. Můžeme to přehlédnout a pokračovat ve spolupráci, nebo této odchylky využít jako záminky k invazi a dosazení poslušnějšího vedení."
 BA_romania.23.a: "Nastal čas na intervenci."
 BA_romania.23.b: "Máme naléhavější starosti."
 BA_romania.24.t: "[FROM.GetName] nás zve do frakce [FROM.GetFactionName]"
 BA_romania.24.desc: "V rámci snahy vybudovat regionální spojenectví navazující na Balkánský pakt a Malou dohodu nám diplomaté země [FROM.GetNameDef] předložili návrh smlouvy, podle níž bychom vstoupili do frakce [FROM.GetFactionName]. Jejím deklarovaným cílem je společná obrana před fašistickým vlivem a dalšími potenciálními imperialistickými mocnostmi, možná se však za tímto návrhem skrývá něco víc."
 BA_romania.24.a: "Vstup by posílil naši bezpečnost."
 BA_romania.25.t: "[FROM.GetName] vstupuje do frakce [ROOT.GetFactionName]"
 BA_romania.25.desc: "Možná i díky přesvědčivým argumentům našich diplomatů souhlasila země [FROM.GetNameDef] se vstupem do frakce [ROOT.GetFactionName]. Následné dohody budou nepochybně přínosné pro obě strany."
 BA_romania.25.a: "Výborně!"
 BA_romania.26.t: "[FROM.GetName] odmítá vstoupit do frakce [ROOT.GetFactionName]"
 BA_romania.26.desc: "Navzdory úsilí našich diplomatů země [FROM.GetNameDef] odmítla vstoupit do našeho spojenectví. Možná nedůvěřuje nám ani našim spojencům, nebo se snad domnívá, že se dokáže konfliktům snáze vyhnout, pokud zůstane sama."
 BA_romania.26.a: "Škoda."
 BA_romania.28.t.backup: "[FROM.GetName] navrhuje intervenci"
 BA_romania.28.t: "[FROM.GetName] navrhuje intervenci proti zemi [ROM_ITA_conquest_target.GetName]"
 BA_romania.28.desc: "Přestože byly nejradikálnější proudy politiky země [FROM.GetNameDef] potlačeny, přetrvávající silné protikomunistické postoje přiměly tamní vládu předložit nám zajímavý návrh. Podle něj bychom společně napadli zemi [ROM_ITA_conquest_target.GetNameDef]. Naše spolupráce by měla zajistit rychlé vítězství a odradit ostatní mocnosti od zásahu."
 BA_romania.28.a: "Nepřítel našeho nepřítele..."
 BA_romania.28.b: "Nepomůžeme jim rozšiřovat jejich vliv."
 BA_romania.29.t: "Plány společné invaze přijaty"
 BA_romania.29.desc: "Naši diplomaté nás dnes informovali, že vládu země [FROM.GetNameDef] náš návrh na společnou invazi proti zemi [ROM_ITA_conquest_target.GetNameDef] příjemně překvapil. Tamní představitelé ji již delší dobu pečlivě sledovali jako možnou hrozbu."
 BA_romania.29.a: "Musíme zahájit vojenské přípravy."
 BA_romania.30.t: "[FROM.GetName] odmítá společnou invazi"
 BA_romania.30.desc: "Diplomaté země [FROM.GetNameDef] nás dnes informovali, že navzdory pečlivému sledování vývoje v zemi [ROM_ITA_conquest_target.GetNameDef] nepovažují tamní obyvatelstvo ani vláda její potenciální hrozbu za natolik vážnou, aby ospravedlnila tak krajní krok, jakým je invaze."
 BA_romania.30.a: "Invaze musí pokračovat."
 BA_romania.30.b: "Je to příliš riskantní."
 BA_romania.31.t: "[FROM.GetName] požaduje svrchovanost nad Slovenskem"
 BA_romania.31.desc: "Po pádu demokracie v zemi [FROM.GetNameDef] se její zahraničněpolitická orientace zjevně přiklonila k jiným autoritářským a militaristickým režimům. To se dnes jednoznačně potvrdilo, když její představitelé předložili požadavek své vlády, abychom jí odstoupili území na Slovensku."
 BA_romania.31.a: "Na válku nejsme připraveni."
 BA_romania.31.b: "Jen ať to zkusí!"
 BA_romania.32.t: "[FROM.GetName] odstupuje Slovensko"
 BA_romania.32.desc: "Vláda země [FROM.GetNameDef], která se necítí připravena na ozbrojený konflikt, přijala naše požadavky na územní ústupky na Slovensku. Její vojska se již stahují a naše správa připravuje ustavení spřáteleného režimu v oblasti."
 BA_romania.32.a: "Velké vítězství!"
 BA_romania.33.t: "[FROM.GetName] odmítá naše požadavky"
 BA_romania.33.desc: "Zdá se, že naše požadavky na předání kontroly nad Slovenskem vláda země [FROM.GetNameDef] nebere vážně. Její armáda však již začala připravovat obranná postavení."
 BA_romania.33.a: "To se ještě uvidí."
 BA_romania.34.t: "[FROM.GetName] požaduje, abychom se vzdali územních nároků"
 BA_romania.34.desc: "V rámci snahy země [FROM.GetNameDef] rozšířit svůj vliv na Balkáně se zdá, že její pozornost se nyní obrátila nejprve k nám. Desítky let napětí mezi Balkánským paktem a naší zemí vyústily v požadavek, abychom podepsali smlouvu, kterou se formálně vzdáme nároků na území ztracená ve prospěch země [FROM.GetNonIdeologyName] a dalších států během druhé balkánské války."
 BA_romania.34.a: "Možná už nastal čas..."
 BA_romania.34.b: "To jsou naše právoplatná území!"
 BA_romania.35.t: "[FROM.GetName] se vzdává územních nároků"
 BA_romania.35.desc: "Naši diplomaté nás informovali o příznivém vývoji. Země [FROM.GetNameDef] se prozíravě rozhodla podepsat se zemí [ROOT.GetNonIdeologyName] smlouvu, kterou se vzdává nároků na různá dříve ztracená území."
 BA_romania.35.a: "Dobré zprávy."
 BA_romania.36.t: "[FROM.GetName] nadále uplatňuje územní nároky"
 BA_romania.36.desc: "Po období, během něhož vláda země [FROM.GetNonIdeologyName] nereagovala na naše diplomaty, nám bylo oznámeno, že se země [FROM.GetNameDef] nerozumně rozhodla nepodepsat smlouvu, kterou jsme navrhli k ukončení jejích územních nároků. Nyní musíme rozhodnout, zda její postoj přijmeme, nebo se připravíme na razantnější odpověď."
 BA_romania.36.a: "Budiž."
 BA_romania.36.b: "Musíme zasáhnout."
 BA_romania.37.t: "[FROM.GetName] usiluje o rozšíření vzájemné ochrany"
 BA_romania.37.desc: "Dnes do města [ROOT.capital.GetCapitalVictoryPointName] dorazili diplomaté země [FROM.GetNameDef] se zajímavým návrhem: rozšířit dosavadní velmi omezenou spojeneckou smlouvu mezi našimi zeměmi na plnohodnotnou dohodu o vzájemné obraně.\n\nNěkteří naši představitelé návrh nadšeně vítají, jiní si však kladou otázku, zda země [FROM.GetNameDef] nemá nebezpečnější nepřátele než my a zda by taková dohoda neohrozila naše diplomatické úsilí vůči jejím historickým soupeřům."
 BA_romania.37.a: "To zní slibně."
 BA_romania.37.b: "Naše diplomatické úsilí směřuje jinam."
 BA_romania.38.t: "[FROM.GetName] souhlasí se spojenectvím"
 BA_romania.38.desc: "Z města [FROM.capital.GetCapitalVictoryPointName] jsme obdrželi zprávu, že země [FROM.GetNameDef] přijala náš návrh na vojenské spojenectví příznivě. Během několika dní se mají sejít naši ministři zahraničí, aby dohodu definitivně uzavřeli."
 BA_romania.38.a: "Společně jsme silnější."
 BA_romania.39.t: "[FROM.GetName] odmítá spojenectví"
 BA_romania.39.desc: "Představitelé země [FROM.GetNameDef] nás informovali, že nemají zájem rozšířit dosavadní spojenecké smlouvy, které mezi námi vznikly v rámci Malé dohody, v závaznější spojenectví. Možná se stále pošetile domnívají, že jim zachování určité neutrality zajistí větší bezpečí."
 BA_romania.39.a: "To je škoda."
 BA_romania_demand_referendum.1.t: "Železná garda požaduje referendum"
 BA_romania_demand_referendum.1.d: "Železná garda, jejíž politická i vojenská síla v poslední době rychle roste, nyní pochoduje ulicemi Bukurešti směrem k sídlu parlamentu. S postupujícím davem sílí skandování hesel požadujících zrušení monarchie a svržení současného režimu.\n\nK pochodu se připojují další a další lidé a volání po zásadní změně každou chvílí nabývá na síle. V čele průvodu kráčejí Corneliu Codreanu, Horia Sima a Octavian Goga, následováni polovojenským křídlem Železné gardy a tisíci civilistů.\n\nPo příchodu k parlamentu vstupuje tato trojice do budovy v doprovodu dvanácti ozbrojených mužů.\n\nO tři hodiny později se všichni tři vracejí a oznamují, že dosavadní režim jednostranně odstoupil. Současně se již šíří zprávy o útěku královské rodiny ze země.\n\nOctavian Goga následně prohlašuje, že se dočasně ujme funkce hlavy státu, dokud nebudou dokončeny potřebné postupy, aby Corneliu Codreanu a Horia Sima mohli společně vytvořit legionářský stát."
 BA_romania_demand_referendum.1.a: "Rumunské království je mrtvé, ať žije legionářský stát!"
 BA_romania_demand_referendum.2.t: "Odpůrci Železné gardy vyvolávají pouliční nepokoje"
 BA_romania_demand_referendum.2.d: "Jak se dalo očekávat, ostatním rumunským politickým stranám netrvalo dlouho, než sáhly po zbraních a uvrhly zemi do chaosu. Po referendu začali bojovněji naladění členové opozičních stran vyzývat své stoupence k ozbrojenému odporu proti uzurpátorům, kteří se tak bezostyšně zmocnili vlády vojenskou silou a pohrdli řádnými politickými a demokratickými postupy.\n\nDo zbraně nepovstaly pouze prodemokratické strany. Zdá se, že ze svých úkrytů vystupují i komunisté, kteří jsou připraveni bojovat o své místo v Rumunsku."
 BA_romania_demand_referendum.2.a: "Okamžitě proti nim vyšlete polovojenské oddíly!"
 BA_romania_demand_referendum.3.t: "Nepokoje odpůrců Železné gardy potlačeny"
 BA_romania_demand_referendum.3.d: "Trvalo to téměř dva týdny, ale poslední odpor proti nové vládě byl konečně zlomen a v zemi [ROM.GetNameDef] byl obnoven pořádek.\n\nRumunsko je po těchto nepokojích těžce raněné, rozhodně však ještě není poražené. Octavian Goga prohlásil, že dokud nebudou odstraněny škody způsobené těmito teroristy, nebude země [ROM.GetNameDef] v bezpečí.\n\nVyzývá proto každého Rumuna, který věří ve svou vlast a miluje ji, aby hlásil jakoukoli protirumunskou činnost."
 BA_romania_demand_referendum.3.a: "Konečně se můžeme pustit do práce."
 BA_romania_sideline_codreanu.1.t: "Corneliu Codreanu umírá při nehodě"
 BA_romania_sideline_codreanu.1.d: "Od chvíle, kdy Železná garda získala moc nad Rumunskem a odstranila nádor v podobě monarchie, uplynuly sotva dva měsíce. Triumvirát, který se tak odvážně zmocnil země a odvrátil ji od cesty vedoucí do chaosu, mezitím usilovně budoval základy prosperujícího a bezpečného Rumunska.\n\nZdá se však, že Smrtka měla jiné plány. Automobil, v němž trojice pravidelně cestovala do přebudované budovy parlamentu, byl dnes časně ráno nalezen převrácený u mostu, přes který často projížděla.\n\nUvnitř vozu byli nalezeni mrtví Corneliu Codreanu a řidič skupiny. Podle předběžného vyšetřování se řidič při těsném míjení protijedoucího automobilu prudce strhl doprava, čímž vůz sjel z mostu. Předpokládá se, že oba muži zemřeli při nárazu.\n\nNaštěstí pro zemi [ROM.GetNameDef] a Železnou gardu Horia Sima odjel dříve na schůzku s Octavianem Gogou, aby projednali předání moci nyní zesnulému vůdci gardy.\n\nPo veřejném pohřbu bylo oznámeno, že Horia Sima převezme odpovědnost za vedení Rumunska k prosperující budoucnosti."
 BA_romania_sideline_codreanu.1.a: "Není to všechno trochu... podezřelé?"
 BA_romania_codreanu_ascendant.1.t: "Codreanu se ujímá moci"
 BA_romania_codreanu_ascendant.1.d: "Od chvíle, kdy Železná garda převzala kontrolu nad vládou a odstranila staré instituce, které by do konce desetiletí přivedly Rumunsko do záhuby, uplynuly téměř dva měsíce. Po období rostoucí stability nyní Octavian Goga konečně oznámil, že se zakladatel Železné gardy Corneliu Codreanu ujme vedení Rumunska."
 BA_romania_codreanu_ascendant.1.a: "Za nové a slavné Rumunsko!"
 BA_romania_balkan_front.1.t: "[FROM.GetNameDefCap] obnovuje nároky na [764.GetName]"
 BA_romania_balkan_front.1.d: "Přestože se bukurešťská vláda krátce po skončení první světové války vzdala nároků na západní Banát, nový režim má zjevně jiné plány. Nyní znovu uplatňuje nároky na celý Banát, včetně státu [764.GetName], který se nachází uvnitř našich hranic.\n\nZda se skutečně pokusí tyto nároky prosadit, zůstává nejisté. Musíme se však připravit pro případ, že se rozhodne zmocnit území, která požaduje."
 BA_romania_balkan_front.1.a: "Jen ať ti bastardi přijdou."
 BA_romania_balkan_front.2.t: "[FROM.GetNameDefCap] obnovuje nároky na [154.GetName]"
 BA_romania_balkan_front.2.d: "Krátce po skončení první světové války postoupily armády země [FROM.GetNameDef] až k Budapešti, než jim mocnosti Dohody nařídily stáhnout se. Spojenci zároveň odvolali podporu veškerých rumunských územních nároků na [154.GetName].\n\nZdá se však, že nový režim v Bukurešti na tuto kapitolu dějin buď zapomněl, nebo se rozhodl znovu vznést nárok na [154.GetName]. Podle dostupných informací se navíc připravuje tento požadavek prosadit, nejspíše silou."
 BA_romania_balkan_front.2.a: "Jen ať ti bastardi přijdou."
 ROM_execute_the_nazi_leadership: "Nacistické vedení bude odsouzeno k smrti"
 BA_romania_the_impaler.1.t: "Nacistické vedení zajato"
 BA_romania_the_impaler.1.d: "Po několika měsících bojů po boku Němců i proti nim se našim silám konečně podařilo prolomit poslední obranné linie Berlína a nyní máme celé město pevně pod kontrolou.\n\nZdá se, že německá vláda nebyla na naše dobytí města připravena. Naše předsunuté jednotky dokázaly zajmout nacistické vedení právě ve chvíli, kdy se pokoušelo uprchnout z Berlína a pokračovat ve válce odjinud.\n\nNyní před námi stojí nová otázka: co s nimi uděláme?"
 BA_romania_the_impaler.1.a: "[SOV.GetNameDef] již bude vědět, co s nimi."
 BA_romania_the_impaler.1.b: "Budou odsouzeni k smrti!"
