l_polish:
 BA_romania_flavour.39.t: "Rumunsko žádá o záruky nezávislosti!" # todo: NEW TRANSLATION
 BA_romania_flavour.39.d: "Diplomaté z Bukurešti přijeli s naléhavou žádostí rumunské vlády. S odvoláním na stále nestabilnější geopolitickou situaci v Evropě a hrozící nebezpečí zahraniční agrese žádá Rumunsko o formální záruku své národní nezávislosti a územní celistvosti.\n\nPoskytnutí naší ochrany by je bezpochyby přiblížilo k naší sféře vlivu a zajistilo nám důležitého strategického partnera na Balkáně. Zároveň však hrozí, že naši zemi zatáhne do nežádoucího konfliktu, pokud nepřátelské mocnosti poruší jejich svrchovanost. Jak na jejich žádost odpovíme?" # todo: NEW TRANSLATION
 BA_romania_flavour.39.a: "Zaručíme jejich hranice." # todo: NEW TRANSLATION
 BA_romania_flavour.39.b: "Takový závazek nemůžeme přijmout." # todo: NEW TRANSLATION
 BA_romania_flavour.40.t: "Rumunské investice do pohraničí" # todo: NEW TRANSLATION
 BA_romania_flavour.40.d: "Rumunská vláda nás oficiálně oslovila s výhodným návrhem týkajícím se infrastruktury podél našich společných hranic. S vědomím náročného terénu a společného strategického významu této oblasti nám nabídla, že spojíme své technické zdroje a podělíme se o finanční náklady na rozsáhlý modernizační projekt.\n\nBěhem následujících šesti měsíců budou společné stavební čety usilovně rozšiřovat železnice, budovat nová zásobovací střediska a dláždit silnice. Tato bezprecedentní spolupráce výrazně urychlí místní rozvoj a sblíží naše dva národy." # todo: NEW TRANSLATION
 BA_romania_flavour.40.a: "Podnik prospěšný oběma stranám." # todo: NEW TRANSLATION
 BA_generic_response.1.t: "[FROM.GetNameDefCap] souhlasí!" # todo: NEW TRANSLATION
 BA_generic_response.1.d: "Od vlády [FROM.GetNameDef] jsme obdrželi oficiální zprávu. Formálně souhlasila s naším nedávným diplomatickým návrhem.\n\n[FROM.GetLeader] vyjádřil optimismus ohledně naší další spolupráce a prohlásil, že tato dohoda slouží společným strategickým zájmům obou našich zemí. Nezbytné dokumenty se již připravují." # todo: NEW TRANSLATION
 BA_generic_response.1.a: "Výborná zpráva." # todo: NEW TRANSLATION
 BA_generic_response.2.t: "[FROM.GetNameDefCap] odmítá!" # todo: NEW TRANSLATION
 BA_generic_response.2.d: "Naše diplomatická mise do [FROM.GetNameDef] skončila neúspěchem. Vláda vedená [FROM.GetLeader] náš návrh formálně odmítla.\n\nVe své oficiální odpovědi se odvolala na střet národních zájmů a rozdílné strategické priority. Je zřejmé, že v současnosti nesdílí naši vizi, a proto musíme hledat jiné cesty k dosažení svých cílů." # todo: NEW TRANSLATION
 BA_generic_response.2.a: "Zklamání." # todo: NEW TRANSLATION
 BA_romania_news.3.t: "Rumunsko zasáhlo ničivé zemětřesení!" # todo: NEW TRANSLATION
 BA_romania_news.3.d: "Rumunské království zasáhlo mohutné zemětřesení, jehož epicentrum se nacházelo hluboko v pohoří Vrancea. Silné otřesy byly cítit po celé východní Evropě, největší zkáza však postihla Bukurešť a okolní oblasti.\n\nHlavní město utrpělo rozsáhlé škody, zejména se zcela zřítil moderní činžovní dům Carlton, symbol meziválečné architektury, pod jehož troskami uvízly stovky lidí. Vojenské jednotky a záchranné složky horečně pátrají po přeživších, počet obětí však podle očekávání dosáhne tisíců. Tato přírodní katastrofa těžce poškodila rumunskou infrastrukturu v již tak napjaté a nestabilní době." # todo: NEW TRANSLATION
 BA_romania_news.3.a: "Strašlivá tragédie." # todo: NEW TRANSLATION
 BA_romania_news.2.t: "Král Michael byl donucen abdikovat!" # todo: NEW TRANSLATION
 BA_romania_news.2.d: "V dramatickém zvratu událostí v Bukurešti byl rumunský král Michael I. pod nesmírným nátlakem nově posílené komunistické vlády donucen podepsat abdikační listinu. \n\nMladý panovník neměl jinou možnost než odstoupit, aby zabránil krvavé občanské válce. V zemi totiž byly sovětské jednotky a komunistické milice obklíčily královský palác. Rumunská monarchie, která vedla národ během některých z nejzásadnějších okamžiků jeho dějin, byla zrušena, čímž se otevřela cesta k vyhlášení lidové republiky." # todo: NEW TRANSLATION
 BA_romania_news.2.a: "Konec jedné éry." # todo: NEW TRANSLATION
 BA_romania_news.1.t: "Legionářské povstání v Rumunsku rozdrceno!" # todo: NEW TRANSLATION
 BA_romania_news.1.d: "Zprávy z Bukurešti uvádějí, že rumunská armáda na rozkaz Iona Antonesca rozhodně potlačila násilné povstání fašistické Železné gardy. \n\nPovstání, které přineslo několik dní pouličních bojů a děsivého násilí v hlavním městě, skončilo, když armáda nasadila těžké dělostřelectvo k likvidaci barikád. Vedení Legie bylo svrženo a její členové pronásledováni. Antonescu tak upevnil svou nezpochybnitelnou kontrolu nad rumunským státem." # todo: NEW TRANSLATION
 BA_romania_news.1.a: "Krvavý konec křehké koalice" # todo: NEW TRANSLATION
 BA_romania_coalition.1.t: "Úplatky camarilly" # todo: NEW TRANSLATION
 BA_romania_coalition.1.d: "Vnitřní kruh krále Karla II., známý jako „camarilla“, si uvědomil vážnou hrozbu, kterou představuje naše nově vzniklá neoficiální koalice. Královi vyslanci se v zoufalé snaze rozbít naši jednotu obrátili na významné opoziční představitele s nabídkami lukrativních státních zakázek a ministerských postů.\n\nNěkteří pragmatikové tvrdí, že přijetí těchto peněz by nám mohlo pomoci financovat politický boj proti králi. Riskovali bychom tím však ztrátu morální převahy a odcizení našich hlavních demokratických stoupenců." # todo: NEW TRANSLATION
 BA_romania_coalition.1.a: "Tyrani si nás nekoupí!" # todo: NEW TRANSLATION
 BA_romania_coalition.1.b: "Vezměte ty peníze, ale použijte je proti němu." # todo: NEW TRANSLATION
 BA_romania_coalition.2.t: "Střet Maniuovy gardy" # todo: NEW TRANSLATION
 BA_romania_coalition.2.d: "Politické napětí v zemi se přeneslo do ulic. „Maniuova garda“, polovojenské křídlo Národní rolnické strany, se střetla s policií věrnou královskému režimu.\n\nIuliu Maniu sice veřejně vyzývá ke klidu a dodržování demokratických postupů, ale samotná přítomnost ozbrojených rolnických milicí pochodujících provinčními městy vysílá karlistickému režimu jasný vzkaz: lidem dochází trpělivost." # todo: NEW TRANSLATION
 BA_romania_coalition.2.a: "Nezbytná ukázka síly." # todo: NEW TRANSLATION
 BA_romania_coalition.3.t: "Liberální průmyslníci podporují koalici" # todo: NEW TRANSLATION
 BA_romania_coalition.3.d: "Díky úsilí Dinua Brătianua o reformu Národní liberální strany přislíbilo několik bohatých průmyslníků a majitelů továren naší koalici plnou podporu. Tyto magnáty frustruje bující korupce a protekcionářství Carolovy camarilly a návrat k opravdové demokracii považují za jedinou cestu ke stabilizaci hospodářství.\n\nJejich finanční podpora již umožnila rozšíření našeho civilního průmyslu, přinesla pracovní místa a dokázala veřejnosti, že naše koalice dokáže účinně vládnout." # todo: NEW TRANSLATION
 BA_romania_coalition.3.a: "Kapitál směřuje ke stabilitě." # todo: NEW TRANSLATION
 BA_romania_coalition.4.t: "Rolnický pochod na Bukurešť!" # todo: NEW TRANSLATION
 BA_romania_coalition.4.d: "Dnes došlo k přelomové události. Desítky tisíc rolníků z celé země, které mobilizovali Ion Mihalache a sjednocené agrární strany, pokojně pochodovaly do hlavního města.\n\nOděni v tradičních krojích a nesoucí transparenty požadující obnovení ústavních práv zcela zahltili královskou gardu, která jen stála a přihlížela. Tato mohutná ukázka lidové podpory nade vší pochybnost dokazuje, že národ stojí na straně demokratické koalice." # todo: NEW TRANSLATION
 BA_romania_coalition.4.a: "Vítězství demokracie!" # todo: NEW TRANSLATION
 BA_romania_coalition.5.t: "Poslední hrozba Karla II." # todo: NEW TRANSLATION
 BA_romania_coalition.5.d: "Král Karel II. si uvědomuje, že se blíží jeho pád, a proto svolal vůdce naší koalice do královského paláce. Během napjatého setkání pohrozil vyhlášením stanného práva a trvalým rozpuštěním všech politických organizací, pokud nepřestaneme usilovat o získání armády na svou stranu.\n\nJeho hrozby však znějí prázdně. Klíčoví důstojníci odmítají potlačit politickou opozici a králova moc stojí na tenkém ledě. Nastal čas prověřit, zda svá slova myslí vážně." # todo: NEW TRANSLATION
 BA_romania_coalition.5.a: "Před autokratem se neskloníme." # todo: NEW TRANSLATION
 BA_romania_coalition.6.t: "Camarilla prchá!" # todo: NEW TRANSLATION
 BA_romania_coalition.6.d: "Královská diktatura byla oficiálně svržena a Karlovi II. se rozplynula veškerá politická podpora. Bývalý král proto uprchl ze země. Uprostřed noci vyjel zvláštní královský vlak směrem k jugoslávským hranicím. Na palubě vezl zdiskreditovaného panovníka, jeho milenku Elenu Lupescu a několik blízkých spolupracovníků.\n\nOdjezd sice proběhl pokojně, ale podle zpráv byl vlak naložen cennými obrazy, cizí měnou a značnou částí královské pokladnice. Finanční ztráta je bolestivá, ale celému národu se ulevilo." # todo: NEW TRANSLATION
 BA_romania_coalition.6.a: "Ty úplatky jsme neměli brát..." # todo: NEW TRANSLATION
 BA_romania_coalition.6.b: "Dobře, že je ta verbež pryč!" # todo: NEW TRANSLATION
 BA_romania_coalition.7.t: "Odstranění karlistických důstojníků" # todo: NEW TRANSLATION
 BA_romania_coalition.7.d: "Když je demokratická vláda bezpečně u moci, zahájil generál Nicolae Rădescu rozsáhlou reorganizaci ozbrojených sil. Vysoce postavení důstojníci, kteří vděčí za své postavení politickému protekcionářství nebo bezvýhradné věrnosti bývalému králi, jsou nenápadně nuceni odejít do předčasného důchodu.\n\nNa jejich místa jsou povyšováni schopní velitelé, jejichž postup se řídí zásluhami. Tato čistka „staré roajalistické gardy“ výrazně zlepšila profesionalitu i morálku generálního štábu." # todo: NEW TRANSLATION
 BA_romania_coalition.7.a: "Armáda slouží národu, ne jedinému člověku." # todo: NEW TRANSLATION
 BA_romania_coalition.8.t: "Debata o ústavě" # todo: NEW TRANSLATION
 BA_romania_coalition.8.d: "Při tvorbě nové, skutečně demokratické ústavy se naplno projevily ideologické rozdíly uvnitř naší koalice. Národní liberální strana (PNL) prosazuje silný centralizovaný státní aparát, který dokáže řídit rychlou industrializaci a udržovat přísný pořádek.\n\nNaproti tomu Národní rolnická strana (PNT) usiluje o rozsáhlou decentralizaci, posílení místních obecních rad a zajištění významného politického vlivu agrární většině. Je třeba dosáhnout kompromisu, konečné znění se však přikloní k jedné z těchto zásad." # todo: NEW TRANSLATION
 BA_romania_coalition.8.a: "Naší hlavní prioritou musí být decentralizace!" # todo: NEW TRANSLATION
 BA_romania_coalition.8.b: "Centralizace zajišťuje efektivitu." # todo: NEW TRANSLATION
 BA_romania_coalition.9.t: "Shromáždění za volební právo žen" # todo: NEW TRANSLATION
 BA_romania_coalition.9.d: "Po přelomovém rozhodnutí rozšířit volební právo žen uspořádaly přední feministky, jako Alexandrina Cantacuzino, mohutná oslavná shromáždění ve všech velkých městech. \n\nToto demokratické vítězství povzbudilo dosud nevyužitou skupinu obyvatelstva. Tisíce žen se nejen zapojují do politického života, ale také se hlásí jako dobrovolnice pro pomocné práce v civilní obraně a průmyslu, čímž posilují celkovou odolnost našeho národa." # todo: NEW TRANSLATION
 BA_romania_coalition.9.a: "Historický krok vpřed." # todo: NEW TRANSLATION
 BA_romania_coalition.10.t: "Osud polovojenských skupin" # todo: NEW TRANSLATION
 BA_romania_coalition.10.d: "Dekret o rozpuštění všech politických polovojenských skupin byl úspěšně proveden. Maniuově gardě, zbytkům fašistů a dalším nepravidelným milicím bylo nařízeno složit zbraně a vrátit se do civilního života.\n\nDošlo sice k několika ojedinělým případům odporu, ale armáda skryté zbrojnice těchto skupin rychle zajistila. Tisíce pušek, původně určených k pouličním bojům, byly zabaveny a převedeny přímo do státních zásob." # todo: NEW TRANSLATION
 BA_romania_coalition.10.a: "Pořádek je plně obnoven." # todo: NEW TRANSLATION
 BA_romania_harvest_trade.1.t: "Rumunská obchodní nabídka" # todo: NEW TRANSLATION
 BA_romania_harvest_trade.1.d: "Rumunská vláda nás oslovila s výhodnou nabídkou. Je ochotna vyvážet značnou část své národní sklizně výměnou za naši hospodářskou či vojenskou podporu. To by výrazně posílilo naše zásobovací sítě." # todo: NEW TRANSLATION
 BA_romania_harvest_trade.1.a: "Přijmout dodávky" # todo: NEW TRANSLATION
 BA_romania_harvest_trade.1.b: "Jejich obilí nepotřebujeme" # todo: NEW TRANSLATION
 BA_romania_harvest_trade.2.t: "[FROM.GetNameDefCap] přijímá naši nabídku" # todo: NEW TRANSLATION
 BA_romania_harvest_trade.2.d: "Vláda [FROM.GetName] laskavě přijala náš vývoz zemědělských produktů. Vlaky už přejíždějí přes hranice a my na oplátku dostáváme dohodnuté protihodnoty. Vývoz našich potravinových zásob bude mít pochopitelně různý dopad na vnitřní stabilitu podle toho, kolik jsme si jich mohli skutečně dovolit postrádat." # todo: NEW TRANSLATION
 BA_romania_harvest_trade.2.a: "Výhodná směna" # todo: NEW TRANSLATION
 BA_romania_harvest_trade.3.t: "[FROM.GetNameDefCap] odmítá naši nabídku" # todo: NEW TRANSLATION
 BA_romania_harvest_trade.3.d: "Naše diplomatická mise selhala. Vláda [FROM.GetName] odmítla naše zemědělské dodávky s tím, že má nyní jiné priority. Naše obilí zůstane v sýpkách." # todo: NEW TRANSLATION
 BA_romania_harvest_trade.3.a: "Jejich škoda!" # todo: NEW TRANSLATION
 BA_romania_harvest.2.t: "Vynikající úroda!" # todo: NEW TRANSLATION
 BA_romania_harvest.2.d: "Počasí bylo v této sezóně k našemu zemědělství nesmírně příznivé a pečlivé plánování našich venkovských správců se bohatě vyplatilo. Naše státní sýpky přetékají nebývalými přebytky obilí.\n\nTento mimořádný výnos nejenže zajišťuje stabilitu našeho domácího hospodářství v dohledné době, ale zároveň nám poskytuje velmi výnosnou komoditu pro mezinárodní obchod. Venkovské obyvatelstvo prosperuje a nálada v zemi stoupá, zatímco vlaky naložené zemědělskými produkty odjíždějí na zahraniční trhy." # todo: NEW TRANSLATION
 BA_romania_harvest.2.a: "Bůh nám seslal déšť!" # todo: NEW TRANSLATION
 BA_romania_harvest.3.t: "Dobrá úroda" # todo: NEW TRANSLATION
 BA_romania_harvest.3.d: "Letošní sklizeň přinesla v celé zemi solidní a spolehlivé výsledky. Díky příznivému počasí a tvrdé práci rolníků jsou státní sýpky dostatečně zásobené.\n\nNejde sice o rekordní rok, ale tento přebytek poskytuje našemu hospodářství pohodlnou rezervu a zajišťuje plynulý provoz civilního průmyslu. Rolníci jsou spokojeni a máme dostatečnou nadprodukci, abychom mohli pokračovat v plnění obchodních dohod, aniž bychom přetěžovali domácí logistiku." # todo: NEW TRANSLATION
 BA_romania_harvest.3.a: "Vše běží, jak má." # todo: NEW TRANSLATION
 BA_romania_harvest.4.t: "Neúroda" # todo: NEW TRANSLATION
 BA_romania_harvest.4.d: "Nepříznivé počasí spolu s nečekanými logistickými problémy na venkově způsobilo, že letošní zemědělský výnos nedosáhl očekávané úrovně.\n\nCelková produkce zaostala za našimi hospodářskými odhady a přebytek je mnohem menší, než se předpokládalo. Abychom zachovali hospodářskou stabilitu a splnili důležité vývozní závazky, bude muset vláda zavést přísnější hospodářské příděly spotřebního zboží pro civilní obyvatelstvo. Je to nepříjemná finanční rána pro naše státní příjmy, musíme ji však pečlivě zvládnout." # todo: NEW TRANSLATION
 BA_romania_harvest.4.a: "Zvládneme to." # todo: NEW TRANSLATION
 BA_romania_harvest.5.t: "Sucho!" # todo: NEW TRANSLATION
 BA_romania_harvest.5.d: "Hlavní zemědělské oblasti postihl dlouhotrvající a ničivý nedostatek deště, který vážně poškodil letošní úrodu. Prudký pokles zemědělské produkce zcela zmařil očekávaný hospodářský přebytek a přinutil stát k výraznému zásahu na trhu.\n\nAbychom uchránili strategické státní rezervy a zajistili plynulé fungování průmyslových dodavatelských sítí, rychle se v celé zemi zavádějí přísná omezení civilní spotřeby a úsporná hospodářská opatření. Jde o vážnou logistickou a finanční překážku, kterou bude třeba překonat pečlivou správou." # todo: NEW TRANSLATION
 BA_romania_harvest.5.a: "Čeká nás těžké období..." # todo: NEW TRANSLATION
 BA_romania_flavour.13.t: "Operace Tidal Wave" # todo: NEW TRANSLATION
 BA_romania_flavour.13.d: "Nad Munténií potemněla obloha, nikoli však bouřkovými mraky, nýbrž hrozivými siluetami stovek těžkých bombardérů země [plosti_raid_actor_country.GetAdjective]. Letectvo země [plosti_raid_actor_country.GetNameDefCap] zahájilo odvážný úder, který míří přímo na černé srdce našeho válečného stroje: rozsáhlé ropné rafinerie v Ploješti.\n\nPo celé zemi kvílejí sirény a první bomby začínají trhat průmyslové závody, z nichž do vzduchu stoupají mohutná mračna hustého černého kouře. Letci země [plosti_raid_actor_country.GetAdjective] se drží nebezpečně nízko, aby se vyhnuli radarům, a mění oblohu v chaotické peklo. Naše protiletadlové baterie se chystají k odpovědi. Musíme vyslat do vzduchu všechny dostupné stíhačky IAR a Messerschmitt a zastavit tento ničivý nálet, než ochromí naši těžbu ropy!" # todo: NEW TRANSLATION
 BA_romania_flavour.13.a: "Vyslat stíhačky! Braňte vlast!" # todo: NEW TRANSLATION
 BA_romania_flavour.14.t: "B-24 donucen přistát" # todo: NEW TRANSLATION
 BA_romania_flavour.14.d: "Zuřivá letecká bitva nad ropnými poli nám přinesla nečekanou kořist. Uprostřed zkázy způsobené výbuchy protiletadlových granátů a prudkými vzdušnými souboji se našim střelcům a statečným stíhacím pilotům podařilo vážně poškodit jeden z „létajících pevností“ využívaných letectvem země [plosti_raid_actor_country_2.GetAdjective]. \n\nMohutný B-24 Liberator za sebou vlekl hustý kouř a rychle ztrácel výšku, až byl nucen nouzově a tvrdě přistát v kukuřičném poli těsně za městem. Zmatená posádka země [plosti_raid_actor_country_2.GetAdjective] byla zajata, ale co je důležitější, samotný letoun přežil téměř nepoškozený. Královské rumunské letectvo již zajistilo místo havárie. Naši inženýři se nemohou dočkat, až vrak rozeberou, namalují na jeho křídla Michaelův kříž a odhalí technická tajemství tohoto těžkého strategického bombardéru." # todo: NEW TRANSLATION
 BA_romania_flavour.14.a: "Prozkoumáme tuto pevnost a využijeme ji pro vlastní potřeby..." # todo: NEW TRANSLATION
 BA_romania_flavour.15.t: "Titulescu se vrací do vlasti" # todo: NEW TRANSLATION
 BA_romania_flavour.15.d: "Po pádu temné královské diktatury a stabilizaci politické situace se Nicolae Titulescu rozhodl vrátit ze svého dobrovolného exilu. Tento brilantní diplomat, dlouholetý zastánce kolektivní bezpečnosti a Malé dohody, přináší obrovskou prestiž a cenné kontakty v Paříži a Londýně.\n\nJeho samotný návrat do Bukurešti dává světu najevo, že Rumunsko opět stojí za mezinárodní spoluprací a právním státem." # todo: NEW TRANSLATION
 BA_romania_flavour.15.a: "Skutečný státník se vrací domů." # todo: NEW TRANSLATION
 BA_romania_flavour.16.t: "Smrt Iona Inculeta" # todo: NEW TRANSLATION
 BA_romania_flavour.16.d: "Do hlavního města dnes dorazila tragická zpráva. Ion Inculet, významný politik a klíčový architekt začlenění Besarábie do Velkého Rumunska, zemřel na rozsáhlý infarkt.\n\nLidé z jeho okolí tvrdí, že nedávná ztráta milovaného rodného kraje ve prospěch Sovětského svazu ho zcela zlomila. Stres a hluboký žal z toho, že se jeho celoživotní dílo rozpadá, nakonec jeho srdce nevydrželo." # todo: NEW TRANSLATION
 BA_romania_flavour.16.a: "Tragický konec vlastence." # todo: NEW TRANSLATION
 BA_romania_flavour.17.t: "Manifestace v [GetMonth] roku [GetYear]" # todo: NEW TRANSLATION
 BA_romania_flavour.17.d: "Napětí v Bukurešti dosáhlo bodu varu. Dnes zaplavily Palácové náměstí desetitisíce občanů podporujících monarchii a demokracii, aby vyjádřily podporu koruně v době našeho stále nepříjemnějšího spojenectví se Sověty.\n\nPůvodně pokojná demonstrace rychle přerostla v násilnosti, když se komunističtí provokatéři a odboráři podporovaní Sověty pokusili dav násilím rozehnat. Nákladní vozy s ozbrojenými provokatéry najížděly přímo do davu, což vyvolalo rozsáhlé potyčky a chaotické pouliční boje v centru hlavního města.\n\nV nastalém chaosu se rozzuřenému davu podařilo zadržet a přemoci několik významných komunistických provokatérů. Jedním z nich byl mladý, horlivý aktivista Nicolae Ceaușescu. Zarytí monarchisté ho vytáhli z vozidla a surově zbili, než se úřadům konečně podařilo zasáhnout. Pořádek byl nakonec obnoven, krev prolitá během dneška však jasně připomíná hluboké ideologické rozpory, které rozdělují naši společnost." # todo: NEW TRANSLATION
 BA_romania_flavour.17.a: "Snad pro nás stále existuje naděje..." # todo: NEW TRANSLATION
 BA_romania_flavour.18.t: "Královský skandál otřásá národem" # todo: NEW TRANSLATION
 BA_romania_flavour.18.d: "Okázalý životní styl krále Karla II. a jeho kontroverzní soukromý život opět přinesly koruně ostudu. Nezávislý tisk zveřejnil podrobnosti o široce medializovaném finančním skandálu, do něhož je zapojen králův vnitřní kruh i jeho milenka Elena Lupescu.\n\nVeřejné rozhořčení sílí, protože obyčejní lidé sotva vyjdou s penězi, zatímco se camarilla obohacuje. Politická opozice této příležitosti využívá k ostré kritice králova morálního charakteru a jeho způsobilosti vládnout." # todo: NEW TRANSLATION
 BA_romania_flavour.18.a: "Jeho Veličenstvo by mělo být opatrnější..." # todo: NEW TRANSLATION
 BA_romania_flavour.19.t: "Obnova národa" # todo: NEW TRANSLATION
 BA_romania_flavour.19.d: "Válka se konečně obrátila v náš prospěch a naše hranice jsou bezpečné. Vláda proto zahájila rozsáhlou obnovu. Znovu se stavějí mosty, opravují železnice a továrny se přizpůsobují mírovému rozvoji.\n\nJizvy konfliktu zůstanou po generace, ale zemí se šíří nová vlna optimismu, zatímco vracející se vojáci berou do rukou nástroje a obnovují svou vlast." # todo: NEW TRANSLATION
 BA_romania_flavour.19.a: "Budujeme lepší zítřky." # todo: NEW TRANSLATION
 BA_romania_flavour.20.t: "Nadvláda nad Černým mořem" # todo: NEW TRANSLATION
 BA_romania_flavour.20.d: "Díky nedávným strategickým vítězstvím a neustálému rozšiřování námořní infrastruktury se Rumunsko fakticky proměnilo v pána Černého moře. \n\nNaše loďstvo nyní hlídkuje ve vodách bez odporu a promítá svou moc od Constanțy až po břehy Krymu. Tato nezpochybnitelná námořní převaha zajišťuje naše obchodní trasy a zaručuje, že naše pobřeží už nikdy neohrozí nepřátelská síla." # todo: NEW TRANSLATION
 BA_romania_flavour.20.a: "Naše moře!" # todo: NEW TRANSLATION
 BA_romania_legionary_rebellion.1.t: "Legionáři se bouří!" # todo: NEW TRANSLATION
 BA_romania_legionary_rebellion.1.d: "Křehké spojenectví mezi Conducătorem Ionem Antonescem a Železnou gardou se konečně rozpadlo. Ozbrojené polovojenské jednotky věrné Horiovi Simovi vyšly do ulic Bukurešti, kde stavějí barikády a rozpoutávají násilné pogromy. \n\nAntonescu, který získal tichý souhlas německého vrchního velení s obnovením pořádku, nařídil armádě zasáhnout. Po několika dnech krvavých pouličních bojů, v nichž se uplatnilo dělostřelectvo i tanky, armáda povstání rozdrtila. Vedení Legie bylo buď zatčeno, nebo uprchlo do exilu." # todo: NEW TRANSLATION
 BA_romania_legionary_rebellion.1.a: "Pořádek je obnoven. Stát patří nám!" # todo: NEW TRANSLATION
 BA_romania_flavour.12.t: "Železná garda vraždí politické vězně v Jilavě!" # todo: NEW TRANSLATION
 BA_romania_flavour.12.a: "Temná noc pro Rumunsko..." # todo: NEW TRANSLATION
 BA_romania_flavour.12.d.both: "Křehké spojenectví se Železnou gardou dospělo ke krvavému zlomu. V noci vtrhly do věznice Jilava odpadlické popravčí čety Železné gardy a bez soudu popravily přes šedesát politických vězňů. Mezi oběťmi byli bývalý generál Gheorghe Argeseanu a šéf rozvědky SSI Mihail Moruzov, zavraždění jako „odplata“ za smrt zakladatele gardy Cornelia Zelei Codreana.\n\nKrvavé násilí za zdmi věznice neskončilo. V následujících hodinách se teror rozšířil do ulic a významní intelektuálové, kteří otevřeně vystupovali proti gardě, byli uneseni ze svých domovů. Uznávaný historik Nicolae Iorga i brilantní ekonom Virgil Madgearu byli nalezeni mrtví v nedalekém lese. Tato děsivá vlna politických vražd národ hluboce otřásla." # todo: NEW TRANSLATION
 BA_romania_flavour.12.d.spared: "Křehké spojenectví se Železnou gardou dospělo ke krvavému zlomu. V noci vtrhly do věznice Jilava odpadlické popravčí čety Železné gardy a bez soudu popravily přes šedesát politických vězňů. Několik významných cílů se naštěstí masakru vyhnulo, protože se v zařízení nenacházeli.\n\nKrvavé násilí za zdmi věznice však neskončilo. V následujících hodinách se teror rozšířil do ulic a významní intelektuálové, kteří otevřeně vystupovali proti gardě, byli uneseni ze svých domovů. Uznávaný historik Nicolae Iorga i brilantní ekonom Virgil Madgearu byli nalezeni mrtví v nedalekém lese. Tato děsivá vlna politických vražd národ hluboce otřásla." # todo: NEW TRANSLATION
 BA_romania_flavour.21.t: "Královna matka se vrací" # todo: NEW TRANSLATION
 BA_romania_flavour.21.d: "Po dramatickém odchodu Carola II. se politická atmosféra v Bukurešti výrazně změnila. Vláda si uvědomila, že mladý král Michael potřebuje sjednocující a vysoce respektovanou osobnost, která by ho vedla, a oficiálně pozvala královnu matku Helenu, aby se po dlouhém exilu ve Florencii vrátila.\n\nPo příjezdu na nádraží ji přivítaly nadšené davy a její přítomnost okamžitě vnesla na královský dvůr důstojnost. Její známý soucit a pevný morální kompas budou národu v těchto nejistých časech nepochybně ukazovat cestu." # todo: NEW TRANSLATION
 BA_romania_flavour.21.a: "Triumfální návrat." # todo: NEW TRANSLATION
 BA_romania_flavour.22.t: "Bílý princ se vrací" # todo: NEW TRANSLATION
 BA_romania_flavour.22.d: "Barbu Stirbey, zkušený státník a někdejší nejbližší důvěrník zesnulé královny Marie, se konečně vrátil do popředí rumunské politiky. Po léta žil v politickém ústraní, kam ho zahnala jeho ostrá opozice vůči korupci a skandálům předchozího režimu.\n\nNyní, když jeho staří rivalové zmizeli ze scény, jsou státu opět k dispozici jeho jedinečné diplomatické kontakty v Londýně a Paříži i jeho bystrý politický úsudek. Jeho návrat svědčí o našem obnoveném odhodlání vést pragmatickou a uvážlivou diplomacii." # todo: NEW TRANSLATION
 BA_romania_flavour.22.a: "Jeho zkušenosti jsou k nezaplacení." # todo: NEW TRANSLATION
 BA_romania_flavour.23.t: "Podněstří" # todo: NEW TRANSLATION
 BA_romania_flavour.23.d: "Po úspěšném postupu našich ozbrojených sil za řeku Dněstr se pod rumunskou kontrolu dostala rozsáhlá nová území. Aby bylo možné tuto nově dobytou oblast, známou jako Podněstří, řádně spravovat, nařídil maršál Ion Antonescu zřízení oficiální civilní správy.\n\nVedením tohoto rozsáhlého správního úkolu maršál pověřil Gheorgheho Alexianua, důvěryhodného právního odborníka a zkušeného správce. Jeho přísná politika a neúprosná efektivita budou zásadní pro získávání zdrojů z tohoto regionu a udržování pořádku v týlu." # todo: NEW TRANSLATION
 BA_romania_flavour.23.a: "Je třeba nastolit pořádek." # todo: NEW TRANSLATION
 BA_romania_flavour.25.t: "Smrt patriarchy Mirona Cristey" # todo: NEW TRANSLATION
 BA_romania_flavour.25.d: "Národ truchlí. Patriarcha Miron Cristea, první patriarcha rumunské pravoslavné církve a ústřední postava nedávných politických dějin naší země, zemřel v Cannes, kde se léčil.\n\nJeho smrt zanechává v rumunském duchovním i politickém životě hlubokou prázdnotu. Svatý synod se brzy sejde, aby formálně potvrdil Nicodima Munteanua jako jeho nástupce. Musíme zajistit hladké předání úřadu, aby byla v těchto neklidných časech zachována stabilita církve i morálka věřících." # todo: NEW TRANSLATION
 BA_romania_flavour.25.a: "Kéž Bůh dopřeje jeho duši pokoj." # todo: NEW TRANSLATION
 BA_romania_flavour.26.t: "Vrancejské zemětřesení roku 1940" # todo: NEW TRANSLATION
 BA_romania_flavour.26.d: "Zasáhla nás katastrofa! Celou zemi prudce otřáslo mohutné zemětřesení o síle odhadované na více než 7,4 stupně. Jeho epicentrum se nacházelo hluboko v pohoří Vrancea, otřesy však zpustošily obce daleko za jeho hranicemi.\n\nV Bukurešti se zcela zřítil moderní železobetonový blok Carlton a pohřbil pod sebou stovky lidí. Záchranné služby jsou přetížené, telekomunikační spojení přerušeno a obyvatelstvo zachvátila panika. Musíme okamžitě zorganizovat pomoc a vyslat armádu, aby pomohla vyprostit přeživší." # todo: NEW TRANSLATION
 BA_romania_flavour.26.a: "Zorganizujte záchranné práce!" # todo: NEW TRANSLATION
 BA_romania_flavour.27.t: "Čistka mezi agrárníky" # todo: NEW TRANSLATION
 BA_romania_flavour.27.d: "Nad Bukureští nyní pevně vlaje rudá vlajka a nová správa neztrácela čas likvidací svých politických rivalů. Vůdci Národní rolnické strany, kteří se dlouho vydávali za zastánce venkovských mas, a přitom hájili zájmy buržoazie, byli rychle zneškodněni.\n\nVýznamné osobnosti, jako Iuliu Maniu a Ion Mihalache, byly zatčeny na základě obvinění z reakčního spiknutí a špionáže, zatímco jejich rozsáhlá politická síť na venkově je systematicky rozkládána. Cesta k opravdovému socialismu je konečně volná." # todo: NEW TRANSLATION
 BA_romania_flavour.27.a: "Revoluce nepřipouští odpor." # todo: NEW TRANSLATION
 BA_romania_flavour.28.t: "Palácový převrat uspěl!" # todo: NEW TRANSLATION
 BA_romania_flavour.28.d: "Včera v noci královská garda na základě rychle a nekrvavě provedeného plánu nové, loajalistické camarilly zajistila všechny východy z královského paláce. Král Carol II., odříznutý od svých zkorumpovaných patolízalů a pod nátlakem armády, dnes brzy ráno podepsal abdikaci.\n\nJeho syn, král Michael I., okamžitě složil přísahu. Na rozdíl od svého otce je mladý král obklopen pragmatickou autoritářskou radou, která je odhodlána rozdrtit fašistické agitátory i komunistické podvratné živly. V Rumunsku začíná nová éra přísné a nekompromisní monarchie." # todo: NEW TRANSLATION
 BA_romania_flavour.28.a: "Ať žije král!" # todo: NEW TRANSLATION
 BA_romania_flavour.29.t: "Bezpečnostní summit v Bukurešti" # todo: NEW TRANSLATION
 BA_romania_flavour.29.d: "Na pozvání rumunské koruny se v Bukurešti sešli delegáti z celé naší aliance. Naše vlády, ohromené rázným potíráním domácího extremismu v Rumunsku, podepsaly rozsáhlou smlouvu o vzájemné obraně a sdílení zpravodajských informací.\n\nNyní jsme spojeni společným cílem: vytvořit neprostupnou hráz proti radikálním ideologiím, které trhají Evropu na kusy." # todo: NEW TRANSLATION
 BA_romania_flavour.29.a: "Společně jsme silní." # todo: NEW TRANSLATION
 BA_romania_flavour.30.t: "Panovnické bludy" # todo: NEW TRANSLATION
 BA_romania_flavour.30.d: "S rostoucím politickým tlakem se král Carol II. chová čím dál nevyzpytatelněji. Uzavřen ve svém paláci a obklopen pouze nejbližšími, nejzkorumpovanějšími patolízaly, střídá záchvaty vzteku s ochromující nerozhodností. Armádě i tradičním elitám začíná být bolestně jasné, že král zcela ztratil kontakt s realitou." # todo: NEW TRANSLATION
 BA_romania_flavour.30.a: "Je nebezpečím pro stát." # todo: NEW TRANSLATION
 BA_romania_flavour.31.t: "Generál Radescu přebírá mimořádné pravomoci" # todo: NEW TRANSLATION
 BA_romania_flavour.31.d: "Ve zoufalé snaze obnovit pořádek a zachránit svou hroutící se moc jmenoval král Carol II. generála Nicolae Radescua předsedou vlády a svěřil mu rozsáhlé mimořádné pravomoci.\n\nRadescu je sice vysoce respektovanou vojenskou osobností, ale je to příliš málo a příliš pozdě. Důstojníci připravující převrat, kteří zůstávají králi věrní, v tom vidí jen zoufalou snahu panovníka skrýt se za prestiž armády." # todo: NEW TRANSLATION
 BA_romania_flavour.31.a: "Kostky jsou vrženy." # todo: NEW TRANSLATION
 BA_romania_flavour.32.t: "Abdikace krále Carola II." # todo: NEW TRANSLATION
 BA_romania_flavour.32.d: "Je konec. Král Carol II. čelil ultimátu vrchního velení armády a opuštěn vlastními strážemi podepsal abdikační listinu. Musí okamžitě opustit zemi.\n\nKoruna nyní přechází na jeho syna Michaela. Náš národ musí hledět do budoucnosti a napravit škody napáchané camarillou." # todo: NEW TRANSLATION
 BA_romania_flavour.32.a: "Ať žije král!" # todo: NEW TRANSLATION
 BA_romania_flavour.33.t: "Zřízení regentské rady" # todo: NEW TRANSLATION
 BA_romania_flavour.33.d: "Král Michael ještě nedosáhl věku, kdy by mohl vládnout samostatně. V souladu s ústavou je třeba zřídit regentskou radu, která bude až do jeho osmnáctých narozenin vykonávat královské pravomoci.\n\nRada se sice skládá z více členů, politického vedení se však musí ujmout jedna osobnost, aby byla zajištěna stabilita. Kdo povede regentskou radu?" # todo: NEW TRANSLATION
 BA_romania_flavour.33.a: "Královna matka Helena, aby vedla svého syna." # todo: NEW TRANSLATION
 BA_romania_flavour.33.b: "Patriarcha, aby zajistil morální autoritu." # todo: NEW TRANSLATION
 BA_romania_flavour.33.c: "Předseda nejvyššího soudu, aby hájil zákon." # todo: NEW TRANSLATION
 BA_romania_flavour.34.t: "[FROM.GetName] nás vylučuje z aliance!" # todo: NEW TRANSLATION
 BA_romania_flavour.34.d: "Po naší nedávné změně vlády dorazily z Bukurešti znepokojivé diplomatické zprávy. Rumunská vláda, která zastává nekompromisně protiextremistický postoj, prohlásila, že náš nový ideologický směr je zcela neslučitelný s jejím bezpečnostním paktem.\n\nS odvoláním na politickou čistotu své aliance a pokračující tažení proti radikalismu nám oficiálně odebrala členství, vyhostila naše vojenské přidělence a přerušila veškeré vazby v oblasti vzájemné obrany. Zůstali jsme sami." # todo: NEW TRANSLATION
 BA_romania_flavour.34.a: "Naše názory se lišily..." # todo: NEW TRANSLATION
 BA_romania_flavour.35.t: "Král Michael dosáhl plnoletosti" # todo: NEW TRANSLATION
 BA_romania_flavour.35.d: "Dnešek je významným dnem pro Rumunské království: Jeho Veličenstvo král Michael I. oslavil osmnácté narozeniny. Mladý král dosáhl plnoletosti a podle zákona je nyní plně způsobilý vykonávat své královské pravomoci, čímž fakticky končí ústavní potřeba regentské rady.\n\nPo celé zemi se konají oslavy, v Bukurešti probíhají velkolepé vojenské přehlídky a ve všech městech znějí kostelní zvony. Lidé s obnovenou nadějí vzhlížejí ke svému mladému, důstojnému panovníkovi a věří ve stabilní a prosperující budoucnost." # todo: NEW TRANSLATION
 BA_romania_flavour.35.a: "Všechno nejlepší, Vaše Veličenstvo!" # todo: NEW TRANSLATION
 BA_romania_flavour.36.t: "Protesty proti postupu na východ" # todo: NEW TRANSLATION
 BA_romania_flavour.36.d: "Po úspěšném znovudobytí Besarábie a severní Bukoviny překročily naše ozbrojené síly řeku Dněstr a postoupily hluboko do sovětského Podněstří.\n\nVelení armády to považuje za strategickou nutnost, avšak tradiční demokratičtí vůdci Iuliu Maniu a Dinu Bratianu zaslali vládě ostré veřejné memorandum. Tvrdí, že Rumunsko vedlo válku výhradně za osvobození svého národního území a že další postup do Ruska mění obrannou válku v nespravedlivou útočnou válku a zcela připoutává náš osud k mocnostem Osy." # todo: NEW TRANSLATION
 BA_romania_flavour.36.a: "O našem pochodu rozhoduje armáda!" # todo: NEW TRANSLATION
 BA_romania_flavour.37.t: "Reforma královské diktatury" # todo: NEW TRANSLATION
 BA_romania_flavour.37.d: "Nová ústava pevně zakotvila královskou diktaturu a král Carol II. musí jmenovat důvěryhodného poradce, který bude dohlížet na uskutečňování jeho vůle a řízení státních záležitostí.\n\nMá dvě významné možnosti: Ernesta Urdareanua, nelítostného a značně kontroverzního ministra královského dvora s obrovským vlivem na camarillu, nebo Grigoreho Gafencua, umírněnějšího státníka orientovaného na diplomacii, který by režimu mohl dodat tolik potřebný zdání legitimity." # todo: NEW TRANSLATION
 BA_romania_flavour.37.a: "Pověřit Ernesta Urdareanua správou královského dvora." # todo: NEW TRANSLATION
 BA_romania_flavour.37.b: "Pověřit Grigoreho Gafencua, aby režimu dodal legitimitu." # todo: NEW TRANSLATION
 BA_romania_flavour.38.t: "Konec „kapitána“" # todo: NEW TRANSLATION
 BA_romania_flavour.38.d: "S fanatickým a nebezpečným vůdcem Železné gardy Corneliem Zeleou Codreanem byl konečně zúčtováno.\n\nJeho extremistické hnutí po léta přinášelo do rumunských ulic teror, politické vraždy a nestabilitu. Včera v noci byli Codreanu a několik jeho nejbližších spolupracovníků zastřeleni při převozu do věznice Jilava pod silným četnickým dohledem. Oficiální státní prohlášení pouze uvádí, že se vězni „pokusili uprchnout do lesa“. Ať už jeho smrt provázely jakékoli okolnosti, vláda rozhodně zneškodnila závažnou hrozbu pro národní bezpečnost. Zatímco jeho zbývající radikální stoupenci zuří, stát dal jasně najevo, že fašistický terorismus vymýtí všemi nezbytnými prostředky." # todo: NEW TRANSLATION
 BA_romania_flavour.38.a: "Kdo s mečem zachází..." # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.1.t: "Královo počínání vyvolává pochybnosti!" # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.1.d: "Po sérii ponižujících politických a diplomatických přešlapů roste v celé zemi nespokojenost a důvěra veřejnosti i institucí v královskou diktaturu Carola II. se rychle hroutí. V ulicích se šeptá o odporu a radikální živly Železné gardy jsou čím dál smělejší, protože v monarchii cítí slabost.\n\nV zoufalé snaze obnovit pořádek a zachránit svou slábnoucí legitimitu navrhl královský dvůr pragmatické řešení: jmenovat předsedou vlády generála Iona Antonesca. Antonescu je respektovaná vojenská osobnost, do značné míry nezatížená tradičními stranickými vazbami, a nabízí tolik potřebnou pevnou ruku. Poradci doufají, že jmenování generála nejen uklidní nespokojené ozbrojené síly rozsáhlými vojenskými reformami, ale také dodá režimu autoritu potřebnou k zastrašení a zkrocení stále militantnějších fašistických frakcí.\n\nKrálova moc nad zemí slábne a nyní se musí obrátit na armádu, aby zachránila jeho korunu." # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.1.a: "Král potřebuje reformátora!" # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.2.t: "Zreformujte krále!" # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.2.d: "Riskantní pokus zachránit vládu Carola II. skončil naprostým fiaskem. Sotva měsíc po svém jmenování předsedou vlády generál Ion Antonescu zhodnotil politické trosky, které zanechala králova nevyzpytatelná a bezohledná vláda. „Železný generál“ si uvědomil, že koruna národ do propasti stahuje sama, místo aby chránila panovníka v nouzi.\n\nAntonescu pochopil, že monarchie další den Carolova špatného vládnutí nepřežije, a rozhodl se jednat. Předseda vlády předložil králi nekompromisní ultimátum a požadoval jeho okamžitou abdikaci, aby zachránil zemi před úplným vnitřním rozvratem. Carol, zahnaný do kouta vlastními politickými chybami a zbavený zbývajících spojenců, neměl na výběr a dekret podepsal. Odjíždí do exilu jako panovník, kterého zničila vlastní pýcha.\n\nNa trůn místo něj usedl jeho mladý syn Michael. Nový král sice přebírá korunu, éra královské diktatury však skončila. Skutečná moc nyní pevně spočívá v Antonescových rukou." # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.2.a: "Král je pryč, ať žije král!" # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.3.t: "Zelené košile vyšly do ulic" # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.3.d: "Politická krize dospěla k vrcholu. Desetitisíce legionářů, povzbuzené našimi nedávnými politickými kroky a rostoucí podporou veřejnosti, vyšly do ulic Bukurešti.\n\nPolovojenské jednotky v zelených košilích skandují nacionalistická hesla a požadují konec zkorumpované královské diktatury, čímž fakticky ochromily hlavní město. Policie i armáda, nakloněné nacionalistické věci, přihlížejí a odmítají davy rozehnat. Moc Carola II. se hroutí každou hodinou." # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.3.a: "Králova moc se hroutí." # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.4.t: "Palác je obklíčen" # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.4.d: "Královský palác je nyní zcela obklíčen legionářskými jednotkami a jejich stoupenci v armádě a král Carol II. zůstal zcela izolován. Jeho důvěryhodná camarilla se rozplynula a on teď musí sám čelit hněvu nacionalistické revoluce.\n\nGenerálové věrní naší věci vstoupili do paláce a předložili králi nekompromisní ultimátum: okamžitě abdikovat, aby zabránil krvavé občanské válce, nebo čelit následkům, které mu připraví dav venku." # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.4.a: "Jinou možnost nemá." # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.5.t: "Útěk camarilly" # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.5.d: "Pod rouškou tmy nastoupil sesazený král Carol II., doprovázený svou milenkou Elenou Lupescu a hrstkou zbývajících stoupenců, do zvláštního královského vlaku mířícího k jugoslávské hranici.\n\nNež uprchla, stačila královská družina naložit do vlaku ohromné množství státního majetku, včetně neocenitelných obrazů, zlata a cizí měny. Ztráta pro státní pokladnu je značná, ulice Bukurešti však propukají v jásot. Tyran uprchl!" # todo: NEW TRANSLATION
 BA_romania_fall_of_carol.5.a: "Dobře, že je pryč!" # todo: NEW TRANSLATION
 BA_romania_flavour.1.t: "Protikomunistické shromáždění!" # todo: NEW TRANSLATION
 BA_romania_flavour.1.d: "Od chvíle, kdy bylo rozhodnuto dát přednost Starému království, jsou venkovské obce čím dál rozladěnější z nedostatku podpory, které se jim dostává.\n\nPřibývá zpráv o aktivitách Železné gardy v těchto obcích i o stále častějších shromážděních, pořádaných na její popud a požadujících vyhnání komunismu a socialistické zvrhlosti z Rumunska.\n\nMnohé z těchto obcí jsou pouze nespokojené, Železná garda však jejich stížnostem dodává na váze. Máme tedy dvě možnosti: buď oslovit obce, v nichž garda nemá tak silné postavení, a pokusit se je od těchto názorů odvrátit, nebo přilévat olej do ohně, který Železná garda rozdmýchala." # todo: NEW TRANSLATION
 BA_romania_flavour.1.a: "Rumunské království je domovem všech Rumunů." # todo: NEW TRANSLATION
 BA_romania_flavour.1.b: "Vyženeme komunistickou hrozbu z Balkánu." # todo: NEW TRANSLATION
 BA_romania_flavour.2.t: "Požadavek na další financování" # todo: NEW TRANSLATION
 BA_romania_flavour.2.d: "Po příslibu dalšího financování Nového království se na nás regionální představitelé znovu obrátili s žádostí o další prostředky. Argumentují především tím, že oblasti, které dříve patřily Rakousko-Uhersku, nejsou tak rozvinuté jako Staré království, a mohly by proto potřebovat další investice, které by region posílily a pomohly mu dohnat zbytek Rumunska.\n\nZačali jsme sice překonávat rozdíly mezi Novým a Starým královstvím, místní představitelé nás však naléhavě žádají, abychom udělali víc. V těchto regionech se totiž stále častěji objevují členové Železné gardy, kteří zjevně podněcují nespokojenost se současnou vládou a monarchií." # todo: NEW TRANSLATION
 BA_romania_flavour.2.a: "Copak by král nemohl financovat další regionální programy?" # todo: NEW TRANSLATION
 BA_romania_flavour.2.b: "S tím by si mohly poradit odborové svazy." # todo: NEW TRANSLATION
 BA_romania_flavour.3.t: "Atentát na Armanda Calinescua" # todo: NEW TRANSLATION
 BA_romania_flavour.3.d: "Včera pozdě v noci se Armand Calinescu vracel se svým osobním strážcem do paláce Cotroceni, když jejich vůz vjel do léčky. Skupina atentátníků do automobilu narazila a vyřadila ho z provozu. Poté zastřelili jeho osobního strážce, který vystoupil, aby zjistil, co se stalo při údajné nehodě.\n\nAtentátníci pak obrátili pozornost na Calinescua, kterého našli zastřeleného na zadním sedadle automobilu. Utekli do nedaleké Rumunské rozhlasové společnosti, ale než mohli začít vysílat, ředitel stanice vysílání přerušil a přivolal místní bezpečnostní složky, které skupinu odzbrojily.\n\nKrátce nato dorazila policie a skupinu zatkla. Její členové se přiznali a nyní čekají na soud." # todo: NEW TRANSLATION
 BA_romania_flavour.3.a: "Železná garda se vymyká kontrole..." # todo: NEW TRANSLATION
 BA_romania_flavour.4.t: "Maršál Prezan se vrací do aktivní služby!" # todo: NEW TRANSLATION
 BA_romania_flavour.4.d: "Kontinentem znovu zní válečné bubny a rumunské vrchní velení naléhavě potřebuje zkušené vedení. Dnes morálku celého národa pozvedlo významné oznámení: maršál Constantin Prezan se oficiálně vrátil do aktivní služby.\n\nPrezan, veterán druhé balkánské války a jeden z nejbrilantnějších stratégů Velké války, sehrál zásadní roli při obraně Moldávie v nejtemnějších dnech let 1916 a 1917. Společně s generálem Alexandru Averescuem připravil obranná vítězství u Mărăști, Mărășești a Oituzu a zachránil rumunský stát před úplným zhroucením. Přestože odešel na odpočinek na své panství v Schinetei, hrozby na hranicích Rumunska přiměly starého hrdinu znovu obléci uniformu. Jeho pouhá přítomnost na bojišti mu mezi důstojníky zajišťuje nebývalou úctu. Je sice již v pokročilém věku, jeho strategický důvtip je však stále ostrý jako bajonet. Hrdina minulosti se vrátil, aby bránil národ před válečnými bouřemi!" # todo: NEW TRANSLATION
 BA_romania_flavour.4.a: "Vítejte zpět, maršále!" # todo: NEW TRANSLATION
 BA_romania_flavour.5.t: "Constantin Prezan utrpěl zdravotní příhodu!" # todo: NEW TRANSLATION
 BA_romania_flavour.5.d: "Vyčerpávající tempo vojenského velení si vybralo těžkou daň na našem nejváženějším veliteli. Během dnešní porady generálního štábu se maršál Constantin Prezan zhroutil v důsledku vážné srdečně-cévní příhody, což vyvolalo mezi vrchním velením paniku.\n\nNyní je ve stabilizovaném stavu, lékaři však vydali jasné varování: maršálovo tělo selhává a pokračování ve službě by se mu pravděpodobně stalo osudným. To rozpoutalo vášnivou debatu. Někteří tvrdí, že ponechat ve velení muže v tak pokročilém věku je příliš riskantní, jiní trvají na tom, že jeho strategický génius a schopnost posilovat morálku jsou nenahraditelné. O budoucnosti starého maršála musíme rozhodnout." # todo: NEW TRANSLATION
 BA_romania_flavour.5.a: "Bylo to o vlásek! Konec se ale zdá nevyhnutelný..." # todo: NEW TRANSLATION
 BA_romania_flavour.5.b: "Takovou mysl si nemůžeme dovolit ztratit!" # todo: NEW TRANSLATION
 BA_romania_flavour.6.t: "Constantin Prezan zemřel!" # todo: NEW TRANSLATION
 BA_romania_flavour.6.d: "Národ zahalilo hluboké ticho a vlajky klesly na půl žerdi. Maršál Constantin Prezan, zachránce Moldávie a velikán Velké války, zemřel.\n\nPrezan zasvětil svůj život obraně Rumunska. Jeho pevná ruka a neochvějná odhodlanost během Velké války umožnily naší armádě udržet linii na řece Siretu proti drtivé přesile Centrálních mocností. Díky důstojnému a rozhodnému vedení si získal neochvějnou oddanost svých vojáků a stal se živoucím symbolem národní jednoty a vojenské zdatnosti.\n\nV Bukurešti se připravuje státní pohřeb s plnými vojenskými poctami. Jeho odkaz bude navždy zvěčněn v našich dějinách, jeho smrt však znamená, že stará garda odchází a v našem vedení po sobě zanechává obrovskou prázdnotu." # todo: NEW TRANSLATION
 BA_romania_flavour.6.a: "Kéž jeho duše odpočívá v pokoji..." # todo: NEW TRANSLATION
 BA_romania_flavour.7.t: "Slavnostní otevření nového Vítězného oblouku" # todo: NEW TRANSLATION
 BA_romania_flavour.7.d: "Dnešek přináší Bukurešti významnou událost: slavnostní otevření obnoveného Vítězného oblouku.\n\nPůvodní stavba, narychlo zhotovená ze dřeva a štuku v roce 1922 na počest vracejících se veteránů Velké války, začala chátrat. Stát si uvědomil, že Rumunské sjednocení a válečné oběti si zaslouží trvalý pomník, a proto zadal vybudování velkolepého nového oblouku z masivního mramoru.\n\nNový pomník hrdě stojí na Kiseleffově třídě a dnes jej slavnostně otevřel král Carol II. Za zvuků vojenských kapel a jásotu davů se Vítězný oblouk stal trvalým symbolem odolnosti a slávy Velkého Rumunska." # todo: NEW TRANSLATION
 BA_romania_flavour.7.a: "Velkolepý pomník sjednoceného národa!" # todo: NEW TRANSLATION
 BA_romania_flavour.8.t: "Otevření Národního muzea vesnice" # todo: NEW TRANSLATION
 BA_romania_flavour.8.d: "Aby zachoval autentickou duši rumunského rolnictva, otevřel král Carol II. v Bukurešti Národní muzeum vesnice.\n\nToto muzeum pod širým nebem, jehož koncepci navrhl sociolog Dimitrie Gusti, patří k prvním svého druhu na světě. Desítky rolnických usedlostí, dřevěných kostelů a dílen byly rozebrány napříč Velkým Rumunskem a pečlivě znovu postaveny na březích jezera Herăstrău.\n\nŽivý zahajovací ceremoniál oslavil naše bohaté lidové tradice. Ve světě, který se rychle industrializuje, slouží toto muzeum jako důležitá kotva našich venkovských kořenů a vzdává hold trvalým tradicím a řemeslnému umu obyčejných Rumunů." # todo: NEW TRANSLATION
 BA_romania_flavour.8.a: "Naše kořeny jsou naší silou." # todo: NEW TRANSLATION
 BA_romania_flavour.9.t: "Dokončení nových křídel královského paláce" # todo: NEW TRANSLATION
 BA_romania_flavour.9.d: "Po ničivém požáru v roce 1926 zahájil král Carol II. ambiciózní obnovu královského paláce na třídě Calea Victoriei. Dnes bylo konečně odstraněno lešení.\n\nNová křídla se pyšní monumentálním neoklasicistním průčelím, které odráží královu snahu dát najevo stabilitu a moderní autoritu. Rozšířený interiér je neméně velkolepý a nabízí přepychové přijímací sály i zesílené galerie pro uměleckou sbírku Koruny.\n\nDokončený palác nyní hrdě stojí v srdci Bukurešti a slouží jako působivý symbol trvalé moci monarchie." # todo: NEW TRANSLATION
 BA_romania_flavour.9.a: "Důstojné sídlo pro Korunu." # todo: NEW TRANSLATION
 BA_romania_flavour.10.t: "Otevření Národního parku krále Carola" # todo: NEW TRANSLATION
 BA_romania_flavour.10.d: "Bukurešť získala úchvatné nové zelené plíce. Po rozsáhlých veřejných pracích, při nichž byly odvodněny bažiny kolem jezera Herăstrău, se oficiálně otevírá Národní park krále Carola I.\n\nTato proměna je inženýrským zázrakem s rozlehlými, upravenými promenádami a regulovaným tokem řeky Colentina. Park se rozkládá na více než stu hektarech bujné zeleně a alejí lemovaných stromy a okamžitě se stal nejvyhledávanějším místem odpočinku v hlavním městě.\n\nTento velkolepý městský projekt zcela oživil severní Bukurešť a je obrovským triumfem moderního urbanistického plánování." # todo: NEW TRANSLATION
 BA_romania_flavour.10.a: "Triumf urbanistického plánování!" # todo: NEW TRANSLATION
 BA_romania_flavour.11.t: "Královna Marie zemřela!" # todo: NEW TRANSLATION
 BA_romania_flavour.11.d: "Velké Rumunsko zasáhla hluboká vlna zármutku. Její Veličenstvo královna Marie, milovaná „matka raněných“, zemřela na zámku Peleșor.\n\nMarie přijala svou novou vlast s nesrovnatelným zápalem. Během Velké války odvážně pečovala o vojáky nakažené cholerou na moldavské frontě a její pozdější diplomatické úsilí v Paříži zásadně přispělo k tomu, že Velké Rumunsko získalo mezinárodní uznání. \n\nPodle její poslední vůle bude její srdce uloženo v milované kapli Stella Maris v Balčiku. Zatímco vlaky zahalené do černé převážejí její ostatky, miliony plačících Rumunů lemují železniční tratě, aby své královně naposledy vzdaly hold." # todo: NEW TRANSLATION
 BA_romania_flavour.11.a: "Srdce Rumunska pláče..." # todo: NEW TRANSLATION
 BA_romania_new_kingdom.1.t: "Nové království žádá o pomoc" # todo: NEW TRANSLATION
 BA_romania_new_kingdom.1.d: "Po skončení Velké války se naše území výrazně rozrostlo, ale hospodářská a politická propast mezi tím, čemu se začalo říkat Staré království a Nové království, vyvolala v zemi jasný rozkol.\n\nZačlenění rozsáhlých území, která jsme získali, se neobešlo bez potíží a nyní Nové království žádá o další pomoc, aby se mohlo vyrovnat Starému království.\n\nNaše prostředky jsou však omezené a musíme se snažit uspokojit obě strany, chceme-li přečkat blížící se bouři." # todo: NEW TRANSLATION
 BA_romania_new_kingdom.1.a: "Samozřejmě, musíme pomoci všem v Rumunsku!" # todo: NEW TRANSLATION
 BA_romania_new_kingdom.1.b: "Staré království bohužel potřebuje pomoc více" # todo: NEW TRANSLATION
 BA_romania_general_election.1.t: "Výsledky všeobecných voleb" # todo: NEW TRANSLATION
 BA_romania_general_election.1.d: "Konečně dorazily výsledky všeobecných voleb. Zdá se, že současná vládnoucí strana, Partidul Național Liberal, získala ze všech kandidujících stran nejvíce hlasů. Dostala však mnohem méně hlasů, než očekávala, a nedokáže tak sestavit vládu sama. Navíc zcela odmítá vytvořit koalici s druhou nejúspěšnější stranou, Partidul Național Țărănesc, nebo dokonce se třetí nejpopulárnější stranou Totul pentru Țară, kterou vede Corneliu Codreanu.\n\nSituace uvrhla volby do patové situace a povídá se, že sám král Carol II. zasáhne a vynutí vznik koalice." # todo: NEW TRANSLATION
 BA_romania_general_election.1.a: "Na králův rozkaz najděte někoho, kdo sestaví vládu!" # todo: NEW TRANSLATION
 BA_romania_general_election.2.t: "Politické strany si stěžují na shromáždění Železné gardy" # todo: NEW TRANSLATION
 BA_romania_general_election.2.d: "Železná garda pořádá častá shromáždění, na nichž zdůrazňuje, co znamená být Rumunem a co je třeba učinit pro ochranu Rumunska před tím, co označuje za zvrhlé a hédonistické praktiky, jako je socialismus a komunismus.\n\nNení to poprvé, co musely zasáhnout úřady a jedno z jejich shromáždění rozehnat, ale s blížícími se volbami nás ostatní strany žádají, abychom proti nim zakročili ještě tvrději. Chtějí, abychom se pokusili rozehnat každé shromáždění, které uspořádají, a tvrdí, že jsou ve své podstatě protidemokratičtí a chtějí uvrhnout Rumunsko do diktatury vedené Codreanem.\n\nNa slovech ostatních vůdců je něco pravdy, ale Železná garda je legitimní strana, stejně jako oni." # todo: NEW TRANSLATION
 BA_romania_general_election.2.a: "Mohou pořádat shromáždění stejně jako všichni ostatní" # todo: NEW TRANSLATION
 BA_romania_general_election.2.b: "Musíme Železnou gardu zkrotit" # todo: NEW TRANSLATION
 BA_romania_general_election.3.t: "Železná garda zdůrazňuje hrozbu ze strany [SOV.GetNameDefCap]" # todo: NEW TRANSLATION
 BA_romania_general_election.3.d: "Před volbami vykreslil řečník zastupující Železnou gardu před tisíci posluchači [SOV.GetNameDef] jako medvěda, který čeká, aby svou kořist rozsápal, stejně jako každého, kdo se jí ocitne nablízku. Prohlásil, že je jen otázkou času, než [SOV.GetAdjective] armády překročí naši východní hranici a dorazí až do [ROM.capital.GetCapitalVictoryPointName].\n\nVětšina obyvatel chápe, že [SOV.GetNameDef] nám v současnosti nepředstavuje přímou hrozbu, přesto však přibývá těch, kteří volají po další militarizaci naší společné hranice se [SOV.GetAdjective]." # todo: NEW TRANSLATION
 BA_romania_general_election.3.a: "Hrozbu ze strany [SOV.GetAdjective] přehání" # todo: NEW TRANSLATION
 BA_romania_general_election.3.b: "Musíme se připravit na všechno, co na nás mohou seslat" # todo: NEW TRANSLATION
 BA_romania_general_election.4.t: "Možná koalice se rozpadá" # todo: NEW TRANSLATION
 BA_romania_general_election.4.d: "Zdá se, že současná politická situace v Evropě zvyšuje napětí mezi našimi politickými stranami. Šíří se zvěsti, že Partidul Național Liberal, která je momentálně na cestě k volebnímu vítězství, má potíže s přípravou základů koalice s ostatními stranami, pokud ji bude potřebovat. Zřejmě naprosto odmítá ustoupit nebo se s ostatními stranami dohodnout, což by mohlo vést ke vzniku koalice a společnému vedení země." # todo: NEW TRANSLATION
 BA_romania_general_election.4.a: "Myslí to vážně?" # todo: NEW TRANSLATION
 BA_romania_royal_dictatorship.1.t: "Vznik královy vlády" # todo: NEW TRANSLATION
 BA_romania_royal_dictatorship.1.d: "Po fiasku posledních všeobecných voleb vystoupil král Carol v celostátním rozhlase a oznámil, že parlament, jak jsme ho dosud znali, bude rozpuštěn a veškerá vládní moc bude svěřena jemu.\n\nAčkoli jde o krajní opatření, Carol zdůrazňuje, že je nezbytné, aby se Rumunsko v budoucnu vrátilo k řádné demokracii, a že jde pouze o dočasné řešení jinak trvalého problému." # todo: NEW TRANSLATION
 BA_romania_royal_dictatorship.1.a: "Doufejme, že nás povede správným směrem..." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.100.t: "[ROM.GetNameDefCap] chce vstoupit do frakce [GER.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.100.d: "Dnes časně ráno dorazil z [ROM.GetNameDef] vyslanec s žádostí. Chtějí vstoupit do frakce [GER.GetFactionName]. Vyslanec zdůraznil, že vztahy mezi [ROM.GetAdjective] a [GER.GetAdjective] se zlepšují a že vzhledem k proměnlivé situaci v Evropě nevidí žádného jiného logického spojence než nás. Připravili jsme plány, jak s [ROM.GetAdjective] naložit, ale jejich dobrovolná žádost může znamenat, že tyto plány už nebudou zapotřebí, nebo naopak pomůže urychlit jejich provedení." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.100.a: "Vítaný přírůstek" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.100.c: "Na Balkáně máme jiné plány" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.101.t: "[GER.GetNameDefCap] nás přijímá do frakce [GER.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.101.d: "Naštěstí se zdá, že [GER.GetAdjective] nemají nic proti tomu, abychom vstoupili do jejich aliance. Bez jejich podpory by bylo jen otázkou času, než by si [SOV.GetAdjective] přišli pro naše území a buď nás donutili postupně jim odevzdávat jeho části, nebo nás násilím přiměli ke kapitulaci.\n\nS [GER.GetAdjective] po boku můžeme našemu lidu zaručit, že stojíme na správné straně dějin a že jakékoli územní nároky či výboje [SOV.GetAdjective] zmaříme." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.101.a: "To jsou skvělé zprávy" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.102.t: "Německý čtyřletý plán" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.102.d.g: "Časně ráno dorazil z [GER.capital.GetCapitalVictoryPointName] německý představitel s malým doprovodem. Společně nám představili čtyřletý plán hospodářského rozvoje. Velkou část kapitálu potřebného k dalšímu rozšíření těžby ropy v muntenijských polích by poskytl [GER.GetNameDef], téměř každý barel ropy by však místo toho, aby zůstal v Rumunsku, putoval zpět do [GER.capital.GetCapitalVictoryPointName].\n\nTato nabídka je zjevným pokusem o hospodářské podrobení, takže máme tři skutečné možnosti. Můžeme doufat, že [GER.GetAdjective] přistoupí na protinávrh, který bude výhodnější pro obě strany. Můžeme plán úplně odmítnout a riskovat hospodářskou odvetu, nebo ho můžeme přijmout navzdory zjevným nevýhodám." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.102.a: "Navrhněme protinabídku" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.102.b: "V žádném případě! Co přijde příště? Vojenská integrace?" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.102.c: "V budoucnu se nám to může vyplatit..." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.103.t: "[GER.GetNameDefCap] odmítá naši žádost o vstup do frakce [GER.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.103.d: "Bohužel se zdá, že [GER.GetAdjective] nemají zájem přijmout nás do své aliance. Nevíme, zda to znamená, že uzavřeli dohodu se [SOV.GetAdjective], [HUN.GetAdjective] nebo [BUL.GetAdjective] a chystají se zabrat naše území. Musíme se však připravit na útok ze všech stran.\n\nNyní je důležitější než kdy jindy ujistit náš lid, že nevydáme ani píď země, aniž bychom prolili krev těch, kteří by se jí chtěli zmocnit." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.103.a: "Musíme se připravit" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.2.t: "[FROM.GetNameDefCap] přichází s alternativním čtyřletým plánem" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.2.d: "Poté, co jsme [ROM.GetNameDef] poskytli několik hodin na zvážení naší nabídky, se k nám jejich vyslanec vrátil s protinabídkou. I ta bude pro nás přínosná, ale pro ně představuje mnohem výhodnější dohodu než ta, kterou jsme navrhli.\n\nNamísto toho, aby nám přímo dodávali veškerou produkci ropných polí do [GER.capital.GetCapitalVictoryPointName], pomohou nám vybudovat modernější rafinerie a zároveň vstoupí do frakce [GER.GetFactionName]. Díky tomu bude ropa proudit k nám i našim spojencům." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.2.a: "Zajímavý návrh, můžeme s ním souhlasit" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.2.b: "Pak se nedohodneme" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.21.t: "[GER.GetNameDefCap] nás přijímá do frakce [GER.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.21.d: "Zdá se, že náš protinávrh Němci přijali dostatečně dobře a dovolí nám vstoupit do své aliance.\n\nS [GER.GetAdjective] po boku můžeme našemu lidu zaručit, že stojíme na správné straně dějin a že jakékoli územní nároky či výboje [SOV.GetAdjective] zmaříme." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.21.a: "Skvělé zprávy!" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.22.t: "[GER.GetNameDefCap] odmítá naši žádost o vstup do frakce [GER.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.22.d: "Bohužel se zdá, že [GER.GetAdjective] o náš protinávrh neměli zájem a raději by nás nejprve hospodářsky podrobili, než by nás přijali do své aliance. Jednu zásadní věc nám to však říká: musíme se připravit na možný útok ze všech stran.\n\nNyní je důležitější než kdy jindy ujistit náš lid, že nevydáme ani píď země, aniž bychom prolili krev těch, kteří by se jí chtěli zmocnit." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.22.a: "To nevěstí nic dobrého" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.3.t: "[FROM.GetNameDefCap] odmítá čtyřletý plán" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.3.d: "Náš vyslanec se dnes vrátil z [ROM.capital.GetCapitalVictoryPointName] a bohužel nepřináší příliš příznivé zprávy. [ROM.GetNameDefCap] zcela odmítlo byť jen jednat o našem navrhovaném plánu a místo toho našemu vyslanci popřálo šťastnou cestu zpět do [GER.capital.GetCapitalVictoryPointName].\n\nNaše reakce na tuto zprávu může další vztahy mezi našimi zeměmi značně zkomplikovat. Můžeme ji však také prostě ignorovat a pokračovat v dovozu jejich ropy jako dosud." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.3.a: "Dobrá, koneckonců je to jejich ropa" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.3.b: "Uvidíme, co zmůže trocha hospodářského nátlaku" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.31.t: "[GER.GetNameDefCap] respektuje naši svrchovanost" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.31.d: "Zdá se, že ačkoli jsou naše ropná pole klíčovou součástí budoucích válečných plánů [GER.GetAdjective] vrchního velení, respektovali naše právo jako svrchovaného státu jejich nabídku odmítnout." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.31.a: "To je... překvapivé." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.32.t: "[GER.GetNameDefCap] podniká hospodářskou odvetu" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.32.d: "Jak jsme očekávali, naše ropná pole jsou klíčovou součástí budoucích válečných plánů [GER.GetAdjective] vrchního velení. Kvůli našemu odmítnutí čtyřletého plánu nám nyní zdražili suroviny a naše zdroje odmítají nakupovat za cokoli jiného než za snížené ceny." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.32.a: "To se dalo čekat" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.4.t: "[FROM.GetNameDefCap] neochotně přijímá čtyřletý plán" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.4.d: "Vyslanec, kterého jsme poslali do [ROM.capital.GetCapitalVictoryPointName], se dnes ozval s naprosto skvělými zprávami: [ROM.GetNameDef] souhlasilo se čtyřletým plánem a jeho ropná pole se právě připravují na odeslání barelů ropy přímo do [GER.capital.GetCapitalVictoryPointName]." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.4.a: "Jistě překvapivé, ale vítané" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.41.t: "Hospodářské podrobení [GER.GetAdjective]" # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.41.d: "Jak stanovili [GER.GetAdjective] ve čtyřletém plánu, ropa těžená a rafinovaná v muntenijských polích nyní putuje do [GER.capital.GetCapitalVictoryPointName]. Za to jsme dostali určitou základní hospodářskou náhradu za něco, co bude v nadcházejících letech nepochybně pohánět válečnou mašinerii [GER.GetAdjective]." # todo: NEW TRANSLATION
 BA_romania_german_four_year_plan.41.a: "Ať to nakonec stojí za to..." # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.1.t: "Shromáždění Železné gardy poškodilo infrastrukturu" # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.1.d: "Po dalším shromáždění Železné gardy byly v okolí poškozeny části infrastruktury, ať už úmyslně, nebo náhodou. Železná garda každopádně představuje stále větší důvod k obavám. Pokud budeme muset po každém jejím shromáždění vynakládat prostředky na opravu všeho, co zničí, bude to nepochybně velmi nákladné." # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.1.a: "Rozežeňte je a co nejdříve to opravte" # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.2.t: "Shromáždění Železné gardy způsobilo požár továrny" # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.2.d: "Místní hasiči byli včera přivoláni k požáru, který vypukl po shromáždění místní pobočky Železné gardy v okolí. Zatím není jasné, zda Železná garda za požár odpovídá, její odpůrci však na toto hnutí rychle ukázali prstem." # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.2.a: "Vyrozumějte hasiče" # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.3.t: "Železná garda pod záminkou shromáždění přepadla zbrojovku" # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.3.d: "Po obzvlášť násilném shromáždění před jednou z našich zbrojovek vyšlo najevo, že shromáždění bylo pouhou zástěrkou. Malá skupina členů Železné gardy se mezitím vloupala do továrny. Zdá se, že se jim podařilo odnést jen několik pušek, při útěku z továrny však sabotovali některá její zařízení." # todo: NEW TRANSLATION
 BA_romania_combat_iron_guard.3.a: "Najděte a zatkněte účastníky tohoto přepadení" # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.1.t: "[FROM.GetNameDefCap] navrhuje výměnu území" # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.1.d: "Po našem společném vyhlášení války [SOV.GetNameDef] nyní [ROM.GetAdjective] okupují části západní Ukrajiny. Navrhli, že nám předají kontrolu nad Podněstřím, které zahrnuje Vinnycju, Baltskou-Tiraspol a Oděsu, výměnou za navrácení transylvánských území, jež připadla [HUN.GetNameDef].\n\nJak bychom měli odpovědět?" # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.1.a: "Ne, území si mohou vzít od [SOV.GetAdjective]" # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.1.b: "Hmm... osvědčili se" # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.2.t: "[FROM.GetNameDefCap] odmítá naši nabídku výměny" # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.2.d: "Po vstupu do války [GER.GetNameDef] proti [SOV.GetNameDef] jsme doufali, že územní zisky na východě využijeme k výměně za návrat Transylvánie.\n\nZdá se však, že [GER.GetAdjective] dávají přednost [HUN.GetAdjective]. Bylo nám řečeno, že pokud usilujeme o územní zisky, máme nyní na východě dostatek příležitostí." # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.2.a: "Pak potáhneme na východ..." # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.3.t: "[FROM.GetNameDefCap] se ptá, zda jsme ochotni vrátit Transylvánii" # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.3.d: "V překvapivém zvratu událostí se zdá, že se [ROM.GetAdjective] podařilo přimět [GER.GetAdjective], aby jejich jménem požádali o obnovení [ROM.GetAdjective] nadvlády nad Transylvánií.\n\n[GER.GetAdjective] také uvedli, že je zcela na nás, zda se rozhodneme vzdát území, které nám bylo přiděleno. O další řešení této situace nemají zájem." # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.3.a: "Ne, právoplatné maďarské území si ponecháme." # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.3.b: "Jestli to spor vyřeší, mohou ho dostat zpět." # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.31.t: "[FROM.GetNameDefCap] si ponechává kontrolu nad Transylvánií" # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.31.d: "Jak jsme očekávali, [HUN.GetNameDef] odmítlo naši žádost o obnovení naší nadvlády nad Transylvánií, a to i přes zprostředkování ze strany [GER.GetAdjective].\n\nTo, že jsme ji nezískali zpět dnes, však neznamená, že se situace neobrátí a my nedostaneme šanci získat naše území zpět." # todo: NEW TRANSLATION
 BA_romania_transylvanian_reclamation.31.a: "Nezbývá nám než čekat na vhodnou chvíli." # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.0.t: "[FROM.GetAdjective] jednají o míru se [SOV.GetAdjective]" # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.0.d: "Zjistili jsme, že [ROM.GetNameDef] zahájilo prostřednictvím neutrálních prostředníků jednání s [SOV.GetNameDef]. Nemáme sice žádné konkrétní informace o obsahu mírové smlouvy, ale odchod [ROM.GetAdjective] z války by vážně oslabil naše křídlo a hrozilo by, že [SOV.GetAdjective] zahájí protiútok." # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.0.a: "Velmi zajímavé, velmi zajímavé..." # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.1.t: "[FROM.GetNameDefCap] žádá o mírovou smlouvu" # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.1.d: "Po jejich nestoudném společném vyhlášení války proti nám se zdá, že [ROM.GetAdjective]ové nejsou ochotni zemřít za [GER.GetAdjective]y, když se karta začíná obracet proti nim.\n\nDiplomatickými zákulisními kanály nás oslovili se žádostí o mírovou smlouvu, která by znamenala odchod [ROM.GetAdjective]ů z [GER.GetFactionName] a jejich vstup do [SOV.GetFactionName].\n\nMohli bychom je získat na svou stranu a přimět je, aby se k nám připojili při postupu do srdce [GER.GetAdjective]ů, nebo je můžeme smést společně s [GER.GetAdjective]y." # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.1.a: "O jednu frontu méně, kterou musíme řešit" # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.1.b: "Vědí, jaké to bude mít následky" # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.2.t: "[FROM.GetNameDefCap] souhlasí s mírovou smlouvou" # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.2.d: "Naštěstí diplomaté v Moskvě souhlasili, že s námi podepíší příměří. Jednou z podmínek této smlouvy je však náš vstup do [SOV.GetFactionName] a zapojení do jejich války proti [GER.GetAdjective]ům. Za normálních okolností bychom se pokusili této části smlouvy vyhnout, ale [HUN.GetAdjective]ové v současnosti okupují právoplatná [ROM.GetAdjective] území, a tohle je naše nejlepší šance získat je zpět." # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.2.a: "Doufejme, že to byla správná volba" # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.3.t: "[FROM.GetNameDefCap] odmítá mírovou smlouvu" # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.3.d: "Bohužel [SOV.GetAdjective]ové odmítli naši žádost o mírovou smlouvu a místo toho prohlásili, že poneseme následky svého rozhodnutí přidat se k Němcům.\n\nTeď už nám nezbývá než se zakopat a doufat, že se nám nakonec podaří proti [SOV.GetAdjective]ům podniknout protiútok." # todo: NEW TRANSLATION
 BA_romania_turn_of_the_tide.3.a: "Tak budeme bojovat až do hořkého konce!" # todo: NEW TRANSLATION
 BA_romania_another_great_game.1.t: "[FROM.GetNameDefCap] nás oslovuje ohledně [SOV.GetNameDef]" # todo: NEW TRANSLATION
 BA_romania_another_great_game.1.d: "Po Pařížské mírové smlouvě oslovil naši delegaci vyslanec z [ROM.GetNameDef] a zdůraznil význam Moskevské smlouvy a zásadní roli, kterou sehráli při zkrácení války v Evropě. Nyní žádají, abychom uznali jejich podíl na porážce mocností Osy a nepovažovali je za poraženého spolubojovníka, nýbrž za vítězného spojence.\n\nVyslanec zdůrazňuje, že bez převratu, který dosadil na trůn krále Michala, by válka možná stále pokračovala, a že [ROM.GetAdjective]ý lid by neměl být trestán za činy předchozího režimu, když současný režim pomohl válku ukončit.\n\nOtázkou tedy je, uznáme [FROM.GetNameDef] za vítězného člena Spojenců, nebo za poraženého člena Osy?" # todo: NEW TRANSLATION
 BA_romania_another_great_game.1.a: "Prokázali, že jsou cennými členy Spojenců" # todo: NEW TRANSLATION
 BA_romania_another_great_game.1.b: "Přidali se k Němcům, teď ponesou následky" # todo: NEW TRANSLATION
 BA_romania_another_great_game.11.t: "[FROM.GetNameDefCap] uznává náš přínos" # todo: NEW TRANSLATION
 BA_romania_another_great_game.11.d: "Po jednání se západními Spojenci o budoucnosti našeho velkého národa se zdá, že uznávají, že náš podíl na ukončení války v Evropě byl dostatečně významný na to, aby přehlédli zločiny předchozí vlády, která nás přiměla podepsat Trojstrannou smlouvu a připojit se k Ose v její válce proti celému světu." # todo: NEW TRANSLATION
 BA_romania_another_great_game.11.a: "Skvělé zprávy!" # todo: NEW TRANSLATION
 BA_romania_another_great_game.12.t: "[FROM.GetNameDefCap] nás nadále považuje za poražený národ" # todo: NEW TRANSLATION
 BA_romania_another_great_game.12.d: "Po jednání se západními Spojenci se zdá, že nejsou ochotni přehlédnout činy naší předchozí vlády na východě. Navzdory našemu přínosu k ukončení války trvají na tom, že jsme jedním z poražených členů Osy." # todo: NEW TRANSLATION
 BA_romania_another_great_game.12.a: "To je... očekávatelné." # todo: NEW TRANSLATION
 BA_romania_another_great_game.2.t: "[FROM.GetNameDefCap] žádá o povolení vystoupit z [SOV.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania_another_great_game.2.d: "Před časem jsme přijali vyslance z [FROM.GetNameDef], který s námi chtěl jednat o členství [ROM.GetAdjective]ů v [SOV.GetFactionName], či spíše o jejich odchodu z této frakce.\n\nVyslanec uvedl, že ačkoli se připojili k Němcům v jejich válce proti nám, následný převrat a jejich podíl na ukončení války byly zásadní pro to, aby válka skončila právě tehdy, kdy skončila. Nyní se toho snaží využít k vyjednání odchodu z [SOV.GetFactionName], aby mohli napravit vztahy se západními Spojenci." # todo: NEW TRANSLATION
 BA_romania_another_great_game.2.a: "Prokázali se. Neměli bychom je trestat za to, co udělali Němci." # todo: NEW TRANSLATION
 BA_romania_another_great_game.2.b: "Změna strany nesmaže škody, které napáchali. Ne." # todo: NEW TRANSLATION
 BA_romania_another_great_game.21.t: "[FROM.GetAdjective]ové nám dovolují opustit [SOV.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania_another_great_game.21.d: "V překvapivém zvratu událostí [SOV.GetNameDef] souhlasili s naší žádostí o vystoupení z jejich frakce. Domácí politici očekávali, že [SOV.GetAdjective]ové budou chovat zášť a donutí nás zůstat v jejich přímé sféře vlivu. Zdá se však, že tomu tak není." # todo: NEW TRANSLATION
 BA_romania_another_great_game.21.a: "To je jistě překvapení, ale příjemné." # todo: NEW TRANSLATION
 BA_romania_another_great_game.22.t: "[FROM.GetNameDefCap] trvá na Moskevské smlouvě" # todo: NEW TRANSLATION
 BA_romania_another_great_game.22.d: "Ačkoli jsme doufali v zázrak a povolení opustit [SOV.GetFactionName], zdá se, že se zatím nechtějí vzdát svého vlivu nad naší zemí." # todo: NEW TRANSLATION
 BA_romania_another_great_game.22.a: "Bohužel, co jsme vlastně čekali" # todo: NEW TRANSLATION
 BA_romania_another_great_game.3.t: "[FROM.GetNameDefCap] navrhuje neutralitu nakloněnou [SOV.GetAdjective]ům" # todo: NEW TRANSLATION
 BA_romania_another_great_game.3.d: "Po našem rozhodnutí ponechat [FROM.GetNameDef] v naší sféře vlivu předložili nový návrh. Vystoupili by z [SOV.GetFactionName], ale zachovali by přísnou neutralitu a nepřipojili se k žádné alianci. Jejich návrh obsahuje také řadu ustanovení ve prospěch [SOV.GetAdjective]ů: vůči Západu by zůstali přísně neutrální, ale nadále by s námi udržovali příznivé obchodní vztahy a pořádali společná vojenská cvičení.\n\nVeškeré nákupy zahraničních zbraní by navíc probíhaly prostřednictvím nás, nikoli Západu." # todo: NEW TRANSLATION
 BA_romania_another_great_game.3.a: "Zní to výhodně, můžeme souhlasit." # todo: NEW TRANSLATION
 BA_romania_another_great_game.3.b: "Už jsme řekli ne." # todo: NEW TRANSLATION
 BA_romania_another_great_game.31.t: "[FROM.GetNameDefCap] souhlasí s neutralitou nakloněnou [SOV.GetAdjective]ům" # todo: NEW TRANSLATION
 BA_romania_another_great_game.31.d: "Zdá se, že náš návrh na neutralitu nakloněnou [SOV.GetAdjective]ům [SOV.GetAdjective]y zaujal a souhlasili s ním. Už nejsme přímým členem [SOV.GetFactionName] a můžeme volně navazovat zahraniční vztahy s ostatními zeměmi. Podle naší dohody však budeme muset veškeré budoucí nákupy zbraní uskutečňovat výhradně přes [SOV.GetNameDef]. To by nám nemělo příliš vadit, protože díky tomu můžeme sjednotit naši výzbroj s jejich a zajistit si dodavatele pro případ potřeby." # todo: NEW TRANSLATION
 BA_romania_another_great_game.31.a: "Skvělé zprávy!" # todo: NEW TRANSLATION
 BA_romania_another_great_game.32.t: "[FROM.GetNameDefCap] náš návrh odmítá" # todo: NEW TRANSLATION
 BA_romania_another_great_game.32.d: "Zdá se, že [SOV.GetNameDef] nejsou příliš spokojeni s našimi opakovanými návrhy na získání nezávislosti. Znovu zdůraznili, že jsme poraženým členem Osy a nemůžeme očekávat úplnou nezávislost jen proto, že se nám dařilo proti nepříteli, který nebyl připraven na naši zradu." # todo: NEW TRANSLATION
 BA_romania_another_great_game.32.a: "Jaká škoda..." # todo: NEW TRANSLATION
 BA_romania_another_great_game.5.t: "[FROM.GetNameDefCap] se ptá, zda bychom zasáhli v jejich prospěch" # todo: NEW TRANSLATION
 BA_romania_another_great_game.5.d: "Dnes nás oslovil vyslanec z [FROM.GetNameDef] s žádostí, která měla zatím zůstat utajena. Zdá se, že [SOV.GetNameDef] pevně trvají na tom, aby [FROM.GetNameDef] zůstal v jejich sféře vlivu. Navzdory návrhům na neutralitu nakloněnou [SOV.GetAdjective]ům [SOV.GetAdjective]ové trvají na zachování současného postavení [FROM.GetNameDef].\n\n[FROM.GetAdjective]ové nás nyní žádají, abychom v případě potřeby zasáhli v jejich prospěch a pomohli přerušit vazby mezi [SOV.GetNameDef] a [FROM.GetNameDef].\n\nNebyla to výslovně řečeno, ale pokud by došlo na nejhorší, očekávali by, že se k nim připojíme v doufejme krátké válce." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [FROM.GetName]
 BA_romania_another_great_game.5.a: "Za [SOV.GetAdjective]y jsme vděční, ale z dlouhodobého hlediska se jim nedá věřit." # todo: NEW TRANSLATION
 BA_romania_another_great_game.5.b: "Když [SOV.GetAdjective]ové řekli ne, kdo jsme my, abychom jejich rozhodnutí zpochybňovali?" # todo: NEW TRANSLATION
 BA_romania_another_great_game.51.t: "[FROM.GetNameDefCap] se za nás postaví" # todo: NEW TRANSLATION
 BA_romania_another_great_game.51.d: "Od našeho vyslance vyslaného do [FROM.GetNameDef] jsme obdrželi dobré zprávy. Západní Spojenci nás podpoří, až předstoupíme před [SOV.GetNameDef] s ultimátem požadujícím stažení všech [SOV.GetAdjective]ých poradců a vojenského personálu z Rumunska.\n\nNejsme si zcela jisti, jak [SOV.GetAdjective]ové zareagují, ale musíme být připraveni." # todo: NEW TRANSLATION
 BA_romania_another_great_game.51.a: "Výborně, teď znovu promluvme s Moskvou." # todo: NEW TRANSLATION
 BA_romania_another_great_game.52.t: "[FROM.GetNameDefCap] nepodpoří žádný z našich požadavků" # todo: NEW TRANSLATION
 BA_romania_another_great_game.52.d: "Zdá se, že západní Spojenci nejsou ochotni riskovat válku s [SOV.GetNameDef] kvůli naší nezávislosti, přestože nás považují za vítězného člena Spojeneckých sil v Evropě.\n\nAle koneckonců nechali Polsko napospas podrobení ze strany [SOV.GetNameDef]. Možná jsme od nich ani neměli nic očekávat." # todo: NEW TRANSLATION
 BA_romania_another_great_game.52.a: "Tak jsme v této situaci uvízli." # todo: NEW TRANSLATION
 BA_romania_another_great_game.6.t: "[FROM.GetNameDefCap] požaduje stažení veškerého [SOV.GetAdjective]ého personálu z Rumunska" # todo: NEW TRANSLATION
 BA_romania_another_great_game.6.d: "Zdá se, že [FROM.GetNameDef] navzdory našim opakovaným upozorněním, že jsou poraženým členem bývalé Osy a budou za to potrestáni, ještě neztratili naději na plnou nezávislost.\n\nZákulisními jednáními se jim zřejmě podařilo přesvědčit západní Spojence, aby jejich požadavek na nezávislost [FROM.GetAdjective]ů podpořili. Zdá se, že jsou připraveni kvůli tomu jít do války.\n\nJak bychom měli na jejich požadavek odpovědět?" # todo: NEW TRANSLATION
 BA_romania_another_great_game.6.a: "Zahájit další světovou válku kvůli Rumunsku? Ať odejdou." # todo: NEW TRANSLATION
 BA_romania_another_great_game.6.b: "Ne, ani v této věci se Západu nepodřídíme." # todo: NEW TRANSLATION
 BA_romania_another_great_game.61.t: "[FROM.GetNameDefCap] ustupuje" # todo: NEW TRANSLATION
 BA_romania_another_great_game.61.d: "Zdá se, že naše politické manévrování přineslo ovoce. [SOV.GetNameDef] oznámili úplné stažení veškerého [SOV.GetAdjective]ého personálu z našeho území. Vláda v Moskvě není spokojena s tím, jak jsme situaci vyřešili, ale nedali nám na vybranou. Konečně však můžeme svobodně rozhodovat o své budoucnosti a naším prvním krokem bude přiklonit se k západním Spojencům." # todo: NEW TRANSLATION
 BA_romania_another_great_game.61.a: "Ach, vítězství." # todo: NEW TRANSLATION
 BA_romania_another_great_game.62.t: "[FROM.GetNameDefCap] se proti nám mobilizuje" # todo: NEW TRANSLATION
 BA_romania_another_great_game.62.d: "Zdá se, že náš požadavek na stažení [SOV.GetAdjective]ých sil z Rumunska v Moskvě vůbec nepřijali dobře. Namísto stažení vojsk a personálu zřejmě ještě přitvrzují a naše zpravodajské informace naznačují, že [SOV.GetAdjective]á válečná mašinérie obrací svou pozornost k nám." # todo: NEW TRANSLATION
 BA_romania_another_great_game.62.a: "Věděli jsme, že tohle se může stát." # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.1.t: "[FROM.GetNameDefCap] navrhuje sjednocení s [BUL.GetNameDef]" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.1.d: "Před několika hodinami za námi přišel vyslanec z [FROM.GetNameDef] s návrhem, který měl posílit [SOV.GetFactionName] a zajistit, aby se naše pozice na Balkáně dala hůře vytlačit.\n\nKonkrétně navrhl sjednocení [FROM.GetNameDef] a [BUL.GetNameDef]. Podobný návrh už prý koloval i dříve, ovšem za jiných okolností a z jiných důvodů.\n\nNejsme si jisti, co si o tom pomyslí Západ, ale oni mají své sféry vlivu a my zase tu svou.\n\nCo tedy uděláme?" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.1.a: "Zní to jako zajímavý nápad. Zeptejme se [BUL.GetAdjective]ů." # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.1.b: "A proč bychom s tím měli souhlasit?" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.11.t: "[FROM.GetNameDefCap] přichází s návrhem na sjednocení [ROM.GetAdjective]ů a [BUL.GetAdjective]ů" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.11.d: "V překvapivém zvratu událostí nás [FROM.GetNameDef] oslovili s návrhem na sjednocení [ROM.GetAdjective]ů a [BUL.GetAdjective]ů, který byl před Velkou válkou předkládán u různých panovnických dvorů, ale neuspěl.\n\nLidé v [ROM.GetNameDef] mají o tuto myšlenku zřejmě velký zájem a zaslechli jsme, že o ní mluví i někteří naši politici, takže zájem není pouze jednostranný.\n\nPokud bychom však návrh přijali, [BUL.GetNameDef] by přestal existovat v podobě, jakou známe. Někteří jsou pro, jiní proti." # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.11.a: "Jestli si to lid přeje, proč bychom tomu měli bránit?" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.11.b: "Raději zůstaneme Bulhary." # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.111.t: "[FROM.GetNameDefCap] souhlasí se sjednocením!" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.111.d: "Dnes jsme se dozvěděli, že [SOV.GetNameDef] nejenže oslovili [BUL.GetNameDef], ale [BUL.GetAdjective]ové s návrhem na sjednocení souhlasili!\n\nPro oba naše národy je to historický okamžik. V minulosti jsme byli soupeři i spojenci, ale nyní jsme skutečně bratři.\n\nVláda v Bukurešti už začala dostávat informace od vlády v Sofii a přípravy na sjednocení jsou v plném proudu." # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.111.a: "Ať žije rumunsko-bulharská unie!" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.12.t: "[FROM.GetNameDefCap] blokuje návrh na sjednocení" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.12.d: "V nešťastném, byť očekávatelném zvratu událostí [SOV.GetNameDef] zablokovali navrhované sjednocení našich dvou národů. [SOV.GetAdjective]ové tvrdí, že je v nejlepším zájmu [SOV.GetFactionName], aby naše dva národy zůstaly nezávislé.\n\nPokud by v Bukurešti nebo Sofii vypukl chaos, zůstal by omezen na danou zemi, místo aby mohl současně destabilizovat oba národy.\n\nVěděli jsme, že šance na přijetí návrhu je malá, ale stálo za to ho předložit." # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.12.a: "Bohužel, dalo se to čekat." # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.112.t: "[FROM.GetNameDefCap] odmítá návrh na sjednocení" # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.112.d: "Zdá se, že [SOV.GetNameDef] náš návrh na sjednocení s [BUL.GetAdjective]y zajímal, ale ve skutečnosti nebyli sjednocení nakloněni tolik, jak jsme původně předpokládali.\n\nChápeme jejich důvody, proč sjednocení nepodpořit, ale neměli bychom kvůli tomu omezit budoucí spolupráci s [BUL.GetAdjective]ým státem." # todo: NEW TRANSLATION
 BA_romania_bulgaria_ssr.112.a: "To je nemilé." # todo: NEW TRANSLATION
 BA_romania.1.t: "[FROM.GetName] žádá o Moldavskou ASSR" # todo: NEW TRANSLATION
 BA_romania.1.d: "V roce 1924 sovětské úřady vytvořily v [834.GetName] Moldavskou ASSR, přestože v oblasti převažovalo ukrajinské obyvatelstvo. Tento krok, jehož cílem bylo očividně ospravedlnit nároky na [ROM.GetAdjective]ou Moldávii, nyní vedl [FROM.GetNameDef] k žádosti, abychom jim postoupili naši část území zvaného Moldavská ASSR a ukončili tak spory o něj." # todo: NEW TRANSLATION
 BA_romania.1.a: "Mohou ho dostat jako gesto dobré vůle" # todo: NEW TRANSLATION
 BA_romania.1.b: "Bylo by strategické si ho ponechat" # todo: NEW TRANSLATION
 BA_romania.2.t: "[FROM.GetName] postupuje Moldavskou ASSR" # todo: NEW TRANSLATION
 BA_romania.2.d: "Dnes k nám dorazily pozitivní zprávy od našich zástupců v [SOV.capital.GetCapitalVictoryPointName]: [FROM.GetNameDef] souhlasili s postoupením [834.GetName] a rozpuštěním provincie, která dříve tvořila Moldavskou ASSR." # todo: NEW TRANSLATION
 BA_romania.2.a: "Velké Rumunsko je ještě větší" # todo: NEW TRANSLATION
 BA_romania.3.t: "[FROM.GetName] odmítá postoupit Moldavskou ASSR" # todo: NEW TRANSLATION
 BA_romania.3.d: "Navzdory naší snaze o zlepšení vztahů s [FROM.GetNameDef] jsme po sdělení našeho požadavku na postoupení území, které dříve tvořilo Moldavskou ASSR, byli [FROM.GetAdjective]ými představiteli obratem informováni, že s tím nesouhlasí." # todo: NEW TRANSLATION
 BA_romania.3.a: "Musíme trvat na svém nároku!" # todo: NEW TRANSLATION
 BA_romania.3.b: "Nesmíme [FROM.GetName] rozhněvat" # todo: NEW TRANSLATION
 BA_romania.4.t: "[FROM.GetName] se dovolává našeho spojenectví" # todo: NEW TRANSLATION
 BA_romania.4.d: "[FROM.GetNameDef] se ocitli pod útokem [SOV.GetNameDef] a požádali nás, abychom se zapojili do konfliktu na jejich obranu. Podle polsko-rumunské spojenecké smlouvy z roku 1921 jsme slíbili, že jim v takovém případě pomůžeme, ale obrana proti [SOV.GetNameDef] může být mimořádně náročná." # todo: NEW TRANSLATION
 BA_romania.4.a: "Dodržíme svůj slib" # todo: NEW TRANSLATION
 BA_romania.4.b: "Ohrozilo by to naše vlastní přežití" # todo: NEW TRANSLATION
 BA_romania.5.t: "[FROM.GetName] nám přichází na pomoc" # todo: NEW TRANSLATION
 BA_romania.5.d: "Dnes jsme obdrželi zprávu, že [FROM.GetNameDef] dodrželi naše spojenectví a připojili se k našemu boji proti [SOV.GetNameDef]. Tato zpráva výrazně pozvedla morálku našich vojáků, kteří se těší na spolupráci s naším [FROM.GetAdjective]ým spojencem." # todo: NEW TRANSLATION
 BA_romania.5.a: "Společně k vítězství!" # todo: NEW TRANSLATION
 BA_romania.6.t: "[FROM.GetName] zrazuje polsko-rumunské spojenectví" # todo: NEW TRANSLATION
 BA_romania.6.d: "Naši zástupci v [FROM.GetNameDef] byli dnes nemile překvapeni, když byla naše žádost o pomoc proti [SOV.GetNameDef] okamžitě odmítnuta, přestože jsme se k tomu zavázali polsko-rumunskou spojeneckou smlouvou. Zdá se, že [FROM.GetAdjective]á vláda už dříve zvažovala možnost, že bychom se na spojenectví odvolali, a dospěla k závěru, že zapojení do války by bylo příliš riskantní." # todo: NEW TRANSLATION
 BA_romania.6.a: "Vyřídíme si to s nimi později" # todo: NEW TRANSLATION
 BA_romania.10.t: "[FROM.GetName] žádá pro své spojence o přístup k průlivům" # todo: NEW TRANSLATION
 BA_romania.10.d: "Když [FROM.GetNameDef] buduje na Balkáně alianci, zjistil, že pravidla pro plavbu mezi Černým a Středozemním mořem jsou velmi omezující. Požádal nás proto, abychom tato pravidla vůči němu a jeho spojencům vymáhali méně přísně." # todo: NEW TRANSLATION
 BA_romania.10.a: "Rozumná žádost" # todo: NEW TRANSLATION
 BA_romania.10.b: "Musíme dodržovat Montreuxskou úmluvu" # todo: NEW TRANSLATION
 BA_romania.11.t: "[FROM.GetName] povoluje průjezd úžinami" # todo: NEW TRANSLATION
 BA_romania.11.d: "Dnes jsme od [TUR.GetNonIdeologyName] obdrželi dobrou zprávu: zavázali se, že vůči nám a našim spojencům nebudou podmínky Montreuxské úmluvy vymáhat příliš přísně. To by nám mělo výrazně usnadnit logistiku." # todo: NEW TRANSLATION
 BA_romania.11.a: "Skvělá zpráva" # todo: NEW TRANSLATION
 BA_romania.12.t: "[FROM.GetName] odepírá přístup přes úžiny" # todo: NEW TRANSLATION
 BA_romania.12.d: "Naši diplomaté nám dnes oznámili, že [TUR.GetNameDef] bohužel odmítlo udělit nám a našim spojencům zvláštní práva k černomořským úžinám, které kontroluje." # todo: NEW TRANSLATION
 BA_romania.12.a: "Nemůžeme s tím nic dělat" # todo: NEW TRANSLATION
 BA_romania.12.b: "Musíme se zmocnit Bosporu" # todo: NEW TRANSLATION
 BA_romania.13.t: "NMS Delfinul připlouvá z [ITA.GetNonIdeologyName]" # todo: NEW TRANSLATION
 BA_romania.13.d: "Naše námořnictvo dnes oslavilo příjezd ponorky NMS Delfinul, jejíž stavba pod naším dohledem skončila v [ITA.GetNameDef] přibližně před týdnem. Jako první ponorka navržená pro naše námořnictvo a součást třídy Delfinul symbolizuje začátek našich plánů na modernizaci námořnictva." # todo: NEW TRANSLATION
 BA_romania.13.a: "Vyzkoušejme ji" # todo: NEW TRANSLATION
 BA_romania.14.t: "Vyvažování našich zahraničních vztahů" # todo: NEW TRANSLATION
 BA_romania.14.d: "Naše diplomatická politika se dlouhodobě soustředí na Francii a její tradiční spojence. S tím, jak se však mocenská rovnováha v Evropě začíná měnit, musíme se rozhodnout, zda se budeme držet dosavadního kurzu, najdeme si nové spojence, nebo se pokusíme zaujmout pragmatičtější přístup." # todo: NEW TRANSLATION
 BA_romania.14.a: "Když budeme hrát na obě strany..." # todo: NEW TRANSLATION
 BA_romania.15.t: "Spor o vedení strany" # todo: NEW TRANSLATION
 BA_romania.15.desc: "Nyní, když je naše moc nad [ROOT.GetNonIdeologyName] upevněna, nastal čas znovu zvážit, kdo má vést komunistickou stranu a zemi do budoucna. Ačkoli [ROOT.GetLeader] přivedl socialistická hnutí k moci, možná by jiná významná osobnost dokázala zajistit, aby u ní zůstala." # todo: NEW TRANSLATION
 BA_romania.15.a: "Práce [ROOT.GetLeader] musí pokračovat" # todo: NEW TRANSLATION
 BA_romania.15.b: "Gheorghiu-Dej má podporu našich reformátorů" # todo: NEW TRANSLATION
 BA_romania.15.c: "Patrascanu přišel s pragmatičtějším přístupem" # todo: NEW TRANSLATION
 BA_romania.16.t: "[FROM.GetName] navrhuje balkánskou unii" # todo: NEW TRANSLATION
 BA_romania.16.desc: "Nová [FROM.GetAdjective] vláda znovu oživila myšlenku balkánské unie. Jako jeden z jejích spojenců jsme mohli očekávat, že nás její diplomaté osloví a zeptají se, zda se k tomuto plánu připojíme." # todo: NEW TRANSLATION
 BA_romania.16.a: "To si lid přeje" # todo: NEW TRANSLATION
 BA_romania.16.b: "Je to jen forma expanzionismu" # todo: NEW TRANSLATION
 BA_romania.17.t: "[FROM.GetName] souhlasí s unií" # todo: NEW TRANSLATION
 BA_romania.17.desc: "Z [FROM.capital.GetCapitalVictoryPointName] jsme obdrželi dobrou zprávu: náš návrh na balkánskou integraci přijali kladně. Už se pracuje na vyřešení administrativního chaosu spojeného se sjednocením a v [FROM.GetNameDef] se začínají objevovat vlajky [ROOT.GetAdjective]." # todo: NEW TRANSLATION
 BA_romania.17.a: "Skvělá zpráva!" # todo: NEW TRANSLATION
 BA_romania.18.t: "[FROM.GetName] odmítá unii" # todo: NEW TRANSLATION
 BA_romania.18.desc: "Zdá se, že obyvatelstvo [FROM.GetAdjective], nebo přinejmenším tamní politici, náš návrh na vytvoření balkánské unie nepřijali. Nyní se musíme rozhodnout, jak postupovat dál. Možná si to ještě rozmyslí." # todo: NEW TRANSLATION
 BA_romania.19.t: "[FROM.GetName] navrhuje společný program opevňování" # todo: NEW TRANSLATION
 BA_romania.19.desc: "V rámci programů vojenské spolupráce, které [FROM.GetNonIdeologyName] v naší alianci zahájilo, navrhlo společně vybudovat opevňovací linii na vnějších hranicích naší frakce." # todo: NEW TRANSLATION
 BA_romania.19.a: "To se vyplatí" # todo: NEW TRANSLATION
 BA_romania.19.b: "Nemůžeme si dovolit tyto výdaje" # todo: NEW TRANSLATION
 BA_romania.20.t: "$ROM_fate_of_the_monarchy$" # todo: NEW TRANSLATION
 BA_romania.20.desc: "Král Carol, který byl nedávno odstaven od moci, pochopil, co ho čeká, a dnes jsme zjistili, že uprchl ze země. Jeho činy poškodily pověst monarchie, většina obyvatelstva však podporuje její zachování, aby [ROOT.GetAdjective] politice poskytla tolik potřebnou stabilitu. Musíme se proto rozhodnout, zda jeho syn, princ Michael, který se od otce odcizil už dávno před touto událostí, dokáže tuto roli zastat." # todo: NEW TRANSLATION
 BA_romania.20.desc.2: "Po zajetí krále Carola II. během našeho nečekaného postupu na [ROOT.capital.GetCapitalVictoryPointName] je jisté, že mu nedovolíme zaujmout postavení, které by mu mohlo umožnit návrat k moci. Otázkou však zůstává, co udělat s ostatními členy královské rodiny, zvláště s princem Michaelem, který se svému otci už léta odcizil a nesdílí jeho politické názory." # todo: NEW TRANSLATION
 BA_romania.20.a: "Omezíme královy pravomoci a ponecháme mu pouze reprezentativní úlohu" # todo: NEW TRANSLATION
 BA_romania.20.b: "Všechny je uvězníme" # todo: NEW TRANSLATION
 BA_romania.20.c: "Ponecháme Michaela jako reprezentativní postavu" # todo: NEW TRANSLATION
 BA_romania.20.d: "Král se bude účastnit politického života Rumunska" # todo: NEW TRANSLATION
 BA_romania.21.t: "[SOV.GetAdjective] vedení se distancuje od naší politiky" # todo: NEW TRANSLATION
 BA_romania.21.desc: "Naše nedávná politická rozhodnutí vyvolala nespokojenost u [SOV.GetAdjective] vedení, a tím pádem i u jeho loutek v [ROM.GetNameDef]. Nyní se musíme rozhodnout, zda na svém postoji ještě přitvrdíme a vydáme se nezávislejší cestou, nebo zda [SOV.GetNameDef] usmíříme." # todo: NEW TRANSLATION
 BA_romania.21.a: "Učiníme několik ústupků" # todo: NEW TRANSLATION
 BA_romania.21.b: "Věříme vlastnímu výkladu komunismu" # todo: NEW TRANSLATION
 BA_romania.22.t: "[SOV.GetName] kritizuje vedení komunistické strany [ROOT.GetAdjective]" # todo: NEW TRANSLATION
 BA_romania.22.desc: "Poté, co [SOV.GetNameDef] odsoudilo naše předchozí kroky, které [SOV.GetNameDef] vykládalo jako odporující [?SOV.country_leader.GetIdeologyGroup], nyní svou kritiku a skrytý nátlak vystupňovalo a přímo odsoudilo nedávné kroky vedení [ROOT.GetAdjective]." # todo: NEW TRANSLATION
 BA_romania.22.a: "Usmíříme je změnou ve vedení" # todo: NEW TRANSLATION
 BA_romania.22.b: "Už jsme se jejich vedením řídili dost dlouho" # todo: NEW TRANSLATION
 BA_romania.23.t: "[FROM.GetName] se vydává vlastní cestou" # todo: NEW TRANSLATION
 BA_romania.23.desc: "Navzdory našemu vlivu na několik významných politiků [FROM.GetAdjective] se začali ubírat cestou, která není v souladu s naší ideologií [?ROOT.country_leader.GetIdeologyGroup]. Můžeme to přehlédnout a pokračovat ve spolupráci, nebo to využít jako záminku k invazi a nastolení poslušnějšího vedení." # todo: NEW TRANSLATION
 BA_romania.23.a: "Je čas zasáhnout" # todo: NEW TRANSLATION
 BA_romania.23.b: "Máme naléhavější starosti" # todo: NEW TRANSLATION
 BA_romania.24.t: "[FROM.GetName] nás zve do frakce [FROM.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania.24.desc: "V rámci snahy o vytvoření regionální aliance, která navazuje na Balkánský pakt a Malou dohodu, nám [FROM.GetAdjective] diplomaté předložili návrh smlouvy, podle níž bychom se připojili k frakci [FROM.GetFactionName]. Jejím deklarovaným účelem je obrana před fašistickým vlivem a dalšími možnými imperialistickými mocnostmi, ale možná se za tím skrývá něco víc." # todo: NEW TRANSLATION
 BA_romania.24.a: "Členství by posílilo naši bezpečnost" # todo: NEW TRANSLATION
 BA_romania.25.t: "[FROM.GetName] vstupuje do frakce [ROOT.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania.25.desc: "Možná i díky přesvědčivým argumentům našich diplomatů souhlasilo [FROM.GetNameDef] se vstupem do frakce [ROOT.GetFactionName]. Následné dohody budou jistě výhodné pro obě strany." # todo: NEW TRANSLATION
 BA_romania.25.a: "Výtečně!" # todo: NEW TRANSLATION
 BA_romania.26.t: "[FROM.GetName] odmítá vstoupit do frakce [ROOT.GetFactionName]" # todo: NEW TRANSLATION
 BA_romania.26.desc: "Navzdory úsilí našich diplomatů odmítlo [FROM.GetNameDef] vstoupit do naší aliance. Možná nám ani našim spojencům nedůvěřují, nebo se domnívají, že se konfliktům snáze vyhnou sami." # todo: NEW TRANSLATION
 BA_romania.26.a: "Škoda" # todo: NEW TRANSLATION
 BA_romania.28.t.backup: "[FROM.GetName] navrhuje zásah" # todo: NEW TRANSLATION
 BA_romania.28.t: "[FROM.GetName] navrhuje zásah proti [ROM_ITA_conquest_target.GetName]" # todo: NEW TRANSLATION
 BA_romania.28.desc: "Navzdory potlačení nejkrajnějších prvků [FROM.GetAdjective] politiky vedly přetrvávající silné protikomunistické nálady v [FROM.GetNameDef] tamní vládu k zajímavému návrhu. Podle této dohody bychom společně napadli [ROM_ITA_conquest_target.GetNameDef]. Naše spolupráce by měla zajistit rychlé vítězství a odradit ostatní od zásahu." # todo: NEW TRANSLATION
 BA_romania.28.a: "Nepřítel mého nepřítele..." # todo: NEW TRANSLATION
 BA_romania.28.b: "Nepomůžeme jim rozšiřovat vliv" # todo: NEW TRANSLATION
 BA_romania.29.t: "Plán společné invaze přijat" # todo: NEW TRANSLATION
 BA_romania.29.desc: "Naši diplomaté nám dnes oznámili, že [FROM.GetNameDef] náš návrh na společnou invazi do [ROM_ITA_conquest_target.GetNameDef] příjemně překvapil, protože tuto zemi už pečlivě sledovali jako možnou hrozbu." # todo: NEW TRANSLATION
 BA_romania.29.a: "Musíme se připravit na válku" # todo: NEW TRANSLATION
 BA_romania.30.t: "[FROM.GetName] odmítá společnou invazi" # todo: NEW TRANSLATION
 BA_romania.30.desc: "Diplomaté [FROM.GetAdjective] nám dnes oznámili, že ačkoli pozorně sledují vývoj v [ROM_ITA_conquest_target.GetNameDef], tamní [FROM.GetAdjective] obyvatelstvo ani vláda nepovažují případnou hrozbu za dostatečnou záminku k tak drastickému kroku, jako je invaze." # todo: NEW TRANSLATION
 BA_romania.30.a: "Invaze musí pokračovat" # todo: NEW TRANSLATION
 BA_romania.30.b: "Je to příliš riskantní" # todo: NEW TRANSLATION
 BA_romania.31.t: "[FROM.GetName] požaduje svrchovanost nad Slovenskem" # todo: NEW TRANSLATION
 BA_romania.31.desc: "Po pádu demokracie v [FROM.GetNameDef] se jeho diplomatická orientace zjevně přesunula k jiným autoritářským a militaristickým režimům. Dnes se to projevilo obzvlášť jasně, když nám zástupci [FROM.GetAdjective] vlády předložili požadavek, abychom jim odstoupili území na Slovensku." # todo: NEW TRANSLATION
 BA_romania.31.a: "Nejsme připraveni na válku" # todo: NEW TRANSLATION
 BA_romania.31.b: "Jen ať to zkusí!" # todo: NEW TRANSLATION
 BA_romania.32.t: "[FROM.GetName] odstupuje Slovensko" # todo: NEW TRANSLATION
 BA_romania.32.desc: "[FROM.GetNameDef] se necítí připraveno na konflikt, a proto přijalo naše požadavky na územní ústupky na Slovensku. Jejich vojska se nyní stahují a naše správa pracuje na vytvoření spřáteleného režimu v tomto regionu." # todo: NEW TRANSLATION
 BA_romania.32.a: "Velké vítězství!" # todo: NEW TRANSLATION
 BA_romania.33.t: "[FROM.GetName] odmítá naše požadavky" # todo: NEW TRANSLATION
 BA_romania.33.desc: "Zdá se, že naše požadavky, aby nám [FROM.GetNameDef] přenechalo kontrolu nad Slovenskem, nebere vážně. Jeho armáda se místo toho připravuje na obranu." # todo: NEW TRANSLATION
 BA_romania.33.a: "Ještě uvidíme" # todo: NEW TRANSLATION
 BA_romania.34.t: "[FROM.GetName] požaduje, abychom se vzdali svých nároků" # todo: NEW TRANSLATION
 BA_romania.34.desc: "V rámci snahy [FROM.GetAdjective] rozšířit svůj vliv na Balkáně obrátilo svou pozornost nejprve na nás. Desetiletí napětí mezi Balkánským paktem a naší zemí nyní vyústila v požadavek, abychom podepsali smlouvu, v níž se formálně vzdáme nároků na území, o která jsme přišli ve prospěch [FROM.GetNonIdeologyName] a dalších během druhé balkánské války." # todo: NEW TRANSLATION
 BA_romania.34.a: "Možná nastal čas..." # todo: NEW TRANSLATION
 BA_romania.34.b: "Toto území nám právem náleží!" # todo: NEW TRANSLATION
 BA_romania.35.t: "[FROM.GetName] se vzdává územních nároků" # todo: NEW TRANSLATION
 BA_romania.35.desc: "Naši diplomaté nám oznámili pozitivní zprávu: [FROM.GetNameDef] se moudře rozhodlo smlouvou s [ROOT.GetNonIdeologyName] vzdát nároků na různá ztracená území." # todo: NEW TRANSLATION
 BA_romania.35.a: "Dobrá zpráva" # todo: NEW TRANSLATION
 BA_romania.36.t: "[FROM.GetName] trvá na svých územních nárocích" # todo: NEW TRANSLATION
 BA_romania.36.desc: "Naši diplomaté v [FROM.GetNonIdeologyName] se odmlčeli a poté jim bylo oznámeno, že se [FROM.GetNameDef] nemoudře rozhodlo nepodepsat námi navrženou smlouvu, která měla ukončit jeho územní nároky. Nyní se musíme rozhodnout, zda toto rozhodnutí přijmeme, nebo se připravíme na ráznější odpověď." # todo: NEW TRANSLATION
 BA_romania.36.a: "Nuže tedy" # todo: NEW TRANSLATION
 BA_romania.36.b: "Musíme zasáhnout" # todo: NEW TRANSLATION
 BA_romania.37.t: "[FROM.GetName] usiluje o rozšíření ochrany" # todo: NEW TRANSLATION
 BA_romania.37.desc: "Diplomaté z [FROM.GetNameDef] dnes dorazili do [ROOT.capital.GetCapitalVictoryPointName] se zajímavým návrhem: chtějí dosud velmi omezenou spojeneckou smlouvu mezi našimi zeměmi rozšířit na formální dohodu o vzájemné obraně. Někteří naši vůdci jsou návrhem nadšeni, jiní se však obávají, že [FROM.GetNameDef] má možná nebezpečnější nepřátele než my a že by to mohlo ohrozit naše diplomatické snahy ve vztahu k historickým rivalům [FROM.GetNonIdeologyName]." # todo: NEW TRANSLATION
 BA_romania.37.a: "To zní slibně" # todo: NEW TRANSLATION
 BA_romania.37.b: "Naše diplomatické úsilí se soustředí jinam" # todo: NEW TRANSLATION
 BA_romania.38.t: "[FROM.GetName] souhlasí s aliancí" # todo: NEW TRANSLATION
 BA_romania.38.desc: "Obdrželi jsme zprávu z [FROM.capital.GetCapitalVictoryPointName], že [FROM.GetNameDef] naši nabídku vojenské aliance přijal kladně. Za několik dní se mají setkat naši ministři zahraničí a dohodu dokončit." # todo: NEW TRANSLATION
 BA_romania.38.a: "Společně jsme silnější" # todo: NEW TRANSLATION
 BA_romania.39.t: "[FROM.GetName] odmítá alianci" # todo: NEW TRANSLATION
 BA_romania.39.desc: "Zástupci [FROM.GetAdjective] nám oznámili, že jejich země nemá zájem rozšiřovat spojenecké smlouvy, které z nás vytvořily Malou dohodu, do něčeho závaznějšího. Možná stále pošetile věří, že jim prospěje zachovat si určitou míru neutrality." # todo: NEW TRANSLATION
 BA_romania.39.a: "To je škoda" # todo: NEW TRANSLATION
 BA_romania_demand_referendum.1.t: "Železná garda požaduje referendum" # todo: NEW TRANSLATION
 BA_romania_demand_referendum.1.d: "Vzhledem k rychle rostoucí politické i vojenské síle Železné gardy její členové nyní pochodují ulicemi Bukurešti k sídlu parlamentu. Jejich volání po rozpuštění monarchie a svrhnutí současného režimu zní s každým krokem k parlamentu hlasitěji a hlasitěji.\n\nK pochodu se přidává stále více lidí a volání po zásadní změně každou vteřinou sílí. V čele davu kráčejí Corneliu Codreanu, Horia Sima a Octavian Goga. Za nimi pochoduje polovojenské křídlo Železné gardy, následované tisíci civilistů.\n\nKdyž dorazí k budově, Corneliu, Horia a Octavian vstoupí dovnitř v doprovodu dvanácti mužů.\n\nO tři hodiny později se tato trojice vrací a oznamuje, že současný režim jednostranně odstoupil. Již se také šíří zprávy, že královská rodina uprchla ze země.\n\nOctavian Goga následně oznamuje, že bude dočasně hlavou státu, dokud nebudou připraveny řádné postupy, které Corneliuovi Codreanovi a Horiovi Simovi umožní společně vytvořit legionářský stát." # todo: NEW TRANSLATION
 BA_romania_demand_referendum.1.a: "Rumunské království je mrtvé, ať žije legionářský stát!" # todo: NEW TRANSLATION
 BA_romania_demand_referendum.2.t: "Protigardistické strany se bouří v ulicích" # todo: NEW TRANSLATION
 BA_romania_demand_referendum.2.d: "Jak se dalo čekat, ostatním rumunským politickým stranám netrvalo dlouho, než se chopily zbraní a uvrhly zemi do chaosu. Po referendu vyzvali aktivnější členové ostatních stran své příznivce, aby se chopili zbraní a pokusili se svrhnout uzurpátory, kteří se tak nestydatě zmocnili vlády nad zemí vojenskou silou a pohrdli řádnými politickými a demokratickými postupy.\n\nZbraněmi se nevyzbrojily pouze prodemokratické strany. Zdá se, že ze stínů vycházejí také komunisté, kteří se dosud skrývali, připraveni bojovat za své místo v Rumunsku." # todo: NEW TRANSLATION
 BA_romania_demand_referendum.2.a: "Okamžitě tam pošlete polovojenské jednotky a vypořádejte se s nimi!" # todo: NEW TRANSLATION
 BA_romania_demand_referendum.3.t: "Protigardistické nepokoje potlačeny" # todo: NEW TRANSLATION
 BA_romania_demand_referendum.3.d: "Trvalo to téměř dva týdny, ale konečně byl zlomen poslední odpor proti nové vládě a v zemi [ROM.GetNameDef] byl obnoven pořádek.\n\nRumunsko je po těchto nepokojích zraněné, ale ještě není na kolenou. Octavian Goga prohlásil, že dokud nebudou napraveny škody, které napáchali tito teroristé, nebude [ROM.GetNameDef] v bezpečí.\n\nVyzývá každého Rumuna, který věří ve svou vlast a miluje ji, aby hlásil jakoukoli protirumunskou činnost." # todo: NEW TRANSLATION
 BA_romania_demand_referendum.3.a: "Konečně se můžeme pustit do práce" # todo: NEW TRANSLATION
 BA_romania_sideline_codreanu.1.t: "Corneliu Codreanu umírá při nehodě" # todo: NEW TRANSLATION
 BA_romania_sideline_codreanu.1.d: "Uplynuly sotva dva měsíce od chvíle, kdy Železná garda zajistila svou moc nad Rumunskem a vyřízla nádor, kterým byla monarchie. Triumvirát, jenž se tak odvážně chopil vlády nad zemí a odklonil ji od cesty vedoucí k chaosu, od té doby usilovně pracuje na položení základů prosperujícího a bezpečnějšího Rumunska.\n\nBohužel se zdá, že Smrtka měla jiné plány. Automobil, v němž tato trojice často cestovala do přestavěné budovy parlamentu, byl dnes časně ráno nalezen převrácený vedle mostu, přes který pravidelně jezdili.\n\nUvnitř vozu byli nalezeni mrtví Corneliu Codreanu a řidič skupiny. Podle předběžného vyšetřování řidič při těsném vyhnutí se protijedoucímu automobilu prudce strhl volant doprava, což způsobilo, že se vůz zřítil ze svahu mostu. Oba muži podle všeho zemřeli při nárazu.\n\nPro [ROM.GetNameDef] a Železnou gardu je naštěstí Horia Sima naživu. Odjel dříve na schůzku s Octavianem Gogou, aby s ním projednal předání moci nyní zesnulému vůdci Železné gardy.\n\nPo veřejném pohřbu bylo oznámeno, že Horia Sima převezme vedení Rumunska a dovede ho k prosperující budoucnosti." # todo: NEW TRANSLATION
 BA_romania_sideline_codreanu.1.a: "To je všechno tak trochu… podezřelé, nemyslíte?" # todo: NEW TRANSLATION
 BA_romania_codreanu_ascendant.1.t: "Codreanu se ujímá moci" # todo: NEW TRANSLATION
 BA_romania_codreanu_ascendant.1.d: "Od chvíle, kdy Železná garda převzala vládu a rozebrala staré instituce, které by do konce tohoto desetiletí přivedly Rumunsko k záhubě, uplynuly téměř dva měsíce. Po období rostoucí stability nyní Octavian Goga konečně oznámil, že vedení Rumunska převezme zakladatel Železné gardy Corneliu Codreanu." # todo: NEW TRANSLATION
 BA_romania_codreanu_ascendant.1.a: "Za nové a slavné Rumunsko!" # todo: NEW TRANSLATION
 BA_romania_balkan_front.1.t: "[FROM.GetNameDefCap] znovu potvrzuje své nároky na [764.GetName]" # todo: NEW TRANSLATION
 BA_romania_balkan_front.1.d: "Ačkoli se bukurešťská vláda bezprostředně po skončení Velké války vzdala svých nároků na stát Západní Banát, zdá se, že nový režim má jiné plány. Nyní znovu potvrzuje svůj nárok na celý Banát, včetně [764.GetName], který leží na našem území.\n\nNení jisté, zda se tyto nároky skutečně pokusí prosadit, ale musíme se připravit pro případ, že se pokusí zmocnit toho, co si nárokují." # todo: NEW TRANSLATION
 BA_romania_balkan_front.1.a: "Jen ať si ti bastardi přijdou." # todo: NEW TRANSLATION
 BA_romania_balkan_front.2.t: "[FROM.GetNameDefCap] znovu potvrzuje své nároky na [154.GetName]" # todo: NEW TRANSLATION
 BA_romania_balkan_front.2.d: "Bezprostředně po skončení Velké války postupovala vojska [FROM.GetNameDef] až k Budapešti, než jim mocnosti Dohody nařídily stáhnout se. Spojenecké mocnosti při tom také stáhly svou podporu jakýchkoli nároků [FROM.GetAdjective] na [154.GetName].\n\nZdá se však, že nový režim, který nyní sídlí v Bukurešti, buď na tuto část dějin zapomněl, nebo se rozhodl vznést nový nárok na [154.GetName]. Podle toho, co se nám podařilo zjistit, se připravuje zmocnit se ho, nejspíš silou." # todo: NEW TRANSLATION
 BA_romania_balkan_front.2.a: "Jen ať si ti bastardi přijdou." # todo: NEW TRANSLATION
 ROM_execute_the_nazi_leadership: "Vedení nacistů bude odsouzeno k smrti" # todo: NEW TRANSLATION
 BA_romania_the_impaler.1.t: "Vedení nacistů zajato" # todo: NEW TRANSLATION
 BA_romania_the_impaler.1.d: "Po několika měsících bojů s Němci i proti nim jsme konečně prolomili poslední obranné linie Berlína a naše síly nyní plně ovládají město.\n\nZdá se, že vláda [GER.GetAdjective] nebyla na naše dobytí města připravena. Našim předsunutým jednotkám se podařilo zajmout nacistické vedení, když se pokoušelo uprchnout z města a pokračovat ve válce jinde.\n\nNyní před námi stojí nová otázka: co s nimi uděláme?" # todo: NEW TRANSLATION
 BA_romania_the_impaler.1.a: "Pošlete je k [SOV.GetAdjective]ům, ti si s nimi poradí." # todo: NEW TRANSLATION
 BA_romania_the_impaler.1.b: "Mají být odsouzeni k smrti!" # todo: NEW TRANSLATION
